# Git 배포 적용: main 푸시 시 Cloudflare Workers로 자동 배포
# 필수 GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   CLOUDFLARE_ZONE_ID (캐시 퍼지용 — API 토큰에 Zone > Cache Purge 권한 필요),
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#   NEXT_PUBLIC_POLAR_PRODUCT_PRO, NEXT_PUBLIC_POLAR_PRODUCT_PRO_YEARLY,
#   NEXT_PUBLIC_POLAR_PRODUCT_TEAM, NEXT_PUBLIC_POLAR_PRODUCT_TEAM_YEARLY,
#   NEXT_PUBLIC_CLARITY_ID,
#   POLAR_ACCESS_TOKEN, POLAR_WEBHOOK_SECRET
# 서버 시크릿(POLAR_ACCESS_TOKEN 등)은 Cloudflare 대시보드 > Workers > Settings > Variables에도 설정 필요
# 설정: Repository → Settings → Secrets and variables → Actions
name: Deploy to Cloudflare Workers

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 잘못된 anon 키(잘림·레거시·비활성)가 번들에 인라인되는 것을 배포 전에 차단
      # — 2026-08-01 비활성 레거시 키·앞글자 잘린 Secret이 그대로 빌드되어 전면 401 두 차례 발생
      - name: Validate Supabase anon key
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*) ;;
            *)
              echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY가 sb_publishable_ 접두사가 아님 — Secret 값 잘림/레거시 키 의심"
              exit 1;;
          esac
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase가 anon 키를 거부함 (auth health HTTP $STATUS) — 폐기/비활성 키로 배포 중단"
            exit 1
          fi
          echo "✅ anon 키 검증 통과"

      - name: Build for Cloudflare
        run: npm run build:cf
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://linkmap.biz
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_POLAR_PRODUCT_PRO: ${{ secrets.NEXT_PUBLIC_POLAR_PRODUCT_PRO }}
          NEXT_PUBLIC_POLAR_PRODUCT_TEAM: ${{ secrets.NEXT_PUBLIC_POLAR_PRODUCT_TEAM }}
          NEXT_PUBLIC_POLAR_PRODUCT_PRO_YEARLY: ${{ secrets.NEXT_PUBLIC_POLAR_PRODUCT_PRO_YEARLY }}
          NEXT_PUBLIC_POLAR_PRODUCT_TEAM_YEARLY: ${{ secrets.NEXT_PUBLIC_POLAR_PRODUCT_TEAM_YEARLY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUPABASE_WEBHOOK_SECRET: ${{ secrets.SUPABASE_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}

      - name: Set Cloudflare Workers secrets
        continue-on-error: true
        run: |
          echo "$POLAR_ACCESS_TOKEN" | npx wrangler secret put POLAR_ACCESS_TOKEN
          echo "$POLAR_WEBHOOK_SECRET" | npx wrangler secret put POLAR_WEBHOOK_SECRET
          echo "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          echo "$SUPABASE_WEBHOOK_SECRET" | npx wrangler secret put SUPABASE_WEBHOOK_SECRET
          echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_WEBHOOK_SECRET: ${{ secrets.SUPABASE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Check server bundle size
        run: |
          if [ -f ".open-next/worker.js" ]; then
            SIZE=$(stat -c%s ".open-next/worker.js" 2>/dev/null || stat -f%z ".open-next/worker.js" 2>/dev/null || echo "0")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "📦 Worker bundle size: ${SIZE_MB}MB (${SIZE} bytes)"
            if [ "$SIZE_MB" -gt 10 ]; then
              echo "::warning::Worker bundle exceeds 10MB (${SIZE_MB}MB). Consider code splitting or removing large dependencies."
            fi
          else
            echo "⚠️ .open-next/worker.js not found, skipping size check"
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 엣지 캐시 퍼지 — HTML이 s-maxage 장기 캐시라 퍼지 없이는 구 빌드(구 키·404 청크)가
      # 배포 후에도 계속 서빙됨 (2026-07-12 키 로테이션 후 ~12시간 스테일 사고 재발 방지)
      - name: Purge Cloudflare cache
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_ZONE_ID }}" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID secret 미설정 — 캐시 퍼지 건너뜀 (스테일 HTML 잔존 위험)"
            exit 0
          fi
          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESULT"
          if ! echo "$RESULT" | grep -q '"success":true'; then
            echo "::warning::캐시 퍼지 실패 — API 토큰에 Zone > Cache Purge 권한이 있는지 확인 필요"
            exit 1
          fi
          echo "✅ 엣지 캐시 퍼지 완료"

      - name: Warm ISR cache
        continue-on-error: true
        run: bash scripts/warm-cache.sh https://linkmap.biz
