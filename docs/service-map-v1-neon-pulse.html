<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkmap Service Map — Neon Pulse</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at center, #0f172a 0%, #000000 70%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden; color: #e2e8f0;
  }
  .canvas { position: relative; width: 1200px; height: 700px; }

  /* Hub */
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 120px; height: 120px; z-index: 10;
  }
  .hub-ring {
    width: 120px; height: 120px; border-radius: 50%;
    background: conic-gradient(
      #22c55e 0deg, #22c55e 225deg,
      #facc15 225deg, #facc15 270deg,
      #f97316 270deg, #f97316 315deg,
      #64748b 315deg, #64748b 360deg
    );
    padding: 4px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(0,245,255,0.35), 0 0 80px rgba(0,245,255,0.15);
    animation: hubPulse 3s ease-in-out infinite;
  }
  @keyframes hubPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(0,245,255,0.35), 0 0 80px rgba(0,245,255,0.15); }
    50% { box-shadow: 0 0 55px rgba(0,245,255,0.5), 0 0 100px rgba(0,245,255,0.25); }
  }
  .hub-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(135deg, #0c1527, #0f1d35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
  }
  .hub-icon { font-size: 28px; filter: drop-shadow(0 0 6px rgba(0,245,255,0.6)); }
  .hub-label { font-size: 11px; font-weight: 700; color: #00f5ff; letter-spacing: 0.5px; }

  /* Service Nodes */
  .service-node {
    position: absolute; width: 150px; z-index: 10;
    background: rgba(10,14,30,0.92); border: 1.5px solid; border-radius: 10px;
    padding: 0; overflow: hidden; cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .service-node:hover {
    transform: scale(1.08);
    z-index: 20;
  }
  .node-accent { width: 100%; height: 3px; }
  .node-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .node-header { display: flex; align-items: center; gap: 8px; }
  .node-icon { font-size: 20px; }
  .node-name { font-size: 12px; font-weight: 700; color: #f1f5f9; }
  .node-category { font-size: 10px; color: #94a3b8; font-weight: 500; }
  .node-status { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-label { font-size: 10px; font-weight: 600; }
  .status-connected .status-dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .status-connected .status-label { color: #4ade80; }
  .status-progress .status-dot { background: #facc15; box-shadow: 0 0 6px #facc15; animation: blink 1.5s infinite; }
  .status-progress .status-label { color: #fde047; }
  .status-error .status-dot { background: #f97316; box-shadow: 0 0 6px #f97316; animation: blink 1s infinite; }
  .status-error .status-label { color: #fb923c; }
  .status-notstarted .status-dot { background: #64748b; }
  .status-notstarted .status-label { color: #94a3b8; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* SVG layer */
  .edge-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }

  /* Tooltip */
  .tooltip {
    position: absolute; background: rgba(15,23,42,0.95); border: 1px solid #334155;
    border-radius: 8px; padding: 10px 14px; font-size: 11px; color: #cbd5e1;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 100;
    max-width: 200px; line-height: 1.5; backdrop-filter: blur(8px);
  }
</style>
</head>
<body>

<div class="canvas" id="canvas">
  <svg class="edge-layer" id="edgeSvg"></svg>
  <div class="hub">
    <div class="hub-ring"><div class="hub-inner">
      <div class="hub-icon">&#x1F310;</div>
      <div class="hub-label">My Project</div>
    </div></div>
  </div>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
const SERVICES = [
  { id:'supabase', name:'Supabase',   cat:'Database',  icon:'&#x1F5C4;', color:'#3ecf8e', status:'connected',  tip:'PostgreSQL DB — 42 tables, healthy' },
  { id:'vercel',   name:'Vercel',     cat:'Deploy',    icon:'&#x25B2;',  color:'#ffffff', status:'connected',  tip:'Production deployment — v2.4.1 live' },
  { id:'stripe',   name:'Stripe',     cat:'Payment',   icon:'&#x1F4B3;', color:'#635bff', status:'connected',  tip:'Payment processing — 12 webhooks active' },
  { id:'resend',   name:'Resend',     cat:'Email',     icon:'&#x2709;',  color:'#8b5cf6', status:'progress',   tip:'Email service — configuring templates' },
  { id:'clerk',    name:'Clerk',      cat:'Auth',      icon:'&#x1F512;', color:'#6c47ff', status:'connected',  tip:'Authentication — Google & GitHub OAuth' },
  { id:'openai',   name:'OpenAI',     cat:'AI',        icon:'&#x1F916;', color:'#10a37f', status:'connected',  tip:'GPT-4 — module analysis pipeline' },
  { id:'sentry',   name:'Sentry',     cat:'Monitor',   icon:'&#x1F6E1;', color:'#f97316', status:'error',      tip:'Error tracking — API key expired' },
  { id:'cloudflare',name:'CloudFlare',cat:'CDN',       icon:'&#x2601;',  color:'#f6821f', status:'notstarted', tip:'CDN & Workers — not configured' },
];

const CX = 600, CY = 350, RADIUS = 250;
const canvas = document.getElementById('canvas');
const svg = document.getElementById('edgeSvg');
const tooltip = document.getElementById('tooltip');

const statusMap = {
  connected: { cls:'status-connected', label:'Connected' },
  progress:  { cls:'status-progress',  label:'In Progress' },
  error:     { cls:'status-error',     label:'Error' },
  notstarted:{ cls:'status-notstarted',label:'Not Started' },
};

// Place nodes
SERVICES.forEach((s, i) => {
  const angle = (i / SERVICES.length) * Math.PI * 2 - Math.PI / 2;
  const x = CX + Math.cos(angle) * RADIUS;
  const y = CY + Math.sin(angle) * RADIUS;
  s.x = x; s.y = y;

  const st = statusMap[s.status];
  const node = document.createElement('div');
  node.className = 'service-node';
  node.style.left = (x - 75) + 'px';
  node.style.top = (y - 42) + 'px';
  node.style.borderColor = s.color + '66';
  node.style.boxShadow = `0 0 15px ${s.color}22`;
  node.innerHTML = `
    <div class="node-accent" style="background:${s.color}"></div>
    <div class="node-body">
      <div class="node-header">
        <span class="node-icon">${s.icon}</span>
        <div><div class="node-name">${s.name}</div><div class="node-category">${s.cat}</div></div>
      </div>
      <div class="node-status ${st.cls}">
        <div class="status-dot"></div>
        <span class="status-label">${st.label}</span>
      </div>
    </div>`;
  node.addEventListener('mouseenter', e => {
    node.style.boxShadow = `0 0 30px ${s.color}55, 0 0 60px ${s.color}22`;
    tooltip.style.opacity = '1';
    tooltip.innerHTML = `<strong style="color:${s.color}">${s.name}</strong><br>${s.tip}`;
    const r = node.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
    tooltip.style.left = (r.left - cr.left + 75 - 100) + 'px';
    tooltip.style.top = (r.top - cr.top - 50) + 'px';
  });
  node.addEventListener('mouseleave', () => {
    node.style.boxShadow = `0 0 15px ${s.color}22`;
    tooltip.style.opacity = '0';
  });
  canvas.appendChild(node);
});

// Draw edges + particles
const NS = 'http://www.w3.org/2000/svg';
svg.setAttribute('viewBox', '0 0 1200 700');

SERVICES.forEach((s, i) => {
  const edgeColor = s.color;
  const opacity = s.status === 'notstarted' ? 0.3 : 0.8;

  // Edge line
  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', CX); line.setAttribute('y1', CY);
  line.setAttribute('x2', s.x); line.setAttribute('y2', s.y);
  line.setAttribute('stroke', edgeColor);
  line.setAttribute('stroke-width', '2');
  line.setAttribute('stroke-opacity', opacity);
  if (s.status === 'notstarted') {
    line.setAttribute('stroke-dasharray', '6 4');
  }
  svg.appendChild(line);

  // Glow filter
  if (i === 0) {
    const defs = document.createElementNS(NS, 'defs');
    const filter = document.createElementNS(NS, 'filter');
    filter.id = 'glow';
    filter.innerHTML = '<feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(filter);
    svg.insertBefore(defs, svg.firstChild);
  }

  // Animated particles (skip not-started)
  if (s.status !== 'notstarted') {
    const count = s.status === 'error' ? 1 : 2;
    for (let p = 0; p < count; p++) {
      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('r', s.status === 'error' ? '3' : '3.5');
      circle.setAttribute('fill', edgeColor);
      circle.setAttribute('filter', 'url(#glow)');
      circle.setAttribute('opacity', '0.9');

      const anim = document.createElementNS(NS, 'animateMotion');
      const dur = s.status === 'progress' ? '4s' : '3s';
      anim.setAttribute('dur', dur);
      anim.setAttribute('repeatCount', 'indefinite');
      anim.setAttribute('begin', (p * 1.5) + 's');
      anim.setAttribute('path', `M${CX},${CY} L${s.x},${s.y}`);
      circle.appendChild(anim);
      svg.appendChild(circle);
    }
  }
});

// Hub center marker in SVG
const hubGlow = document.createElementNS(NS, 'circle');
hubGlow.setAttribute('cx', CX); hubGlow.setAttribute('cy', CY);
hubGlow.setAttribute('r', '65'); hubGlow.setAttribute('fill', 'none');
hubGlow.setAttribute('stroke', '#00f5ff'); hubGlow.setAttribute('stroke-width', '1');
hubGlow.setAttribute('stroke-opacity', '0.15');
svg.appendChild(hubGlow);
</script>
</body>
</html>
