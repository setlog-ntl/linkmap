<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkmap 프로젝트 분석 챗봇</title>

  <!-- Pretendard Variable -->
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14.0.0/marked.min.js"></script>
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <style>
    /* ──────────────────────────────────────────────
       CSS — Circuit Blue-Green v2 Dark Theme
    ────────────────────────────────────────────── */
    :root {
      --bg: #0f1d2f;
      --card: #162436;
      --surface: #1e3048;
      --brand-blue: #3b82f6;
      --brand-green: #2bee79;
      --brand-blue-dim: #1e3a5f;
      --brand-green-dim: #163b2a;
      --text: #e5ecf4;
      --text-secondary: #94a8be;
      --muted: #6b88a4;
      --border: #243a52;
      --danger: #ef4444;
      --radius: 12px;
      --font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: 'Geist Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ── App Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(43,238,121,0.05));
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-green));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-actions { display: flex; gap: 8px; }
    .header-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .header-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* ── Messages Area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--brand-blue-dim);
      border: 1px solid rgba(59,130,246,0.25);
      color: var(--text);
    }
    .msg-ai {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .msg-error {
      align-self: center;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      font-size: 13px;
      text-align: center;
    }

    /* ── Markdown Rendering ── */
    .msg-ai h1, .msg-ai h2, .msg-ai h3, .msg-ai h4 {
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--text);
    }
    .msg-ai h1 { font-size: 18px; }
    .msg-ai h2 { font-size: 16px; }
    .msg-ai h3 { font-size: 15px; }
    .msg-ai p { margin-bottom: 8px; }
    .msg-ai ul, .msg-ai ol { margin-left: 20px; margin-bottom: 8px; }
    .msg-ai li { margin-bottom: 4px; }
    .msg-ai strong { color: var(--brand-blue); font-weight: 600; }
    .msg-ai a { color: var(--brand-green); text-decoration: underline; }
    .msg-ai blockquote {
      border-left: 3px solid var(--brand-blue);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--text-secondary);
    }
    .msg-ai table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 13px;
    }
    .msg-ai th, .msg-ai td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    .msg-ai th { background: var(--surface); font-weight: 600; }

    /* ── Code blocks ── */
    .msg-ai code {
      font-family: var(--mono);
      font-size: 13px;
    }
    .msg-ai :not(pre) > code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12.5px;
    }
    .code-block-wrapper {
      position: relative;
      margin: 8px 0;
    }
    .code-block-wrapper pre {
      background: #0d1117 !important;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0;
    }
    .code-block-wrapper pre code {
      font-size: 13px;
      line-height: 1.5;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--font);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .code-block-wrapper:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text); background: var(--border); }
    .copy-btn.copied { color: var(--brand-green); }

    /* ── Streaming cursor ── */
    .streaming-cursor::after {
      content: '▊';
      animation: blink 0.8s infinite;
      color: var(--brand-green);
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* ── Quick Actions ── */
    .quick-actions {
      padding: 0 20px 12px;
      flex-shrink: 0;
    }
    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .qa-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12.5px;
      font-family: var(--font);
      text-align: left;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .qa-btn:hover {
      background: var(--surface);
      color: var(--text);
      border-color: var(--brand-blue);
    }
    .qa-btn .qa-icon {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
    }
    .qa-btn .qa-label {
      font-weight: 600;
      font-size: 12.5px;
    }

    /* ── Input Area ── */
    .input-area {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .input-row textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      resize: none;
      font-size: 14px;
      font-family: var(--font);
      line-height: 1.5;
      min-height: 42px;
      max-height: 150px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-row textarea:focus { border-color: var(--brand-blue); }
    .input-row textarea::placeholder { color: var(--muted); }

    .send-btn {
      background: linear-gradient(135deg, var(--brand-blue), #2563eb);
      border: none;
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { filter: brightness(1.1); }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: none;
    }
    .send-btn.stop-btn {
      background: var(--danger);
    }

    .model-tag {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Settings Overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,29,47,0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
    }
    .overlay.visible { opacity: 1; visibility: visible; }

    .settings-modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 420px;
      max-width: 92vw;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .settings-modal h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-group select,
    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: var(--font);
      outline: none;
    }
    .form-group select:focus,
    .form-group input:focus { border-color: var(--brand-blue); }
    .form-group select { cursor: pointer; }
    .form-group select option { background: var(--card); }
    .form-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, var(--brand-blue), #2563eb);
      border: none;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      font-family: var(--font);
      transition: filter 0.15s;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13.5px;
      font-family: var(--font);
    }
    .btn-secondary:hover { color: var(--text); background: var(--border); }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    .welcome-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-green));
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 16px;
    }
    .welcome h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .welcome p {
      font-size: 13.5px;
      max-width: 400px;
      margin: 0 auto;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .quick-actions-grid { grid-template-columns: repeat(2, 1fr); }
      .msg { max-width: 95%; }
      .header h1 { font-size: 14px; }
      .settings-modal { padding: 20px; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════
     Settings Overlay
════════════════════════════════════════════ -->
<div id="settings-overlay" class="overlay">
  <div class="settings-modal">
    <h2>&#9881; 설정</h2>

    <div class="form-group">
      <label>AI 프로바이더</label>
      <select id="sel-provider">

      </select>

    <div class="form-group">

      <select id="sel-model">
        <option value="gpt-4o">gpt-4o</option>

<!-- ════════════════════════════════════════════
     Chat App

<div id="app">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-logo">L</div>
      <h1>Linkmap 프로젝트 분석</h1>

    <div class="header-actions">

      <button class="qa-btn" onclick="sendQuickAction(1)">
        <span class="qa-icon">&#128161;</span>
        <span class="qa-label">기능 고도화 제안</span>
      </button>
      <button class="qa-btn" onclick="sendQuickAction(2)">
        <span class="qa-icon">&#128295;</span>

<script>
// ═══════════════════════════════════════════════════════════════════
// System Prompt — Linkmap 프로젝트 전체 컨텍스트
// ═══════════════════════════════════════════════════════════════════
const SYSTEM_PROMPT = `당신은 Linkmap 프로젝트의 수석 기술 고문 AI입니다. 프로젝트의 아키텍처, 기능, 기술적 맥락을 완벽히 이해하고, 프로젝트 고도화를 위한 전략적 조언을 제공합니다. 항상 한국어로 응답합니다.

## 프로젝트 개요
Linkmap은 **외부 서비스 연결 시각화 + API 키·환경변수 관리 플랫폼**입니다.
- **대상 사용자**: 개발자, 1인 창업자, 소규모 팀
- **핵심 가치**: 흩어진 SaaS API 키와 환경변수를 한곳에서 안전하게 관리하고, 서비스 간 연결 관계를 시각적으로 파악

## 기술 스택
- **Framework**: Next.js 16 (App Router) + TypeScript (strict)
- **Database**: Supabase (PostgreSQL 15+ / Auth / RLS)
- **UI**: Tailwind CSS v4 + shadcn/ui v4 + Pretendard Variable 폰트
- **State**: TanStack Query (서버 상태) + Zustand (클라이언트 상태)
- **Visualization**: React Flow (@xyflow/react) — 서비스맵 노드 그래프
- **Validation**: Zod v4 (safeParse 필수)
- **Encryption**: AES-256-GCM (환경변수 암호화)
- **Deploy**: Cloudflare Workers (@opennextjs/cloudflare)
- **Design**: Circuit Blue-Green v2 디자인 시스템

## 핵심 기능 9가지

### 1. 서비스 카탈로그
- 200+ 외부 서비스(Stripe, Supabase, OpenAI 등) 데이터베이스
- 카테고리/도메인/태그 기반 검색·필터
- 커스텀 서비스 등록 지원
- 시드 데이터: \`src/data/seed/\` (services.ts, domains.ts, subcategories.ts 등)

### 2. 서비스맵 (시각화)
- React Flow 기반 노드 그래프
- 프로젝트에 연결된 서비스들의 관계를 시각적으로 표현
- 드래그&드롭, 줌, 패닝 지원
- 메인 서비스 노드 설정 가능

### 3. 환경변수 관리
- AES-256-GCM 암호화 저장
- 서비스별 환경변수 그룹핑
- .env 파일 내보내기
- 헬스체크 (API 키 유효성 검증)

### 4. AI 서브시스템
- 6개 AI 기능: 서비스 추천, 기능 Q&A, 아키텍처 진단, 보안 감사, 비용 분석, 서비스 비교
- 3가지 호출 모드: Structured Output, Function Calling, Streaming
- 멀티프로바이더: OpenAI / Anthropic / Google
- AI 사용량 추적 (ai_usage_logs)

### 5. 원클릭 배포 (One-Click Deploy)
- 6개 홈페이지 템플릿: 프리랜서 포트폴리오, 디지털 명함, 개발자 쇼케이스, 퍼스널 브랜드, SNS 링크허브, 소상공인 홍보
- 모듈식 에디터 (hero, about, portfolio 등 모듈 조합)
- 서브도메인 퍼블리싱 (username.linkmap.site)

### 6. GitHub 연동
- 멀티 계정 지원 (GitHub OAuth)
- 레포지토리 목록 조회, 환경변수 동기화

// ═══════════════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════════════
function init() {
  updateModelTag();
  restoreMessages();
  if (!state.apiKey) openSettings();

  // Textarea auto-resize
  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 150) + 'px';
  });

  // Keyboard
  $input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  // Provider change -> update model options
  $provider.addEventListener('change', () => {
    updateModelSelect($provider.value);
  });
}

function updateModelTag() {
  const providerLabel = { openai: 'OpenAI', anthropic: 'Anthropic', google: 'Google' };
  $modelTag.textContent = state.apiKey
    ? `${providerLabel[state.provider] || state.provider} · ${state.model}`
    : '설정에서 API 키를 입력하세요';
}

function updateModelSelect(provider) {
  const opts = MODEL_OPTIONS[provider] || MODEL_OPTIONS.openai;
  $model.innerHTML = opts.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
}

// ═══════════════════════════════════════════════════════════════════
// Settings
// ═══════════════════════════════════════════════════════════════════
function openSettings() {
  $provider.value = state.provider;
  updateModelSelect(state.provider);
  $model.value = state.model;
  $apiKey.value = state.apiKey;
  $overlay.classList.add('visible');
}

function closeSettings() {
  $overlay.classList.remove('visible');
}

function saveSettings() {
  state.provider = $provider.value;
  state.model = $model.value;
  state.apiKey = $apiKey.value.trim();

  localStorage.setItem('lm-provider', state.provider);
  localStorage.setItem('lm-model', state.model);
  localStorage.setItem('lm-apikey', state.apiKey);

  updateModelTag();
  closeSettings();
}

// ═══════════════════════════════════════════════════════════════════
// Messages
// ═══════════════════════════════════════════════════════════════════
function restoreMessages() {
  if (state.messages.length === 0) return;
  $welcome.style.display = 'none';
  $quickActions.style.display = 'none';
  state.messages.forEach(m => renderMessage(m.role, m.content, false));
  scrollToBottom();
}

function saveMessages() {
  const trimmed = state.messages.slice(-50);
  localStorage.setItem('lm-messages', JSON.stringify(trimmed));
}

function addMessage(role, content) {
  state.messages.push({ role, content });
  saveMessages();
}

function renderMessage(role, content, animate = true) {
  if (state.messages.length > 0) {
    $welcome.style.display = 'none';
    $quickActions.style.display = 'none';
  }

  const div = document.createElement('div');
  div.className = role === 'user' ? 'msg msg-user' : 'msg msg-ai';

  if (role === 'user') {
    div.textContent = content;
  } else {
    div.innerHTML = renderMarkdown(content);
  }

  $messages.appendChild(div);
  if (animate) scrollToBottom();
  return div;
}

function renderErrorMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-error';
  div.textContent = text;
  $messages.appendChild(div);
  scrollToBottom();
}

function renderMarkdown(text) {
  let html = marked.parse(text);
  // Wrap code blocks with copy button
  html = html.replace(/<pre><code(.*?)>([\s\S]*?)<\/code><\/pre>/g, (match, attrs, code) => {
    return `<div class="code-block-wrapper"><button class="copy-btn" onclick="copyCode(this)">복사</button><pre><code${attrs}>${code}</code></pre></div>`;
  });
  return html;
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    $messages.scrollTop = $messages.scrollHeight;
  });
}

// ═══════════════════════════════════════════════════════════════════
// Copy code
// ═══════════════════════════════════════════════════════════════════
function copyCode(btn) {
  const code = btn.parentElement.querySelector('code');
  const text = code.textContent;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '완료!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '복사';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// ═══════════════════════════════════════════════════════════════════
// Send
// ═══════════════════════════════════════════════════════════════════
async function handleSend() {
  const text = $input.value.trim();
  if (!text || state.isStreaming) return;

  if (!state.apiKey) {
    openSettings();
    return;
  }

  // Render user message
  addMessage('user', text);
  renderMessage('user', text);
  $input.value = '';
  $input.style.height = 'auto';

  // Start streaming
  state.isStreaming = true;
  $sendBtn.innerHTML = '&#9632;';
  $sendBtn.classList.add('stop-btn');
  $sendBtn.onclick = stopStreaming;

  const aiDiv = document.createElement('div');
  aiDiv.className = 'msg msg-ai streaming-cursor';
  $messages.appendChild(aiDiv);
  scrollToBottom();

  abortController = new AbortController();
  let fullText = '';

  try {
    const apiMessages = state.messages
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .slice(-20);

    switch (state.provider) {
      case 'openai':
        fullText = await streamOpenAI(apiMessages, aiDiv);
        break;
      case 'anthropic':
        fullText = await streamAnthropic(apiMessages, aiDiv);
        break;
      case 'google':
        fullText = await streamGoogle(apiMessages, aiDiv);
        break;
      default:
        throw new Error('지원하지 않는 프로바이더입니다.');
    }

    addMessage('assistant', fullText);
  } catch (err) {
    if (err.name === 'AbortError') {
      // User aborted
      if (fullText) addMessage('assistant', fullText);
    } else {
      renderErrorMessage(err.message || '알 수 없는 오류가 발생했습니다.');
    }
  }

  // Finalize
  aiDiv.classList.remove('streaming-cursor');
  if (fullText) {
    aiDiv.innerHTML = renderMarkdown(fullText);
  }

  state.isStreaming = false;
  $sendBtn.innerHTML = '&#10148;';
  $sendBtn.classList.remove('stop-btn');
  $sendBtn.onclick = handleSend;
  scrollToBottom();
}

function stopStreaming() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
}

// ═══════════════════════════════════════════════════════════════════
// OpenAI Streaming
// ═══════════════════════════════════════════════════════════════════
async function streamOpenAI(messages, targetDiv) {
  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.apiKey}`,
    },
    body: JSON.stringify({
      model: state.model,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        ...messages,
      ],
      temperature: 0.4,
      max_tokens: 8192,
      stream: true,
    }),
    signal: abortController.signal,
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => '');
    throwApiError(response.status, errText);
  }

  return await parseSSE(response, targetDiv, (parsed) => {
    return parsed.choices?.[0]?.delta?.content || '';
  });
}

// ═══════════════════════════════════════════════════════════════════
// Anthropic Streaming
// ═══════════════════════════════════════════════════════════════════
async function streamAnthropic(messages, targetDiv) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: state.model,
      system: SYSTEM_PROMPT,
      messages: messages.map(m => ({
        role: m.role === 'system' ? 'user' : m.role,
        content: m.content,
      })),
      max_tokens: 8192,
      temperature: 0.4,
      stream: true,
    }),
    signal: abortController.signal,
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => '');
    throwApiError(response.status, errText);
  }

  return await parseSSE(response, targetDiv, (parsed) => {
    if (parsed.type === 'content_block_delta' && parsed.delta?.type === 'text_delta') {
      return parsed.delta.text || '';
    }
    return '';
  });
}

// ═══════════════════════════════════════════════════════════════════
// Google Streaming
// ═══════════════════════════════════════════════════════════════════
async function streamGoogle(messages, targetDiv) {
  const contents = messages.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }],
  }));

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:streamGenerateContent?alt=sse&key=${state.apiKey}`,
    {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents,
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        generationConfig: {
          temperature: 0.4,
          maxOutputTokens: 8192,
        },
      }),
      signal: abortController.signal,
    }
  );

  if (!response.ok) {
    const errText = await response.text().catch(() => '');
    throwApiError(response.status, errText);
  }

  return await parseSSE(response, targetDiv, (parsed) => {
    return parsed.candidates?.[0]?.content?.parts?.[0]?.text || '';
  });
}

// ═══════════════════════════════════════════════════════════════════
// Shared SSE parser
// ═══════════════════════════════════════════════════════════════════
async function parseSSE(response, targetDiv, extractChunk) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop() || '';

    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || !trimmed.startsWith('data:')) continue;
      const data = trimmed.slice(5).trim();

      if (data === '[DONE]') continue;

      try {
        const parsed = JSON.parse(data);
        const chunk = extractChunk(parsed);
        if (chunk) {
          fullText += chunk;
          targetDiv.textContent = fullText;
          scrollToBottom();
        }
      } catch {
        // skip malformed SSE lines
      }
    }
  }

  return fullText;
}

// ═══════════════════════════════════════════════════════════════════
// Error helper
// ═══════════════════════════════════════════════════════════════════
function throwApiError(status, errText) {
  if (status === 401) throw new Error('API 키가 유효하지 않습니다. 설정에서 확인하세요.');
  if (status === 429) throw new Error('API 할당량이 초과되었습니다. 잠시 후 다시 시도하세요.');
  if (status === 403) throw new Error('API 접근이 거부되었습니다. 키 권한을 확인하세요.');
  if (status >= 500) throw new Error('AI 서비스에 일시적 오류가 발생했습니다. 잠시 후 재시도하세요.');

  let detail = '';
  try {
    const parsed = JSON.parse(errText);
    detail = parsed?.error?.message || parsed?.message || errText;
  } catch {
    detail = errText;
  }
  throw new Error(`API 오류 (${status}): ${detail}`);
}
