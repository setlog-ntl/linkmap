<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkmap Service Map — Aurora Mesh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden; color: #e2e8f0;
  }

  /* Aurora background */
  .aurora-bg {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;
    overflow: hidden;
  }
  .aurora-sweep {
    position: absolute; width: 140%; height: 140%; top: -20%; left: -20%;
    background: conic-gradient(
      from 200deg at 30% 40%,
      transparent 0deg,
      rgba(56,189,248,0.06) 40deg,
      rgba(34,197,94,0.05) 80deg,
      transparent 140deg,
      rgba(168,85,247,0.04) 200deg,
      rgba(251,191,36,0.03) 260deg,
      transparent 360deg
    );
    animation: auroraSpin 30s linear infinite;
    filter: blur(60px);
  }
  @keyframes auroraSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .canvas { position: relative; width: 1200px; height: 700px; z-index: 1; }

  /* Hub */
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 130px; height: 130px; z-index: 10;
  }
  .hub-glow {
    position: absolute; width: 200px; height: 200px; top: -35px; left: -35px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(251,191,36,0.2) 0%, transparent 70%);
    animation: glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }
  .hub-ring {
    position: relative; width: 130px; height: 130px; border-radius: 50%;
    background: conic-gradient(
      #22c55e 0deg, #22c55e 225deg,
      #facc15 225deg, #facc15 270deg,
      #f97316 270deg, #f97316 315deg,
      #64748b 315deg, #64748b 360deg
    );
    padding: 5px; display: flex; align-items: center; justify-content: center;
  }
  .hub-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(145deg, #12182e, #0d1225);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: inset 0 0 30px rgba(251,191,36,0.08);
  }
  .hub-icon { font-size: 30px; filter: drop-shadow(0 0 8px rgba(251,191,36,0.5)); }
  .hub-label { font-size: 11px; font-weight: 800; color: #fbbf24; letter-spacing: 1px; }
  .hub-sub { font-size: 9px; color: #a1855a; }

  /* Service Nodes — frosted glass */
  .service-node {
    position: absolute; width: 155px; z-index: 10;
    background: rgba(15,23,42,0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 12px;
    overflow: hidden; cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .service-node:hover {
    transform: scale(1.07) translateY(-2px);
    border-color: rgba(148,163,184,0.3);
    z-index: 20;
  }
  .node-top-border { height: 3px; }
  .node-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .node-header { display: flex; align-items: center; gap: 9px; }
  .node-icon-wrap {
    width: 34px; height: 34px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 18px;
    background: rgba(255,255,255,0.05);
  }
  .node-name { font-size: 13px; font-weight: 700; color: #f8fafc; }
  .node-category { font-size: 10px; color: #64748b; margin-top: 1px; }
  .node-footer { display: flex; align-items: center; justify-content: space-between; }
  .node-status { display: flex; align-items: center; gap: 5px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; }
  .status-label { font-size: 10px; font-weight: 600; }
  .s-connected .status-dot { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
  .s-connected .status-label { color: #4ade80; }
  .s-progress .status-dot { background: #facc15; box-shadow: 0 0 8px rgba(250,204,21,0.5); animation: pulse-dot 1.5s infinite; }
  .s-progress .status-label { color: #fde047; }
  .s-error .status-dot { background: #f97316; box-shadow: 0 0 8px rgba(249,115,22,0.5); animation: pulse-dot 1s infinite; }
  .s-error .status-label { color: #fb923c; }
  .s-notstarted .status-dot { background: #475569; }
  .s-notstarted .status-label { color: #64748b; }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

  /* SVG */
  .edge-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }

  /* Tooltip */
  .tooltip {
    position: absolute; background: rgba(15,20,40,0.92); backdrop-filter: blur(16px);
    border: 1px solid rgba(251,191,36,0.2); border-radius: 10px;
    padding: 12px 16px; font-size: 11px; color: #cbd5e1;
    pointer-events: none; opacity: 0; transition: opacity 0.25s; z-index: 100;
    max-width: 220px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="aurora-bg"><div class="aurora-sweep"></div></div>

<div class="canvas" id="canvas">
  <svg class="edge-layer" id="edgeSvg"></svg>
  <div class="hub">
    <div class="hub-glow"></div>
    <div class="hub-ring"><div class="hub-inner">
      <div class="hub-icon">&#x2B50;</div>
      <div class="hub-label">My Project</div>
      <div class="hub-sub">8 services</div>
    </div></div>
  </div>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
const SERVICES = [
  { id:'supabase',  name:'Supabase',   cat:'Database', icon:'&#x1F5C4;', color:'#3ecf8e', status:'connected',  tip:'PostgreSQL — 42 tables, all healthy' },
  { id:'vercel',    name:'Vercel',     cat:'Deploy',   icon:'&#x25B2;',  color:'#e2e8f0', status:'connected',  tip:'Edge deployment — v2.4.1 production' },
  { id:'stripe',    name:'Stripe',     cat:'Payment',  icon:'&#x1F4B3;', color:'#635bff', status:'connected',  tip:'Payment — 12 active webhooks' },
  { id:'resend',    name:'Resend',     cat:'Email',    icon:'&#x2709;',  color:'#a78bfa', status:'progress',   tip:'Email — template configuration' },
  { id:'clerk',     name:'Clerk',      cat:'Auth',     icon:'&#x1F512;', color:'#7c3aed', status:'connected',  tip:'Auth — Google & GitHub OAuth' },
  { id:'openai',    name:'OpenAI',     cat:'AI',       icon:'&#x1F916;', color:'#10a37f', status:'connected',  tip:'GPT-4 — module analysis active' },
  { id:'sentry',    name:'Sentry',     cat:'Monitor',  icon:'&#x1F6E1;', color:'#f97316', status:'error',      tip:'Monitoring — API key expired!' },
  { id:'cloudflare',name:'CloudFlare', cat:'CDN',      icon:'&#x2601;',  color:'#f59e0b', status:'notstarted', tip:'CDN — awaiting configuration' },
];

const CX = 600, CY = 350, RADIUS = 255;
const canvas = document.getElementById('canvas');
const svg = document.getElementById('edgeSvg');
const tooltip = document.getElementById('tooltip');
const NS = 'http://www.w3.org/2000/svg';

const statusMap = {
  connected:  { cls:'s-connected',  label:'Connected' },
  progress:   { cls:'s-progress',   label:'In Progress' },
  error:      { cls:'s-error',      label:'Error' },
  notstarted: { cls:'s-notstarted', label:'Not Started' },
};

svg.setAttribute('viewBox', '0 0 1200 700');

// Gradient defs
const defs = document.createElementNS(NS, 'defs');
const glowFilter = document.createElementNS(NS, 'filter');
glowFilter.id = 'particleGlow';
glowFilter.innerHTML = '<feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>';
defs.appendChild(glowFilter);

SERVICES.forEach((s, i) => {
  const grad = document.createElementNS(NS, 'linearGradient');
  grad.id = `grad-${s.id}`;
  const angle = (i / SERVICES.length) * Math.PI * 2 - Math.PI / 2;
  const x2 = CX + Math.cos(angle) * RADIUS;
  const y2 = CY + Math.sin(angle) * RADIUS;
  grad.setAttribute('x1', CX); grad.setAttribute('y1', CY);
  grad.setAttribute('x2', x2); grad.setAttribute('y2', y2);
  grad.setAttribute('gradientUnits', 'userSpaceOnUse');
  grad.innerHTML = `<stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="${s.color}" stop-opacity="0.8"/>`;
  defs.appendChild(grad);
});
svg.appendChild(defs);

// Place nodes
SERVICES.forEach((s, i) => {
  const angle = (i / SERVICES.length) * Math.PI * 2 - Math.PI / 2;
  const x = CX + Math.cos(angle) * RADIUS;
  const y = CY + Math.sin(angle) * RADIUS;
  s.x = x; s.y = y;

  // Edge — curved path
  const mx = (CX + x) / 2 + (Math.random() - 0.5) * 30;
  const my = (CY + y) / 2 + (Math.random() - 0.5) * 30;
  const pathD = `M${CX},${CY} Q${mx},${my} ${x},${y}`;

  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', pathD);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', `url(#grad-${s.id})`);
  path.setAttribute('stroke-width', s.status === 'notstarted' ? '1' : '2');
  path.setAttribute('stroke-opacity', s.status === 'notstarted' ? '0.25' : '0.65');
  if (s.status === 'notstarted') path.setAttribute('stroke-dasharray', '8 5');
  path.id = `path-${s.id}`;
  svg.appendChild(path);

  // Particles
  if (s.status !== 'notstarted') {
    const pCount = s.status === 'error' ? 1 : 3;
    for (let p = 0; p < pCount; p++) {
      const orb = document.createElementNS(NS, 'circle');
      orb.setAttribute('r', '5');
      orb.setAttribute('fill', s.status === 'error' ? '#f97316' : '#fbbf24');
      orb.setAttribute('opacity', '0.7');
      orb.setAttribute('filter', 'url(#particleGlow)');

      const motion = document.createElementNS(NS, 'animateMotion');
      const dur = 2.5 + Math.random() * 2;
      motion.setAttribute('dur', dur + 's');
      motion.setAttribute('repeatCount', 'indefinite');
      motion.setAttribute('begin', (p * (dur / pCount)) + 's');

      const mpath = document.createElementNS(NS, 'mpath');
      mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'href', `#path-${s.id}`);
      motion.appendChild(mpath);
      orb.appendChild(motion);
      svg.appendChild(orb);
    }
  }

  // DOM node
  const st = statusMap[s.status];
  const node = document.createElement('div');
  node.className = 'service-node';
  node.style.left = (x - 77) + 'px';
  node.style.top = (y - 48) + 'px';
  node.innerHTML = `
    <div class="node-top-border" style="background: linear-gradient(90deg, ${s.color}, transparent)"></div>
    <div class="node-body">
      <div class="node-header">
        <div class="node-icon-wrap" style="border:1px solid ${s.color}33">${s.icon}</div>
        <div><div class="node-name">${s.name}</div><div class="node-category">${s.cat}</div></div>
      </div>
      <div class="node-footer">
        <div class="node-status ${st.cls}">
          <div class="status-dot"></div>
          <span class="status-label">${st.label}</span>
        </div>
      </div>
    </div>`;
  node.addEventListener('mouseenter', e => {
    node.style.boxShadow = `0 0 25px ${s.color}33, 0 4px 30px rgba(0,0,0,0.4)`;
    node.style.borderColor = s.color + '55';
    tooltip.style.opacity = '1';
    tooltip.innerHTML = `<strong style="color:${s.color}">${s.name}</strong> <span style="color:#94a3b8">/ ${s.cat}</span><br>${s.tip}`;
    const r = node.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
    tooltip.style.left = (r.left - cr.left + 77 - 110) + 'px';
    tooltip.style.top = (r.top - cr.top - 55) + 'px';
  });
  node.addEventListener('mouseleave', () => {
    node.style.boxShadow = '';
    node.style.borderColor = 'rgba(148,163,184,0.12)';
    tooltip.style.opacity = '0';
  });
  canvas.appendChild(node);
});
</script>
</body>
</html>
