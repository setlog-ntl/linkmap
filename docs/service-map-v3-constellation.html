<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkmap Service Map — Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden; color: #e2e8f0;
  }

  /* Starfield */
  .starfield { position: fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; }
  .starfield canvas { width:100%; height:100%; }

  .canvas { position: relative; width: 1200px; height: 700px; z-index: 1; }

  /* Hub — star burst */
  .hub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 110px; height: 110px; z-index: 10;
  }
  .hub-burst {
    position: absolute; width: 180px; height: 180px; top: -35px; left: -35px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(96,165,250,0.06) 40%, transparent 70%);
    animation: starBurst 5s ease-in-out infinite;
  }
  .hub-rays {
    position: absolute; width: 240px; height: 240px; top: -65px; left: -65px;
    border-radius: 50%; pointer-events: none;
    background: conic-gradient(
      from 0deg,
      transparent 0deg, rgba(255,255,255,0.03) 10deg, transparent 20deg,
      transparent 45deg, rgba(255,255,255,0.02) 55deg, transparent 65deg,
      transparent 90deg, rgba(255,255,255,0.03) 100deg, transparent 110deg,
      transparent 135deg, rgba(255,255,255,0.02) 145deg, transparent 155deg,
      transparent 180deg, rgba(255,255,255,0.03) 190deg, transparent 200deg,
      transparent 225deg, rgba(255,255,255,0.02) 235deg, transparent 245deg,
      transparent 270deg, rgba(255,255,255,0.03) 280deg, transparent 290deg,
      transparent 315deg, rgba(255,255,255,0.02) 325deg, transparent 335deg,
      transparent 360deg
    );
    animation: raysSpin 20s linear infinite;
  }
  @keyframes starBurst {
    0%,100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  @keyframes raysSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .hub-ring {
    position: relative; width: 110px; height: 110px; border-radius: 50%;
    background: conic-gradient(
      #22c55e 0deg, #22c55e 225deg,
      #facc15 225deg, #facc15 270deg,
      #f97316 270deg, #f97316 315deg,
      #64748b 315deg, #64748b 360deg
    );
    padding: 4px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(96,165,250,0.2);
  }
  .hub-inner {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(145deg, #0e1429, #0b0f20);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .hub-star { font-size: 26px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
  .hub-label { font-size: 10px; font-weight: 800; color: #e0f2fe; letter-spacing: 1.2px; }
  .hub-sub { font-size: 8px; color: #60a5fa; letter-spacing: 0.5px; }

  /* Nodes — minimal constellation style */
  .service-node {
    position: absolute; width: 148px; z-index: 10;
    background: rgba(10,14,28,0.85); border: 1px solid rgba(96,165,250,0.15);
    border-radius: 10px; padding: 0; overflow: hidden; cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
  }
  .service-node:hover {
    transform: scale(1.06);
    border-color: rgba(96,165,250,0.4);
    box-shadow: 0 0 20px rgba(96,165,250,0.15);
    z-index: 20;
  }
  .node-body { padding: 12px 13px; display: flex; flex-direction: column; gap: 8px; }
  .node-header { display: flex; align-items: center; gap: 10px; }
  .node-badge {
    width: 36px; height: 36px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 17px;
    position: relative;
  }
  .node-badge::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid; opacity: 0.4;
    animation: badgePulse 3s ease-in-out infinite;
  }
  @keyframes badgePulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:0.2;transform:scale(1.08)} }

  .node-title { font-size: 13px; font-weight: 700; color: #f1f5f9; }
  .node-cat { font-size: 9px; color: #475569; text-transform: uppercase; letter-spacing: 1px; }
  .node-divider { height: 1px; background: rgba(96,165,250,0.08); margin: 0 -13px; }
  .node-status { display: flex; align-items: center; gap: 5px; }
  .status-pip { width: 6px; height: 6px; border-radius: 50%; }
  .status-text { font-size: 10px; font-weight: 600; }
  .st-connected .status-pip { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .st-connected .status-text { color: #86efac; }
  .st-progress .status-pip { background: #facc15; box-shadow: 0 0 6px #facc1588; animation: blink 1.5s infinite; }
  .st-progress .status-text { color: #fef08a; }
  .st-error .status-pip { background: #f97316; box-shadow: 0 0 6px #f9731688; animation: blink 1s infinite; }
  .st-error .status-text { color: #fdba74; }
  .st-notstarted .status-pip { background: #334155; }
  .st-notstarted .status-text { color: #64748b; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* SVG */
  .edge-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }

  /* Tooltip */
  .tooltip {
    position: absolute; background: rgba(8,12,28,0.94); backdrop-filter: blur(12px);
    border: 1px solid rgba(96,165,250,0.2); border-radius: 8px;
    padding: 10px 14px; font-size: 11px; color: #94a3b8;
    pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 100;
    max-width: 200px; line-height: 1.5;
  }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>

<div class="canvas" id="canvas">
  <svg class="edge-layer" id="edgeSvg"></svg>
  <div class="hub">
    <div class="hub-rays"></div>
    <div class="hub-burst"></div>
    <div class="hub-ring"><div class="hub-inner">
      <div class="hub-star">&#x2726;</div>
      <div class="hub-label">My Project</div>
      <div class="hub-sub">CONSTELLATION</div>
    </div></div>
  </div>
  <div class="tooltip" id="tooltip"></div>
</div>

<script>
// Starfield
(function() {
  const container = document.getElementById('starfield');
  const cvs = document.createElement('canvas');
  container.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  let w, h, stars = [];

  function resize() {
    w = cvs.width = window.innerWidth;
    h = cvs.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        a: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.003 + 0.001,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
  resize();
  window.addEventListener('resize', resize);

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    stars.forEach(s => {
      const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${s.a * twinkle})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// Services
const SERVICES = [
  { id:'supabase',  name:'Supabase',   cat:'Database', icon:'&#x1F5C4;', color:'#3ecf8e', status:'connected',  tip:'PostgreSQL — 42 tables, healthy' },
  { id:'vercel',    name:'Vercel',     cat:'Deploy',   icon:'&#x25B2;',  color:'#c4b5fd', status:'connected',  tip:'Edge deploy — v2.4.1 live' },
  { id:'stripe',    name:'Stripe',     cat:'Payment',  icon:'&#x1F4B3;', color:'#818cf8', status:'connected',  tip:'Payments — 12 webhooks active' },
  { id:'resend',    name:'Resend',     cat:'Email',    icon:'&#x2709;',  color:'#a78bfa', status:'progress',   tip:'Email — setting up templates' },
  { id:'clerk',     name:'Clerk',      cat:'Auth',     icon:'&#x1F512;', color:'#7c3aed', status:'connected',  tip:'OAuth — Google & GitHub' },
  { id:'openai',    name:'OpenAI',     cat:'AI',       icon:'&#x1F916;', color:'#34d399', status:'connected',  tip:'GPT-4 — active pipeline' },
  { id:'sentry',    name:'Sentry',     cat:'Monitor',  icon:'&#x1F6E1;', color:'#fb923c', status:'error',      tip:'Monitoring — key expired' },
  { id:'cloudflare',name:'CloudFlare', cat:'CDN',      icon:'&#x2601;',  color:'#fbbf24', status:'notstarted', tip:'CDN — not configured' },
];

const CX = 600, CY = 350, RADIUS = 248;
const canvas = document.getElementById('canvas');
const svg = document.getElementById('edgeSvg');
const tooltip = document.getElementById('tooltip');
const NS = 'http://www.w3.org/2000/svg';

svg.setAttribute('viewBox', '0 0 1200 700');

const statusMap = {
  connected:  { cls:'st-connected',  label:'Connected' },
  progress:   { cls:'st-progress',   label:'In Progress' },
  error:      { cls:'st-error',      label:'Error' },
  notstarted: { cls:'st-notstarted', label:'Not Started' },
};

// Defs
const defs = document.createElementNS(NS, 'defs');
const gf = document.createElementNS(NS, 'filter');
gf.id = 'starGlow';
gf.innerHTML = '<feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>';
defs.appendChild(gf);
svg.appendChild(defs);

SERVICES.forEach((s, i) => {
  const angle = (i / SERVICES.length) * Math.PI * 2 - Math.PI / 2;
  const x = CX + Math.cos(angle) * RADIUS;
  const y = CY + Math.sin(angle) * RADIUS;
  s.x = x; s.y = y;

  // Edge — thin bright dotted line
  const edgeColor = s.status === 'notstarted' ? '#334155' : '#60a5fa';
  const opacity = s.status === 'notstarted' ? 0.3 : 0.55;

  const line = document.createElementNS(NS, 'line');
  line.setAttribute('x1', CX); line.setAttribute('y1', CY);
  line.setAttribute('x2', x); line.setAttribute('y2', y);
  line.setAttribute('stroke', edgeColor);
  line.setAttribute('stroke-width', '1.2');
  line.setAttribute('stroke-opacity', opacity);
  line.setAttribute('stroke-dasharray', '3 6');
  line.id = `line-${s.id}`;
  svg.appendChild(line);

  // Connection endpoints — small dots at both ends
  [{ cx: CX + Math.cos(angle) * 60, cy: CY + Math.sin(angle) * 60 },
   { cx: x - Math.cos(angle) * 15, cy: y - Math.sin(angle) * 15 }].forEach(pt => {
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', pt.cx); dot.setAttribute('cy', pt.cy);
    dot.setAttribute('r', '2');
    dot.setAttribute('fill', s.status === 'notstarted' ? '#334155' : s.color);
    dot.setAttribute('opacity', '0.6');
    svg.appendChild(dot);
  });

  // Animated particles — bright moving stars
  if (s.status !== 'notstarted') {
    const pCount = s.status === 'error' ? 1 : 2;
    for (let p = 0; p < pCount; p++) {
      const star = document.createElementNS(NS, 'circle');
      star.setAttribute('r', '2.5');
      star.setAttribute('fill', '#e0f2fe');
      star.setAttribute('filter', 'url(#starGlow)');
      star.setAttribute('opacity', '0.85');

      const anim = document.createElementNS(NS, 'animateMotion');
      const dur = 3 + Math.random() * 2;
      anim.setAttribute('dur', dur + 's');
      anim.setAttribute('repeatCount', 'indefinite');
      anim.setAttribute('begin', (p * (dur / pCount)) + 's');
      anim.setAttribute('path', `M${CX},${CY} L${x},${y}`);
      star.appendChild(anim);
      svg.appendChild(star);
    }
  }

  // DOM node
  const st = statusMap[s.status];
  const node = document.createElement('div');
  node.className = 'service-node';
  node.style.left = (x - 74) + 'px';
  node.style.top = (y - 48) + 'px';

  node.innerHTML = `
    <div class="node-body">
      <div class="node-header">
        <div class="node-badge" style="background:${s.color}18; color:${s.color}">
          ${s.icon}
          <style>.node-badge[style*="${s.color}"]::after { border-color: ${s.color}; }</style>
        </div>
        <div>
          <div class="node-title">${s.name}</div>
          <div class="node-cat">${s.cat}</div>
        </div>
      </div>
      <div class="node-divider"></div>
      <div class="node-status ${st.cls}">
        <div class="status-pip"></div>
        <span class="status-text">${st.label}</span>
      </div>
    </div>`;

  // Fix badge border color via inline style
  const badge = node.querySelector('.node-badge');
  badge.style.cssText += `; --badge-color: ${s.color}`;
  const styleTag = node.querySelector('style');
  if (styleTag) styleTag.remove();
  const afterStyle = document.createElement('style');
  afterStyle.textContent = `#node-${s.id} .node-badge::after { border-color: ${s.color}; }`;
  document.head.appendChild(afterStyle);
  node.id = `node-${s.id}`;

  node.addEventListener('mouseenter', () => {
    node.style.boxShadow = `0 0 24px ${s.color}22`;
    node.style.borderColor = s.color + '44';
    tooltip.style.opacity = '1';
    tooltip.innerHTML = `<strong style="color:${s.color}">${s.name}</strong><br>${s.tip}`;
    const r = node.getBoundingClientRect(), cr = canvas.getBoundingClientRect();
    tooltip.style.left = (r.left - cr.left + 74 - 100) + 'px';
    tooltip.style.top = (r.top - cr.top - 48) + 'px';
  });
  node.addEventListener('mouseleave', () => {
    node.style.boxShadow = '';
    node.style.borderColor = 'rgba(96,165,250,0.15)';
    tooltip.style.opacity = '0';
  });
  canvas.appendChild(node);
});
</script>
</body>
</html>
