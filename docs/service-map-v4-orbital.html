<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linkmap Service Map — Variant 4: Orbital System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    color: #e2e8f0;
  }
  .canvas-wrap {
    position: relative; width: 1200px; height: 700px;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, #12183080, #0a0e1a 70%),
                radial-gradient(ellipse 40% 50% at 30% 40%, #1e1b4b30, transparent 60%),
                radial-gradient(ellipse 30% 40% at 75% 55%, #1c1917 20, transparent 60%);
    border-radius: 16px; overflow: hidden;
  }
  svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

  /* Stars */
  .star { fill: #ffffff; opacity: 0.3; }
  .star.bright { opacity: 0.6; }
  @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.5; } }
  .star.twinkle { animation: twinkle 3s ease-in-out infinite; }

  /* Orbit rings */
  .orbit-ring {
    fill: none; stroke-width: 1; opacity: 0.15;
    stroke-dasharray: 4 6;
  }

  /* Edges */
  .edge-line {
    fill: none; stroke-width: 2; opacity: 0.5;
    transition: opacity 0.3s, stroke-width 0.3s;
  }
  .edge-line.status-connected { stroke: #22c55e; }
  .edge-line.status-in_progress { stroke: #eab308; }
  .edge-line.status-error { stroke: #f97316; }
  .edge-line.status-not_started { stroke: #64748b; stroke-dasharray: 6 4; }

  /* Comet particles */
  .comet { opacity: 0; }
  .comet.status-connected circle { fill: #4ade80; }
  .comet.status-in_progress circle { fill: #facc15; }
  .comet.status-error circle { fill: #fb923c; }
  .comet.status-not_started circle { fill: #94a3b8; }
  @keyframes cometMove {
    0% { offset-distance: 0%; opacity: 0; }
    5% { opacity: 1; }
    90% { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  /* Hub */
  .hub-glow-outer { fill: url(#hubGlowGrad); opacity: 0.25; }
  .hub-glow-inner { fill: url(#hubCoreGrad); }
  .hub-ring { fill: none; stroke-width: 3; }
  .hub-label {
    font-size: 13px; font-weight: 700; fill: #fef3c7;
    text-anchor: middle; dominant-baseline: central;
    pointer-events: none;
  }
  @keyframes hubPulse {
    0%,100% { r: 52; opacity: 0.18; }
    50% { r: 58; opacity: 0.28; }
  }
  .hub-pulse { animation: hubPulse 3s ease-in-out infinite; }

  /* Service nodes */
  .svc-node { cursor: pointer; }
  .svc-node .node-bg {
    stroke-width: 2; transition: filter 0.3s, stroke-width 0.3s;
  }
  .svc-node:hover .node-bg {
    filter: drop-shadow(0 0 12px currentColor); stroke-width: 3;
  }
  .svc-node:hover ~ .edge-line { opacity: 0.9; }
  .svc-icon { font-size: 20px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .svc-label {
    font-size: 11px; font-weight: 600; text-anchor: middle; fill: #cbd5e1;
    pointer-events: none;
  }
  .svc-sub {
    font-size: 9px; text-anchor: middle; fill: #64748b;
    pointer-events: none;
  }
  .status-badge {
    font-size: 7px; text-anchor: middle; dominant-baseline: central;
    font-weight: 700; pointer-events: none;
  }

  /* Tooltip */
  .tooltip-box {
    position: absolute; pointer-events: none;
    background: #1e293bdd; border: 1px solid #334155;
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; line-height: 1.6;
    opacity: 0; transition: opacity 0.2s;
    backdrop-filter: blur(8px); z-index: 10;
    max-width: 200px;
  }
  .tooltip-box.visible { opacity: 1; }
  .tooltip-box .tt-name { font-weight: 700; color: #f8fafc; }
  .tooltip-box .tt-status { font-size: 11px; }

  /* Legend */
  .legend {
    position: absolute; bottom: 16px; left: 16px;
    display: flex; gap: 16px; font-size: 11px; color: #94a3b8;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  .title-bar {
    position: absolute; top: 16px; left: 20px;
    font-size: 14px; font-weight: 700; color: #fbbf2440;
    letter-spacing: 2px; text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="canvas-wrap" id="canvas">
  <div class="title-bar">ORBITAL SYSTEM</div>

  <svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Hub gradients -->
      <radialGradient id="hubGlowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
        <stop offset="60%" stop-color="#f97316" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="hubCoreGrad" cx="40%" cy="35%" r="55%">
        <stop offset="0%" stop-color="#fcd34d"/>
        <stop offset="50%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#d97706"/>
      </radialGradient>
      <!-- Health ring gradient -->
      <linearGradient id="healthRing" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#22c55e"/>
        <stop offset="70%" stop-color="#22c55e"/>
        <stop offset="80%" stop-color="#eab308"/>
        <stop offset="90%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#64748b"/>
      </linearGradient>
      <!-- Orbit group colors -->
      <linearGradient id="orbitInfra" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#6366f1"/>
      </linearGradient>
      <linearGradient id="orbitCore" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <linearGradient id="orbitExt" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#8b5cf6"/>
      </linearGradient>
      <!-- Comet tail filter -->
      <filter id="cometGlow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="hubSoftGlow">
        <feGaussianBlur stdDeviation="8"/>
      </filter>
    </defs>

    <!-- Stars background -->
    <g id="stars"></g>

    <!-- Orbit rings (3 concentric) -->
    <circle class="orbit-ring" cx="600" cy="350" r="160" stroke="url(#orbitCore)"/>
    <circle class="orbit-ring" cx="600" cy="350" r="230" stroke="url(#orbitInfra)"/>
    <circle class="orbit-ring" cx="600" cy="350" r="290" stroke="url(#orbitExt)"/>

    <!-- Edges group -->
    <g id="edges"></g>

    <!-- Comets group -->
    <g id="comets"></g>

    <!-- Hub node -->
    <g id="hub">
      <circle class="hub-pulse" cx="600" cy="350" r="52" fill="#fbbf24" opacity="0.18" filter="url(#hubSoftGlow)"/>
      <circle class="hub-glow-outer" cx="600" cy="350" r="48"/>
      <circle class="hub-glow-inner" cx="600" cy="350" r="32"/>
      <circle class="hub-ring" cx="600" cy="350" r="38" stroke="url(#healthRing)"
              stroke-dasharray="200 39" stroke-linecap="round"/>
      <text class="hub-label" x="600" y="346">My Project</text>
      <text x="600" y="362" text-anchor="middle" font-size="8" fill="#fcd34d80">● 5 connected</text>
    </g>

    <!-- Service nodes group -->
    <g id="nodes"></g>
  </svg>

  <!-- Tooltip -->
  <div class="tooltip-box" id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-status"></div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Connected</div>
    <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div>In Progress</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Error</div>
    <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div>Not Started</div>
  </div>
</div>

<script>
const CX = 600, CY = 350;
const services = [
  { name: 'Supabase',    sub: 'Database',   icon: '🗄️', status: 'connected',   orbit: 1, angle: 0 },
  { name: 'Vercel',      sub: 'Deploy',     icon: '▲',  status: 'connected',   orbit: 2, angle: 45 },
  { name: 'Stripe',      sub: 'Payment',    icon: '💳', status: 'connected',   orbit: 1, angle: 90 },
  { name: 'Resend',      sub: 'Email',      icon: '✉️', status: 'connected',   orbit: 3, angle: 135 },
  { name: 'Clerk',       sub: 'Auth',       icon: '🔐', status: 'connected',   orbit: 1, angle: 180 },
  { name: 'OpenAI',      sub: 'AI',         icon: '🧠', status: 'in_progress', orbit: 2, angle: 225 },
  { name: 'Sentry',      sub: 'Monitor',    icon: '🔍', status: 'error',       orbit: 3, angle: 270 },
  { name: 'CloudFlare',  sub: 'CDN',        icon: '☁️', status: 'not_started', orbit: 2, angle: 315 },
];

const orbitRadii = { 1: 160, 2: 230, 3: 290 };
const statusColors = {
  connected: '#22c55e', in_progress: '#eab308', error: '#f97316', not_started: '#64748b'
};
const statusLabels = {
  connected: 'Connected', in_progress: 'In Progress', error: 'Error', not_started: 'Not Started'
};

const svg = document.querySelector('svg');
const ns = 'http://www.w3.org/2000/svg';

// Generate stars
(function generateStars() {
  const g = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', Math.random() * 1200);
    c.setAttribute('cy', Math.random() * 700);
    const r = Math.random() * 1.2 + 0.3;
    c.setAttribute('r', r);
    c.classList.add('star');
    if (r > 1) c.classList.add('bright');
    if (Math.random() < 0.2) {
      c.classList.add('twinkle');
      c.style.animationDelay = (Math.random() * 5) + 's';
    }
    g.appendChild(c);
  }
})();

// Position helpers
function polarXY(angle, radius) {
  const rad = (angle - 90) * Math.PI / 180;
  return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
}

// Create edges, comets, and nodes
const edgesG = document.getElementById('edges');
const cometsG = document.getElementById('comets');
const nodesG = document.getElementById('nodes');
const tooltip = document.getElementById('tooltip');
const ttName = tooltip.querySelector('.tt-name');
const ttStatus = tooltip.querySelector('.tt-status');

services.forEach((svc, i) => {
  const r = orbitRadii[svc.orbit];
  const pos = polarXY(svc.angle, r);
  const color = statusColors[svc.status];

  // Edge: curved line from hub to node
  const cp1x = CX + (pos.x - CX) * 0.3;
  const cp1y = CY + (pos.y - CY) * 0.05;
  const cp2x = CX + (pos.x - CX) * 0.7;
  const cp2y = CY + (pos.y - CY) * 0.95;
  const pathD = `M ${CX} ${CY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${pos.x} ${pos.y}`;

  const edge = document.createElementNS(ns, 'path');
  edge.setAttribute('d', pathD);
  edge.setAttribute('id', `edge-${i}`);
  edge.classList.add('edge-line', `status-${svc.status}`);
  edgesG.appendChild(edge);

  // Comet particle
  if (svc.status !== 'not_started') {
    for (let p = 0; p < 2; p++) {
      const cometG = document.createElementNS(ns, 'g');
      cometG.classList.add('comet', `status-${svc.status}`);
      cometG.setAttribute('filter', 'url(#cometGlow)');

      // Tail
      const tail = document.createElementNS(ns, 'ellipse');
      tail.setAttribute('cx', '0'); tail.setAttribute('cy', '0');
      tail.setAttribute('rx', '8'); tail.setAttribute('ry', '2');
      tail.setAttribute('fill', color); tail.setAttribute('opacity', '0.4');
      cometG.appendChild(tail);

      // Head
      const head = document.createElementNS(ns, 'circle');
      head.setAttribute('cx', '0'); head.setAttribute('cy', '0');
      head.setAttribute('r', '3');
      cometG.appendChild(head);

      const dur = (2.5 + svc.orbit * 0.8 + p * 1.2).toFixed(1);
      const delay = (p * 1.5).toFixed(1);
      cometG.style.offsetPath = `path("${pathD}")`;
      cometG.style.offsetRotate = 'auto';
      cometG.style.animation = `cometMove ${dur}s ${delay}s ease-in-out infinite`;
      cometsG.appendChild(cometG);
    }
  }

  // Service node
  const g = document.createElementNS(ns, 'g');
  g.classList.add('svc-node');
  g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
  g.style.color = color;

  // Background circle
  const bg = document.createElementNS(ns, 'circle');
  bg.setAttribute('cx', '0'); bg.setAttribute('cy', '0');
  bg.setAttribute('r', '26');
  bg.setAttribute('fill', '#131a2e');
  bg.setAttribute('stroke', color);
  bg.classList.add('node-bg');
  g.appendChild(bg);

  // Status ring arc (percentage ring)
  if (svc.status === 'connected') {
    const ring = document.createElementNS(ns, 'circle');
    ring.setAttribute('cx', '0'); ring.setAttribute('cy', '0');
    ring.setAttribute('r', '29'); ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', color); ring.setAttribute('stroke-width', '2');
    ring.setAttribute('stroke-dasharray', '140 42'); ring.setAttribute('opacity', '0.4');
    ring.setAttribute('stroke-linecap', 'round');
    g.appendChild(ring);
  }

  // Icon
  const icon = document.createElementNS(ns, 'text');
  icon.classList.add('svc-icon');
  icon.setAttribute('x', '0'); icon.setAttribute('y', '1');
  icon.textContent = svc.icon;
  g.appendChild(icon);

  // Name
  const label = document.createElementNS(ns, 'text');
  label.classList.add('svc-label');
  label.setAttribute('x', '0'); label.setAttribute('y', '42');
  label.textContent = svc.name;
  g.appendChild(label);

  // Sub label
  const sub = document.createElementNS(ns, 'text');
  sub.classList.add('svc-sub');
  sub.setAttribute('x', '0'); sub.setAttribute('y', '54');
  sub.textContent = svc.sub;
  g.appendChild(sub);

  // Status dot
  const dot = document.createElementNS(ns, 'circle');
  dot.setAttribute('cx', '18'); dot.setAttribute('cy', '-18');
  dot.setAttribute('r', '5'); dot.setAttribute('fill', color);
  dot.setAttribute('stroke', '#0a0e1a'); dot.setAttribute('stroke-width', '2');
  g.appendChild(dot);

  // Hover interactions
  g.addEventListener('mouseenter', (e) => {
    const edge = document.getElementById(`edge-${i}`);
    edge.style.opacity = '0.9';
    edge.style.strokeWidth = '3';
    ttName.textContent = `${svc.name} — ${svc.sub}`;
    ttStatus.textContent = `Status: ${statusLabels[svc.status]}`;
    ttStatus.style.color = color;
    tooltip.classList.add('visible');
  });
  g.addEventListener('mousemove', (e) => {
    const rect = document.getElementById('canvas').getBoundingClientRect();
    tooltip.style.left = (e.clientX - rect.left + 14) + 'px';
    tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    const edge = document.getElementById(`edge-${i}`);
    edge.style.opacity = '';
    edge.style.strokeWidth = '';
    tooltip.classList.remove('visible');
  });

  nodesG.appendChild(g);
});

// Slow orbit rotation animation for flair
let rotAngle = 0;
const orbitRings = document.querySelectorAll('.orbit-ring');
(function animateOrbits() {
  rotAngle += 0.015;
  orbitRings.forEach((ring, i) => {
    ring.setAttribute('stroke-dashoffset', (rotAngle * (30 + i * 15)).toFixed(1));
  });
  requestAnimationFrame(animateOrbits);
})();
</script>
</body>
</html>
