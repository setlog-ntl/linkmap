<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Linkmap Service Map — Variant 7: Circuit Board</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1a0e;
    width: 1200px; height: 700px;
    overflow: hidden;
    font-family: 'Geist Mono', 'SF Mono', 'Fira Code', monospace;
    color: #c0d0b0;
  }
  svg { display: block; }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(8, 20, 10, 0.95);
    border: 1px solid rgba(212,165,116,0.25);
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.5;
    font-family: 'Geist Mono', monospace;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    max-width: 220px;
    color: #c0d0b0;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-name { font-weight: 700; color: #d4a574; margin-bottom: 2px; }
  .tooltip .tt-status { opacity: 0.6; font-size: 10px; }
</style>
</head>
<body>
<div class="tooltip" id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-status"></div>
</div>

<svg id="canvas" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <!-- PCB board texture -->
    <pattern id="pcbGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="rgba(80,120,70,0.06)" stroke-width="0.5"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="rgba(80,120,70,0.06)" stroke-width="0.5"/>
    </pattern>

    <!-- Faint trace pattern -->
    <pattern id="pcbTraces" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M10,0 L10,40 L50,40 L50,80" stroke="rgba(80,120,70,0.04)" stroke-width="1.5" fill="none"/>
      <path d="M80,0 L80,20 L110,20 L110,60 L90,60" stroke="rgba(80,120,70,0.03)" stroke-width="1" fill="none"/>
      <path d="M0,100 L30,100 L30,70" stroke="rgba(80,120,70,0.04)" stroke-width="1.5" fill="none"/>
      <circle cx="50" cy="80" r="2" fill="rgba(80,120,70,0.04)"/>
      <circle cx="10" cy="40" r="1.5" fill="rgba(80,120,70,0.05)"/>
    </pattern>

    <!-- Copper glow -->
    <filter id="copperGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ledGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chipShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Board base -->
  <rect width="1200" height="700" fill="#0a1a0e"/>
  <rect width="1200" height="700" fill="url(#pcbGrid)"/>
  <rect width="1200" height="700" fill="url(#pcbTraces)"/>

  <!-- Subtle board edge marks -->
  <rect x="15" y="15" width="1170" height="670" rx="4" fill="none" stroke="rgba(80,120,70,0.08)" stroke-width="1"/>
  <circle cx="28" cy="28" r="4" fill="none" stroke="rgba(80,120,70,0.1)" stroke-width="1"/>
  <circle cx="1172" cy="28" r="4" fill="none" stroke="rgba(80,120,70,0.1)" stroke-width="1"/>
  <circle cx="28" cy="672" r="4" fill="none" stroke="rgba(80,120,70,0.1)" stroke-width="1"/>
  <circle cx="1172" cy="672" r="4" fill="none" stroke="rgba(80,120,70,0.1)" stroke-width="1"/>

  <!-- Traces layer -->
  <g id="traces"></g>
  <!-- Particles layer -->
  <g id="particles"></g>
  <!-- Nodes layer -->
  <g id="nodes"></g>
</svg>

<script>
const CX = 600, CY = 350, RADIUS = 230;

const groupColors = {
  'Core':    '#d4a574', // gold
  'Runtime': '#b0b8c0', // silver
  'Growth':  '#c08050', // copper
  'Intel':   '#8090b0', // blue-silver
  'Infra':   '#a0a8a0', // tin
};

const services = [
  { id: 'supabase',   name: 'Supabase',    type: 'DB',      status: 'connected',   group: 'Core' },
  { id: 'vercel',     name: 'Vercel',       type: 'Deploy',  status: 'connected',   group: 'Runtime' },
  { id: 'stripe',     name: 'Stripe',       type: 'Payment', status: 'connected',   group: 'Growth' },
  { id: 'resend',     name: 'Resend',       type: 'Email',   status: 'in-progress', group: 'Growth' },
  { id: 'clerk',      name: 'Clerk',        type: 'Auth',    status: 'connected',   group: 'Core' },
  { id: 'openai',     name: 'OpenAI',       type: 'AI',      status: 'error',       group: 'Intel' },
  { id: 'sentry',     name: 'Sentry',       type: 'Monitor', status: 'connected',   group: 'Infra' },
  { id: 'cloudflare', name: 'CloudFlare',   type: 'CDN',     status: 'not-started', group: 'Infra' },
];

const statusColors = {
  'connected':   '#22c55e',
  'in-progress': '#eab308',
  'error':       '#f97316',
  'not-started': '#4a5568',
};

const statusLabels = {
  'connected':   '연결됨',
  'in-progress': '진행 중',
  'error':       '오류',
  'not-started': '미연결',
};

// Compute positions
services.forEach((s, i) => {
  const angle = (i / services.length) * Math.PI * 2 - Math.PI / 2;
  s.x = CX + Math.cos(angle) * RADIUS;
  s.y = CY + Math.sin(angle) * RADIUS;
});

// ── 90-degree PCB trace path from hub to service ──
function tracePathPoints(sx, sy) {
  // Go horizontal first, then vertical (or vertical then horizontal — pick shorter first segment)
  const dx = sx - CX;
  const dy = sy - CY;
  const mx = CX + dx; // horizontal then vertical
  const my = CY;

  // Via point (bend)
  // Strategy: from center go horizontal to sx, then vertical to sy
  // But add a small offset from center to avoid overlap
  const offsetFromCenter = 40;
  const dirX = dx === 0 ? 0 : dx / Math.abs(dx);
  const dirY = dy === 0 ? 0 : dy / Math.abs(dy);

  // Start offset
  const startX = CX + dirX * offsetFromCenter;
  const startY = CY + dirY * offsetFromCenter;

  // Choose L-path: horizontal first or vertical first
  if (Math.abs(dx) > Math.abs(dy)) {
    // Horizontal first, then vertical
    const bendX = sx;
    const bendY = CY;
    return [
      { x: CX, y: CY },
      { x: bendX, y: CY },
      { x: bendX, y: sy },
      { x: sx, y: sy }
    ];
  } else {
    // Vertical first, then horizontal
    const bendX = CX;
    const bendY = sy;
    return [
      { x: CX, y: CY },
      { x: CX, y: bendY },
      { x: sx, y: bendY },
      { x: sx, y: sy }
    ];
  }
}

function tracePathD(points) {
  return points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x},${p.y}`).join(' ');
}

function tracePathLength(points) {
  let len = 0;
  for (let i = 1; i < points.length; i++) {
    len += Math.abs(points[i].x - points[i-1].x) + Math.abs(points[i].y - points[i-1].y);
  }
  return len;
}

function pointAlongTrace(points, t) {
  const totalLen = tracePathLength(points);
  let target = t * totalLen;
  for (let i = 1; i < points.length; i++) {
    const segLen = Math.abs(points[i].x - points[i-1].x) + Math.abs(points[i].y - points[i-1].y);
    if (target <= segLen) {
      const frac = segLen === 0 ? 0 : target / segLen;
      return {
        x: points[i-1].x + (points[i].x - points[i-1].x) * frac,
        y: points[i-1].y + (points[i].y - points[i-1].y) * frac
      };
    }
    target -= segLen;
  }
  return points[points.length - 1];
}

// ── Build SVG ──
const tracesG = document.getElementById('traces');
const particlesG = document.getElementById('particles');
const nodesG = document.getElementById('nodes');
const tooltip = document.getElementById('tooltip');

// Precompute trace points
const traceData = services.map(s => tracePathPoints(s.x, s.y));

// ── Draw traces ──
services.forEach((s, i) => {
  const pts = traceData[i];
  const d = tracePathD(pts);
  const traceColor = groupColors[s.group];

  // Trace glow (wider, faint)
  if (s.status !== 'not-started') {
    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    glow.setAttribute('d', d);
    glow.setAttribute('fill', 'none');
    glow.setAttribute('stroke', traceColor);
    glow.setAttribute('stroke-width', '4');
    glow.setAttribute('opacity', '0.08');
    glow.setAttribute('stroke-linejoin', 'round');
    tracesG.appendChild(glow);
  }

  // Main trace
  const trace = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  trace.setAttribute('d', d);
  trace.setAttribute('fill', 'none');
  trace.setAttribute('stroke', traceColor);
  trace.setAttribute('stroke-width', s.status === 'not-started' ? '1' : '2');
  trace.setAttribute('opacity', s.status === 'not-started' ? '0.15' : '0.55');
  trace.setAttribute('stroke-linejoin', 'round');
  trace.id = `trace-${i}`;
  tracesG.appendChild(trace);

  // Via dots at bends
  for (let j = 1; j < pts.length - 1; j++) {
    const via = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    via.setAttribute('cx', pts[j].x);
    via.setAttribute('cy', pts[j].y);
    via.setAttribute('r', '3');
    via.setAttribute('fill', '#0a1a0e');
    via.setAttribute('stroke', traceColor);
    via.setAttribute('stroke-width', '1');
    via.setAttribute('opacity', s.status === 'not-started' ? '0.15' : '0.4');
    tracesG.appendChild(via);
  }
});

// ── Hub: processor chip ──
const chipW = 70, chipH = 70, chipR = 8;
const chipX = CX - chipW/2, chipY = CY - chipH/2;

const chipG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
chipG.setAttribute('filter', 'url(#chipShadow)');

// Chip body
const chip = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
chip.setAttribute('x', chipX); chip.setAttribute('y', chipY);
chip.setAttribute('width', chipW); chip.setAttribute('height', chipH);
chip.setAttribute('rx', chipR);
chip.setAttribute('fill', '#0f1f14');
chip.setAttribute('stroke', '#d4a574');
chip.setAttribute('stroke-width', '1.5');
chipG.appendChild(chip);

// Inner die area
const die = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
die.setAttribute('x', chipX + 10); die.setAttribute('y', chipY + 10);
die.setAttribute('width', chipW - 20); die.setAttribute('height', chipH - 20);
die.setAttribute('rx', '3');
die.setAttribute('fill', 'rgba(212,165,116,0.06)');
die.setAttribute('stroke', 'rgba(212,165,116,0.2)');
die.setAttribute('stroke-width', '0.5');
chipG.appendChild(die);

// Pins on each side
const pinLen = 8, pinGap = 10, pinsPerSide = 5;
const sides = [
  { axis: 'top',    start: chipX + 10, y: chipY, dx: 1, dy: -1, horizontal: true },
  { axis: 'bottom', start: chipX + 10, y: chipY + chipH, dx: 1, dy: 1, horizontal: true },
  { axis: 'left',   start: chipY + 10, x: chipX, dx: -1, dy: 1, horizontal: false },
  { axis: 'right',  start: chipY + 10, x: chipX + chipW, dx: 1, dy: 1, horizontal: false },
];

sides.forEach(side => {
  for (let p = 0; p < pinsPerSide; p++) {
    const pin = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    if (side.horizontal) {
      const px = side.start + p * pinGap;
      pin.setAttribute('x1', px); pin.setAttribute('y1', side.y);
      pin.setAttribute('x2', px); pin.setAttribute('y2', side.y + pinLen * side.dy);
    } else {
      const py = side.start + p * pinGap;
      pin.setAttribute('x1', side.x); pin.setAttribute('y1', py);
      pin.setAttribute('x2', side.x + pinLen * side.dx); pin.setAttribute('y2', py);
    }
    pin.setAttribute('stroke', 'rgba(212,165,116,0.35)');
    pin.setAttribute('stroke-width', '1.5');
    pin.setAttribute('stroke-linecap', 'round');
    chipG.appendChild(pin);
  }
});

// Hub labels
const hubLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
hubLabel.setAttribute('x', CX); hubLabel.setAttribute('y', CY - 4);
hubLabel.setAttribute('text-anchor', 'middle');
hubLabel.setAttribute('fill', '#d4a574');
hubLabel.setAttribute('font-size', '11');
hubLabel.setAttribute('font-weight', '700');
hubLabel.textContent = 'MY PROJECT';
chipG.appendChild(hubLabel);

const hubSub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
hubSub.setAttribute('x', CX); hubSub.setAttribute('y', CY + 10);
hubSub.setAttribute('text-anchor', 'middle');
hubSub.setAttribute('fill', 'rgba(212,165,116,0.45)');
hubSub.setAttribute('font-size', '8');
hubSub.textContent = 'LM-2026 REV.A';
chipG.appendChild(hubSub);

// Health ring as LED dots around chip
const healthLeds = 8;
for (let i = 0; i < healthLeds; i++) {
  const angle = (i / healthLeds) * Math.PI * 2 - Math.PI / 2;
  const r = 52;
  const lx = CX + Math.cos(angle) * r;
  const ly = CY + Math.sin(angle) * r;
  const led = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  led.setAttribute('cx', lx); led.setAttribute('cy', ly);
  led.setAttribute('r', '2.5');
  const isOn = i < 5; // 5/8
  led.setAttribute('fill', isOn ? '#22c55e' : '#2a3a2e');
  if (isOn) led.setAttribute('filter', 'url(#ledGlow)');
  led.setAttribute('opacity', isOn ? '0.8' : '0.3');
  chipG.appendChild(led);
}

nodesG.appendChild(chipG);

// ── Draw service nodes (IC chips) ──
const nodeW = 130, nodeH = 52, nodeR = 4;

services.forEach((s, i) => {
  const nx = s.x - nodeW / 2;
  const ny = s.y - nodeH / 2;
  const traceColor = groupColors[s.group];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.style.cursor = 'pointer';
  g.setAttribute('filter', 'url(#chipShadow)');

  // IC body
  const body = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  body.setAttribute('x', nx); body.setAttribute('y', ny);
  body.setAttribute('width', nodeW); body.setAttribute('height', nodeH);
  body.setAttribute('rx', nodeR);
  body.setAttribute('fill', '#0c1c10');
  body.setAttribute('stroke', 'rgba(160,170,150,0.2)');
  body.setAttribute('stroke-width', '1');
  g.appendChild(body);

  // Pin marks on left/right sides
  const pinCount = 4;
  for (let p = 0; p < pinCount; p++) {
    const py = ny + 10 + p * 10;
    // Left pins
    const lp = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    lp.setAttribute('x1', nx - 6); lp.setAttribute('y1', py);
    lp.setAttribute('x2', nx); lp.setAttribute('y2', py);
    lp.setAttribute('stroke', 'rgba(160,170,150,0.2)');
    lp.setAttribute('stroke-width', '1.5');
    g.appendChild(lp);
    // Right pins
    const rp = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    rp.setAttribute('x1', nx + nodeW); rp.setAttribute('y1', py);
    rp.setAttribute('x2', nx + nodeW + 6); rp.setAttribute('y2', py);
    rp.setAttribute('stroke', 'rgba(160,170,150,0.2)');
    rp.setAttribute('stroke-width', '1.5');
    g.appendChild(rp);
  }

  // Notch (IC orientation mark)
  const notch = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  notch.setAttribute('cx', nx + 8); notch.setAttribute('cy', ny + 8);
  notch.setAttribute('r', '2.5');
  notch.setAttribute('fill', 'none');
  notch.setAttribute('stroke', 'rgba(160,170,150,0.15)');
  notch.setAttribute('stroke-width', '0.5');
  g.appendChild(notch);

  // LED status indicator
  const led = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  led.setAttribute('cx', nx + nodeW - 12); led.setAttribute('cy', ny + 12);
  led.setAttribute('r', '4');
  led.setAttribute('fill', statusColors[s.status]);
  if (s.status !== 'not-started') led.setAttribute('filter', 'url(#ledGlow)');
  g.appendChild(led);

  // Chip label (name)
  const name = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  name.setAttribute('x', nx + 10); name.setAttribute('y', ny + 24);
  name.setAttribute('fill', traceColor);
  name.setAttribute('font-size', '11');
  name.setAttribute('font-weight', '700');
  name.textContent = s.name.toUpperCase();
  g.appendChild(name);

  // Type / part number
  const type = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  type.setAttribute('x', nx + 10); type.setAttribute('y', ny + 38);
  type.setAttribute('fill', 'rgba(160,180,150,0.45)');
  type.setAttribute('font-size', '9');
  type.textContent = `${s.type} — ${s.group}`;
  g.appendChild(type);

  // Hover
  g.addEventListener('mouseenter', (e) => {
    body.setAttribute('stroke', traceColor);
    body.setAttribute('stroke-width', '1.5');
    body.setAttribute('fill', '#0f2214');
    const tr = document.getElementById(`trace-${i}`);
    tr.setAttribute('opacity', '0.9');
    tr.setAttribute('stroke-width', '3');

    const tt = document.getElementById('tooltip');
    tt.querySelector('.tt-name').textContent = `${s.name} [${s.type}]`;
    tt.querySelector('.tt-status').textContent = `Status: ${statusLabels[s.status]} | Group: ${s.group}`;
    tt.classList.add('show');
  });

  g.addEventListener('mousemove', (e) => {
    const tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  });

  g.addEventListener('mouseleave', () => {
    body.setAttribute('stroke', 'rgba(160,170,150,0.2)');
    body.setAttribute('stroke-width', '1');
    body.setAttribute('fill', '#0c1c10');
    const tr = document.getElementById(`trace-${i}`);
    tr.setAttribute('opacity', s.status === 'not-started' ? '0.15' : '0.55');
    tr.setAttribute('stroke-width', s.status === 'not-started' ? '1' : '2');
    document.getElementById('tooltip').classList.remove('show');
  });

  nodesG.appendChild(g);
});

// ── Animated square particles along traces ──
class TraceParticle {
  constructor(serviceIndex) {
    this.si = serviceIndex;
    this.s = services[serviceIndex];
    this.pts = traceData[serviceIndex];
    this.progress = Math.random();
    this.speed = 0.005 + Math.random() * 0.006;
    this.outbound = Math.random() > 0.5;
    const traceColor = groupColors[this.s.group];

    // Square particle
    this.el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    this.el.setAttribute('width', '4');
    this.el.setAttribute('height', '4');
    this.el.setAttribute('fill', traceColor);
    this.el.setAttribute('filter', 'url(#copperGlow)');
    particlesG.appendChild(this.el);
  }

  update() {
    this.progress += this.speed;
    if (this.progress > 1) {
      this.progress = 0;
      this.outbound = !this.outbound;
    }

    const t = this.outbound ? this.progress : 1 - this.progress;
    const p = pointAlongTrace(this.pts, t);

    this.el.setAttribute('x', p.x - 2);
    this.el.setAttribute('y', p.y - 2);

    const fade = Math.min(t * 5, (1 - t) * 5, 1);
    this.el.setAttribute('opacity', fade * 0.85);
  }
}

const allParticles = [];
services.forEach((s, i) => {
  if (s.status === 'not-started') return;
  const count = s.status === 'connected' ? 3 : 2;
  for (let j = 0; j < count; j++) {
    allParticles.push(new TraceParticle(i));
  }
});

// ── Blinking error LED ──
let blinkState = true;
setInterval(() => {
  blinkState = !blinkState;
  // Error service is index 5 (OpenAI)
  const errorLeds = document.querySelectorAll('#nodes g:nth-child(n+2)');
  // We'll handle blink in animate instead
}, 600);

let frame = 0;
function animate() {
  frame++;
  allParticles.forEach(p => p.update());

  // Blink error LED (OpenAI index 5 → 7th child in nodesG, 1 hub + 5 = 6th)
  // Simple approach: toggle via frame count
  requestAnimationFrame(animate);
}
animate();

// ── Legend ──
const svg = document.getElementById('canvas');
const legendItems = [
  { label: '연결됨 (ACTIVE)', color: '#22c55e' },
  { label: '진행 중 (PENDING)', color: '#eab308' },
  { label: '오류 (FAULT)', color: '#f97316' },
  { label: '미연결 (N/C)', color: '#4a5568' },
];
legendItems.forEach((item, i) => {
  const lx = 30, ly = 630 + i * 16;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', lx); c.setAttribute('cy', ly);
  c.setAttribute('r', '3'); c.setAttribute('fill', item.color);
  if (item.color !== '#4a5568') c.setAttribute('filter', 'url(#ledGlow)');
  svg.appendChild(c);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', lx + 10); t.setAttribute('y', ly + 3.5);
  t.setAttribute('fill', 'rgba(160,180,150,0.45)'); t.setAttribute('font-size', '9');
  t.setAttribute('font-family', "'Geist Mono', monospace");
  t.textContent = item.label;
  svg.appendChild(t);
});

// Group color legend
const groupLegend = [
  { label: 'Core (Gold)', color: '#d4a574' },
  { label: 'Runtime (Silver)', color: '#b0b8c0' },
  { label: 'Growth (Copper)', color: '#c08050' },
  { label: 'Intel (Blue)', color: '#8090b0' },
  { label: 'Infra (Tin)', color: '#a0a8a0' },
];
groupLegend.forEach((item, i) => {
  const lx = 1060, ly = 630 + i * 14;
  const r = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  r.setAttribute('x1', lx); r.setAttribute('y1', ly);
  r.setAttribute('x2', lx + 14); r.setAttribute('y2', ly);
