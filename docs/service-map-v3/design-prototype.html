<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Map V3 — Network Topology Design</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c1220;
    color: #f1f5f9;
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  .canvas { position: relative; width: 100%; height: 100vh; }
  .canvas canvas { position: absolute; inset: 0; z-index: 1; }

  /* Toolbar */
  .toolbar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 8px;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(16px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 999px; padding: 4px 8px;
  }
  .toolbar input {
    background: transparent; border: none; color: #f1f5f9; font-size: 13px;
    padding: 6px 12px 6px 32px; width: 200px; outline: none; font-family: inherit;
  }
  .toolbar input::placeholder { color: #475569; }
  .toolbar .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #475569; font-size: 14px; }
  .toolbar .divider { width: 1px; height: 20px; background: rgba(148,163,184,0.12); }
  .toolbar button {
    background: transparent; border: none; color: #94a3b8; cursor: pointer;
    padding: 6px 10px; border-radius: 999px; font-size: 12px; font-family: inherit; transition: all 0.2s;
  }
  .toolbar button:hover { color: #f1f5f9; background: rgba(255,255,255,0.05); }

  /* Focus Panel */
  .focus-panel {
    position: absolute; top: 16px; right: 16px; z-index: 50; width: 280px;
    background: rgba(17,24,39,0.92); backdrop-filter: blur(16px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 16px; padding: 20px;
    opacity: 0; transform: translateX(20px);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
  }
  .focus-panel.visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .focus-panel .fp-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .focus-panel .fp-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .focus-panel .fp-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .focus-panel .fp-cat { font-size: 11px; color: #94a3b8; }
  .focus-panel .fp-status { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 6px 10px; border-radius: 8px; margin-bottom: 12px; }
  .focus-panel .fp-status .dot { width: 7px; height: 7px; border-radius: 50%; }
  .focus-panel .fp-connections { border-top: 1px solid rgba(148,163,184,0.12); padding-top: 12px; }
  .focus-panel .fp-conn-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.15s;
  }
  .focus-panel .fp-conn-item:hover { background: rgba(255,255,255,0.04); }
  .focus-panel .fp-conn-item .conn-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .focus-panel .fp-conn-item .conn-type { font-size: 10px; color: #475569; margin-left: auto; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.04); }
  .focus-panel .fp-close {
    position: absolute; top: 12px; right: 12px; background: transparent; border: none;
    color: #475569; cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; transition: all 0.15s;
  }
  .focus-panel .fp-close:hover { color: #f1f5f9; background: rgba(255,255,255,0.05); }

  /* Legend */
  .legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 50;
    display: flex; gap: 16px; background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 10px; padding: 8px 14px; font-size: 10px; color: #94a3b8;
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .legend .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Stats */
  .stats {
    position: absolute; bottom: 16px; right: 16px; z-index: 50;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 10px; padding: 8px 14px; font-size: 10px; color: #94a3b8;
    display: flex; gap: 14px;
  }
  .stats .stat-val { font-size: 14px; font-weight: 700; color: #f1f5f9; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <canvas id="mapCanvas"></canvas>

  <div class="toolbar">
    <span class="search-icon">&#128269;</span>
    <input type="text" placeholder="서비스 검색..." id="searchInput"/>
    <span class="divider"></span>
    <button id="btnReset">&#8634; 초기화</button>
    <button id="btnFit">&#9634; 전체보기</button>
  </div>

  <div class="focus-panel" id="focusPanel">
    <button class="fp-close" id="fpClose">&times;</button>
    <div class="fp-header">
      <div class="fp-icon" id="fpIcon"></div>
      <div><div class="fp-name" id="fpName"></div><div class="fp-cat" id="fpCat"></div></div>
    </div>
    <div class="fp-status" id="fpStatus"><span class="dot" id="fpStatusDot"></span><span id="fpStatusLabel"></span></div>
    <div class="fp-connections" id="fpConnectionsSection"></div>
  </div>

  <div class="legend">
    <div class="item"><span class="dot" style="background:#22c55e"></span> 연결됨</div>
    <div class="item"><span class="dot" style="background:#f59e0b"></span> 진행중</div>
    <div class="item"><span class="dot" style="background:#ef4444"></span> 오류</div>
    <div class="item"><span class="dot" style="background:#64748b"></span> 미시작</div>
    <div class="item" style="margin-left:8px;border-left:1px solid rgba(148,163,184,0.15);padding-left:8px">━ Hub</div>
    <div class="item">┅ S2S</div>
  </div>

  <div class="stats" id="statsPanel"></div>
</div>

<script>
// ══════════════════════════════════════════════════
// Data
// ══════════════════════════════════════════════════
const services = [
  { id: 'auth',      name: 'Supabase Auth',    cat: '인증',       icon: '\u{1F512}', status: 'connected',   color: '#6366f1', group: 'core',         metric: '99.9% up' },
  { id: 'db',        name: 'Supabase DB',      cat: '데이터베이스', icon: '\u{1F5C4}', status: 'connected',   color: '#3b82f6', group: 'core',         metric: '35 tables' },
  { id: 'storage',   name: 'Storage',          cat: '파일 저장',   icon: '\u{1F4E6}', status: 'in_progress', color: '#06b6d4', group: 'core',         metric: '설정 중' },
  { id: 'stripe',    name: 'Stripe',           cat: '결제',       icon: '\u{1F4B3}', status: 'not_started', color: '#ef4444', group: 'core',         metric: '미연결' },
  { id: 'cf',        name: 'Cloudflare',       cat: '엣지 배포',   icon: '\u2601',    status: 'connected',   color: '#f97316', group: 'runtime',      metric: '12ms avg' },
  { id: 'vercel',    name: 'Vercel',           cat: '프리뷰',     icon: '\u25B2',    status: 'connected',   color: '#a3a3a3', group: 'runtime',      metric: 'Active' },
  { id: 'github',    name: 'GitHub',           cat: 'CI/CD',     icon: '\u{1F419}', status: 'connected',   color: '#8b5cf6', group: 'runtime',      metric: '12 repos' },
  { id: 'ga',        name: 'Google Analytics',  cat: '분석',       icon: '\u{1F4CA}', status: 'connected',   color: '#f59e0b', group: 'growth',       metric: '2.1K/day' },
  { id: 'resend',    name: 'Resend',           cat: '이메일',     icon: '\u{1F4E7}', status: 'in_progress', color: '#f59e0b', group: 'growth',       metric: '설정 중' },
  { id: 'openai',    name: 'OpenAI',           cat: 'AI 엔진',    icon: '\u{1F916}', status: 'connected',   color: '#a855f7', group: 'intelligence', metric: 'GPT-4o' },
  { id: 'anthropic', name: 'Anthropic',        cat: 'Claude API', icon: '\u{1F9E0}', status: 'connected',   color: '#ec4899', group: 'intelligence', metric: 'Opus' },
  { id: 'perplexity',name: 'Perplexity',       cat: 'AI 검색',    icon: '\u{1F50D}', status: 'not_started', color: '#ec4899', group: 'intelligence', metric: '미연결' },
];

const s2sConns = [
  { from: 'auth',    to: 'db',        type: 'api_call',    label: 'API 호출' },
  { from: 'cf',      to: 'vercel',    type: 'integrates',  label: '통합' },
  { from: 'github',  to: 'cf',        type: 'webhook',     label: '웹훅' },
  { from: 'openai',  to: 'anthropic', type: 'alternative', label: '대체' },
  { from: 'db',      to: 'storage',   type: 'uses',        label: '사용' },
  { from: 'auth',    to: 'stripe',    type: 'uses',        label: '사용' },
  { from: 'resend',  to: 'auth',      type: 'integrates',  label: '통합' },
  { from: 'ga',      to: 'cf',        type: 'uses',        label: '데이터 수집' },
];

const statusMeta = {
  connected:   { color: '#22c55e', label: '연결됨',  bg: 'rgba(34,197,94,0.1)' },
  in_progress: { color: '#f59e0b', label: '진행 중', bg: 'rgba(245,158,11,0.1)' },
  error:       { color: '#ef4444', label: '오류',    bg: 'rgba(239,68,68,0.1)' },
  not_started: { color: '#64748b', label: '미시작',  bg: 'rgba(100,116,139,0.08)' },
};

const groupMeta = {
  core:         { color: '#6366f1', label: 'Core' },
  runtime:      { color: '#22c55e', label: 'Runtime' },
  growth:       { color: '#f59e0b', label: 'Growth' },
  intelligence: { color: '#ec4899', label: 'Intelligence' },
};

// ══════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════
let focusedId = null;
let searchQuery = '';
let hoveredId = null;
let nodeHitAreas = []; // {id, x, y, r} for click detection

// ══════════════════════════════════════════════════
// Canvas setup
// ══════════════════════════════════════════════════
const canvasEl = document.getElementById('mapCanvas');
const ctx = canvasEl.getContext('2d');

function resize() {
  const r = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvasEl.width = w * r;
  canvasEl.height = h * r;
  canvasEl.style.width = w + 'px';
  canvasEl.style.height = h + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
}

// ══════════════════════════════════════════════════
// Drawing helpers
// ══════════════════════════════════════════════════
function hexPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i - Math.PI / 6;
    const px = cx + r * Math.cos(a);
    const py = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function bezierPath(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const off = len * 0.15;
  const cp1x = x1 + dx * 0.35 + nx * off * 0.3;
  const cp1y = y1 + dy * 0.35 + ny * off * 0.3;
  const cp2x = x1 + dx * 0.65 - nx * off * 0.1;
  const cp2y = y1 + dy * 0.65 - ny * off * 0.1;
  return { cp1x, cp1y, cp2x, cp2y };
}

function drawBezier(x1, y1, x2, y2, color, width, opacity, dash) {
  const { cp1x, cp1y, cp2x, cp2y } = bezierPath(x1, y1, x2, y2);
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawArrow(x1, y1, x2, y2, color, size, opacity) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = opacity || 0.6;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - size * Math.cos(a - 0.35), y2 - size * Math.sin(a - 0.35));
  ctx.lineTo(x2 - size * Math.cos(a + 0.35), y2 - size * Math.sin(a + 0.35));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function colorAlpha(color, alpha) {
  // Convert hex to rgba
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ══════════════════════════════════════════════════
// Layout
// ══════════════════════════════════════════════════
function computeLayout() {
  const w = window.innerWidth, h = window.innerHeight;
  const cx = w / 2, cy = h / 2;
  const minDim = Math.min(w, h);

  // 4 sectors only (no empty infra)
  const groupOrder = ['core', 'runtime', 'growth', 'intelligence'];
  const groups = {};
  services.forEach(s => { if (!groups[s.group]) groups[s.group] = []; groups[s.group].push(s); });
  const sectorSpan = 360 / groupOrder.length;

  groupOrder.forEach((group, gi) => {
    const nodes = groups[group] || [];
    if (nodes.length === 0) return;
    const startAngle = -90 + gi * sectorSpan + 12;
    const endAngle = -90 + (gi + 1) * sectorSpan - 12;
    const range = endAngle - startAngle;
    const innerR = minDim * 0.22;
    const outerR = minDim * 0.36;

    nodes.forEach((svc, i) => {
      const angle = nodes.length === 1
        ? startAngle + range / 2
        : startAngle + (range / (nodes.length - 1)) * i;
      const r = nodes.length <= 3 ? innerR + (i % 2) * (outerR - innerR) * 0.4 : (i % 2 === 0 ? innerR : outerR);
      const rad = (angle * Math.PI) / 180;
      svc._x = cx + r * Math.cos(rad);
      svc._y = cy + r * Math.sin(rad);
    });
  });

  return { cx, cy, w, h, minDim };
}

// ══════════════════════════════════════════════════
// Get S2S connected IDs for a given node
// ══════════════════════════════════════════════════
function getS2SConnectedIds(id) {
  const ids = new Set();
  s2sConns.forEach(c => {
    if (c.from === id) ids.add(c.to);
    if (c.to === id) ids.add(c.from);
  });
  return ids;
}

// ══════════════════════════════════════════════════
// Render
// ══════════════════════════════════════════════════
let animFrame = 0;
function render() {
  resize();
  const { cx, cy, w, h } = computeLayout();
  nodeHitAreas = [];

  const isFocusMode = !!focusedId;
  const s2sConnIds = focusedId ? getS2SConnectedIds(focusedId) : new Set();
  const filtered = searchQuery
    ? services.filter(s => s.name.toLowerCase().includes(searchQuery) || s.cat.toLowerCase().includes(searchQuery))
    : services;
  const filteredIds = new Set(filtered.map(s => s.id));

  // ── Background ──
  ctx.fillStyle = '#0c1220';
  ctx.fillRect(0, 0, w, h);

  // Dot grid
  ctx.save();
  ctx.fillStyle = 'rgba(148,163,184,0.06)';
  for (let x = 12; x < w; x += 24) {
    for (let y = 12; y < h; y += 24) {
      ctx.beginPath();
      ctx.arc(x, y, 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Ambient glow behind hub
  const hubGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 220);
  hubGrad.addColorStop(0, 'rgba(59,130,246,0.08)');
  hubGrad.addColorStop(1, 'rgba(59,130,246,0)');
  ctx.fillStyle = hubGrad;
  ctx.fillRect(0, 0, w, h);

  // Guide rings
  ctx.save();
  ctx.strokeStyle = 'rgba(148,163,184,0.04)';
  ctx.lineWidth = 0.5;
  ctx.setLineDash([6, 4]);
  for (const r of [160, 280, 380]) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();

  // ── Hub edges ──
  services.forEach(svc => {
    if (!filteredIds.has(svc.id)) return;
    const isRelated = !isFocusMode || focusedId === svc.id || s2sConnIds.has(svc.id);
    const edgeColor = svc.color;

    // Glow underlay
    if (isRelated) {
      drawBezier(cx, cy, svc._x, svc._y, edgeColor, 8, isFocusMode ? 0.07 : 0.04, null);
    }

    // Main edge
    const opacity = isFocusMode ? (isRelated ? 0.6 : 0.03) : 0.45;
    const width = isRelated && isFocusMode ? 2.2 : 1.6;
    drawBezier(cx, cy, svc._x, svc._y, edgeColor, width, opacity, null);

    // Arrow
    if (opacity > 0.1) {
      drawArrow(cx, cy, svc._x, svc._y, edgeColor, 7, opacity * 0.8);
    }

    // Status indicator dot on non-connected edges
    if (isRelated && svc.status !== 'connected') {
      const st = statusMeta[svc.status];
      const mx = cx + (svc._x - cx) * 0.5;
      const my = cy + (svc._y - cy) * 0.5;
      ctx.save();
      ctx.fillStyle = st.color;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.arc(mx, my, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  // ── S2S edges ──
  s2sConns.forEach(conn => {
    const from = services.find(s => s.id === conn.from);
    const to = services.find(s => s.id === conn.to);
    if (!from || !to) return;
    if (!filteredIds.has(from.id) || !filteredIds.has(to.id)) return;

    const isRelated = !isFocusMode || focusedId === conn.from || focusedId === conn.to;
    const opacity = isFocusMode ? (isRelated ? 0.5 : 0.02) : 0.2;
    const edgeColor = isRelated ? '#94a3b8' : '#1e293b';

    // Slight perpendicular offset for S2S
    const mx = (from._x + to._x) / 2;
    const my = (from._y + to._y) / 2;
    const dx = to._x - from._x, dy = to._y - from._y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const off = Math.min(len * 0.15, 35);
    const cpx = mx + (-dy / len) * off;
    const cpy = my + (dx / len) * off;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = edgeColor;
    ctx.lineWidth = isRelated ? 1.4 : 0.8;
    ctx.setLineDash([5, 3]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(from._x, from._y);
    ctx.quadraticCurveTo(cpx, cpy, to._x, to._y);
    ctx.stroke();
    ctx.restore();

    if (opacity > 0.1) {
      drawArrow(from._x, from._y, to._x, to._y, edgeColor, 6, opacity * 0.7);
    }

    // S2S label at midpoint (only in focus mode when related)
    if (isRelated && isFocusMode) {
      const labelText = conn.label || conn.type;
      ctx.save();
      ctx.font = '7.5px Pretendard Variable, sans-serif';
      const tw = ctx.measureText(labelText).width + 12;
      ctx.fillStyle = 'rgba(17,24,39,0.9)';
      ctx.strokeStyle = 'rgba(148,163,184,0.15)';
      ctx.lineWidth = 0.5;
      roundRect(cpx - tw / 2, cpy - 8, tw, 16, 4);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labelText, cpx, cpy);
      ctx.restore();
    }
  });

  // ── Hub node ──
  const totalSvc = services.length;
  const connSvc = services.filter(s => s.status === 'connected').length;
  const hPct = connSvc / totalSvc;
  const ringR = 52;

  // Health ring bg
  ctx.save();
  ctx.strokeStyle = 'rgba(148,163,184,0.08)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Health ring fg
  ctx.save();
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hPct);
  ctx.stroke();
  ctx.restore();

  // Hub hex with glow
  ctx.save();
  ctx.shadowColor = 'rgba(59,130,246,0.35)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#111827';
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2.5;
  hexPath(cx, cy, 40);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Hub text
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.font = '700 11px Pretendard Variable, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('My Project', cx, cy - 4);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9px Pretendard Variable, sans-serif';
  ctx.fillText(`${connSvc}/${totalSvc} connected`, cx, cy + 12);
  ctx.restore();

  // Hub hit area
  nodeHitAreas.push({ id: '__hub__', x: cx, y: cy, r: 52 });

  // ── Service nodes ──
  const hexR = 42;
  services.forEach(svc => {
    if (!filteredIds.has(svc.id)) return;
    const isFocused = focusedId === svc.id;
    const isS2SConn = s2sConnIds.has(svc.id);
    const isRelated = !isFocusMode || isFocused || isS2SConn;
    const st = statusMeta[svc.status] || statusMeta.not_started;
    const gm = groupMeta[svc.group];
    const isHovered = hoveredId === svc.id;

    // Fade non-related in focus mode
    if (isFocusMode && !isRelated) {
      ctx.save();
      ctx.globalAlpha = 0.06;
    }

    // Focus outer glow ring
    if (isFocused) {
      ctx.save();
      ctx.strokeStyle = svc.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.3 + 0.15 * Math.sin(animFrame * 0.05);
      hexPath(svc._x, svc._y, 52);
      ctx.stroke();
      ctx.restore();
    }

    // Connected highlight ring
    if (isS2SConn && isFocusMode && !isFocused) {
      ctx.save();
      ctx.strokeStyle = svc.color;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.2;
      hexPath(svc._x, svc._y, 48);
      ctx.stroke();
      ctx.restore();
    }

    // Main hex with glow
    ctx.save();
    if (isFocused || isHovered) {
      ctx.shadowColor = colorAlpha(svc.color, 0.4);
      ctx.shadowBlur = isFocused ? 20 : 12;
    }
    ctx.fillStyle = '#151e2e';
    ctx.strokeStyle = svc.color;
    ctx.lineWidth = isFocused ? 2.5 : (isHovered ? 2 : 1.5);
    hexPath(svc._x, svc._y, hexR);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Status bar at top
    ctx.save();
    ctx.strokeStyle = st.color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    if (svc.status === 'in_progress' || svc.status === 'error') {
      ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(animFrame * 0.04));
    } else {
      ctx.globalAlpha = 0.8;
    }
    ctx.beginPath();
    ctx.moveTo(svc._x - 22, svc._y - hexR + 6);
    ctx.lineTo(svc._x + 22, svc._y - hexR + 6);
    ctx.stroke();
    ctx.restore();

    // Icon background
    ctx.save();
    ctx.fillStyle = colorAlpha(svc.color, 0.1);
    roundRect(svc._x - 14, svc._y - 20, 28, 28, 8);
    ctx.fill();
    ctx.restore();

    // Icon
    ctx.save();
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(svc.icon, svc._x, svc._y - 6);
    ctx.restore();

    // Name
    ctx.save();
    ctx.fillStyle = isHovered || isFocused ? '#fff' : '#e2e8f0';
    ctx.font = '600 10px Pretendard Variable, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const displayName = svc.name.length > 15 ? svc.name.slice(0, 13) + '..' : svc.name;
    ctx.fillText(displayName, svc._x, svc._y + 18);
    ctx.restore();

    // Category
    ctx.save();
    ctx.fillStyle = '#64748b';
    ctx.font = '8px Pretendard Variable, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(svc.cat, svc._x, svc._y + 30);
    ctx.restore();

    // Status dot (top-right)
    ctx.save();
    ctx.fillStyle = '#111827';
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(svc._x + hexR - 10, svc._y - hexR + 14, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = st.color;
    if (svc.status === 'in_progress' || svc.status === 'error') {
      ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(animFrame * 0.04));
    }
    ctx.beginPath();
    ctx.arc(svc._x + hexR - 10, svc._y - hexR + 14, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Metric badge
    ctx.save();
    ctx.font = '500 7.5px Pretendard Variable, sans-serif';
    const metricText = svc.metric;
    const badgeW = ctx.measureText(metricText).width + 16;
    const badgeX = svc._x - badgeW / 2;
    const badgeY = svc._y + hexR + 6;
    ctx.fillStyle = colorAlpha(st.color, 0.08);
    ctx.strokeStyle = colorAlpha(st.color, 0.18);
    ctx.lineWidth = 0.5;
    roundRect(badgeX, badgeY, badgeW, 16, 4);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = st.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(metricText, svc._x, badgeY + 8);
    ctx.restore();

    // Group indicator line at bottom
    if (gm) {
      ctx.save();
      ctx.strokeStyle = gm.color;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(svc._x - 12, svc._y + hexR - 3);
      ctx.lineTo(svc._x + 12, svc._y + hexR - 3);
      ctx.stroke();
      ctx.restore();
    }

    // Restore from faded
    if (isFocusMode && !isRelated) {
      ctx.restore();
    }

    // Hit area
    nodeHitAreas.push({ id: svc.id, x: svc._x, y: svc._y, r: hexR });
  });

  animFrame++;
}

// ══════════════════════════════════════════════════
// Animation loop (for pulsing effects)
// ══════════════════════════════════════════════════
let running = true;
function loop() {
  if (!running) return;
  render();
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════
// Focus interaction
// ══════════════════════════════════════════════════
function toggleFocus(id) {
  if (focusedId === id) resetFocus();
  else { focusedId = id; showFocusPanel(id); }
}

function resetFocus() {
  focusedId = null;
  document.getElementById('focusPanel').classList.remove('visible');
}

function showFocusPanel(id) {
  const svc = services.find(s => s.id === id);
  if (!svc) return;
  const st = statusMeta[svc.status];
  const gm = groupMeta[svc.group];
  const panel = document.getElementById('focusPanel');

  document.getElementById('fpIcon').textContent = svc.icon;
  document.getElementById('fpIcon').style.background = colorAlpha(svc.color, 0.12);
  document.getElementById('fpName').textContent = svc.name;
  document.getElementById('fpCat').textContent = `${svc.cat} \u00B7 ${gm?.label || svc.group}`;
  document.getElementById('fpStatusDot').style.background = st.color;
  document.getElementById('fpStatusLabel').textContent = st.label;
  document.getElementById('fpStatus').style.background = st.bg;

  const section = document.getElementById('fpConnectionsSection');
  section.innerHTML = '';

  // S2S connections
  const s2sIds = getS2SConnectedIds(id);
  if (s2sIds.size > 0) {
    const h4 = document.createElement('h4');
    h4.textContent = `\uC11C\uBE44\uC2A4 \uAC04 \uC5F0\uACB0 (${s2sIds.size})`;
    h4.style.cssText = 'font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#475569;margin-bottom:8px;font-weight:600';
    section.appendChild(h4);

    s2sIds.forEach(cid => {
      const cs = services.find(s => s.id === cid);
      if (!cs) return;
      const conn = s2sConns.find(c => (c.from === id && c.to === cid) || (c.to === id && c.from === cid));
      const cst = statusMeta[cs.status];
      const direction = conn && conn.from === id ? '\u2192' : '\u2190';
      const item = document.createElement('div');
      item.className = 'fp-conn-item';
      item.onclick = () => toggleFocus(cid);
      item.innerHTML = `
        <span class="conn-dot" style="background:${cst.color}"></span>
        <span>${cs.icon} ${cs.name}</span>
        <span class="conn-type">${direction} ${conn?.label || conn?.type || ''}</span>
      `;
      section.appendChild(item);
    });
  }

  // Hub connection
  const hubLabel = document.createElement('div');
  hubLabel.style.cssText = 'font-size:10px;color:#475569;margin:12px 0 6px;font-weight:600;letter-spacing:0.3px;border-top:1px solid rgba(148,163,184,0.12);padding-top:10px';
  hubLabel.textContent = 'Hub \uC5F0\uACB0';
  section.appendChild(hubLabel);

  const hubItem = document.createElement('div');
  hubItem.className = 'fp-conn-item';
  hubItem.onclick = () => resetFocus();
  hubItem.innerHTML = `<span class="conn-dot" style="background:#3b82f6"></span><span>\u{1F3E0} My Project</span><span class="conn-type">hub</span>`;
  section.appendChild(hubItem);

  const total = s2sIds.size + 1;
  const countLabel = document.createElement('div');
  countLabel.style.cssText = 'font-size:10px;color:#475569;margin-top:10px;text-align:center;padding-top:8px;border-top:1px solid rgba(148,163,184,0.08)';
  countLabel.textContent = `\uCD1D ${total}\uAC1C \uC5F0\uACB0`;
  section.appendChild(countLabel);

  panel.classList.add('visible');
}

// ══════════════════════════════════════════════════
// Stats
// ══════════════════════════════════════════════════
function updateStats() {
  const panel = document.getElementById('statsPanel');
  const total = services.length;
  const connected = services.filter(s => s.status === 'connected').length;
  const inProgress = services.filter(s => s.status === 'in_progress').length;
  const totalEdges = services.length + s2sConns.length;
  panel.innerHTML = `
    <div><div class="stat-val">${total}</div>\uC11C\uBE44\uC2A4</div>
    <div><div class="stat-val" style="color:#22c55e">${connected}</div>\uC5F0\uACB0\uB428</div>
    <div><div class="stat-val" style="color:#f59e0b">${inProgress}</div>\uC9C4\uD589\uC911</div>
    <div><div class="stat-val">${totalEdges}</div>\uC5F0\uACB0</div>
  `;
}

// ══════════════════════════════════════════════════
// Event handlers
// ══════════════════════════════════════════════════
function getHitNode(mx, my) {
  // Check in reverse order (top-most first)
  for (let i = nodeHitAreas.length - 1; i >= 0; i--) {
    const n = nodeHitAreas[i];
    const dx = mx - n.x, dy = my - n.y;
    if (dx * dx + dy * dy <= n.r * n.r) return n.id;
  }
  return null;
}

canvasEl.addEventListener('click', (e) => {
  const rect = canvasEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hit = getHitNode(mx, my);
  if (hit === '__hub__') {
    resetFocus();
  } else if (hit) {
    toggleFocus(hit);
  } else {
    // Clicked empty space
    if (focusedId) resetFocus();
  }
});

canvasEl.addEventListener('mousemove', (e) => {
  const rect = canvasEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hit = getHitNode(mx, my);
  hoveredId = hit && hit !== '__hub__' ? hit : null;
  canvasEl.style.cursor = hit ? 'pointer' : 'default';
});

canvasEl.addEventListener('dblclick', (e) => {
  const rect = canvasEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const hit = getHitNode(mx, my);
  if (hit && hit !== '__hub__') {
    // Double-click: could open detail (placeholder)
    toggleFocus(hit);
  }
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase();
});

document.getElementById('btnReset').addEventListener('click', resetFocus);
document.getElementById('btnFit').addEventListener('click', resetFocus);
document.getElementById('fpClose').addEventListener('click', resetFocus);

// Prevent canvas clicks from reaching focus panel
document.getElementById('focusPanel').addEventListener('click', (e) => e.stopPropagation());

// ══════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════
window.addEventListener('resize', () => { /* render is called in loop */ });
updateStats();
loop();
</script>
</body>
</html>
