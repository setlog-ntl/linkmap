<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Map V3 — Design Prototype</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f4f6;--card:#fff;--muted:#f1f5f9;--text:#1e293b;--text2:#94a3b8;
  --border:#e2e8f0;--brand:#2563eb;--grid:rgba(148,163,184,0.15);
  --shadow:0 1px 3px rgba(0,0,0,0.07);
  --canvas-glow:none;
}
.dark{
  --bg:#141e2e;--card:#1b2738;--muted:#253548;--text:#e2e8f0;--text2:#64748b;
  --border:#2d3d50;--brand:#60a5fa;--grid:rgba(100,116,139,0.10);
  --shadow:0 1px 4px rgba(0,0,0,0.4);
  --canvas-glow:radial-gradient(ellipse 50% 45% at 50% 50%,rgba(96,165,250,0.06) 0%,transparent 70%);
}
body{font-family:'Pretendard Variable',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}

/* ─── Toolbar ─── */
.toolbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.toolbar h1{font-size:16px;font-weight:700;white-space:nowrap}
.toolbar h1 b{color:var(--brand)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.b:hover{background:var(--muted)}
.b.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tag{font-size:9px;padding:1px 6px;border-radius:99px;background:var(--brand);color:#fff;font-weight:600}

/* ─── Canvas ─── */
.canvas-wrap{display:flex;justify-content:center;padding:20px}
.canvas{position:relative;width:1100px;height:680px;background:var(--bg);border-radius:16px;border:1px solid var(--border);overflow:hidden;transition:background .3s}
.canvas::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px}
.canvas::after{content:'';position:absolute;inset:0;pointer-events:none;background:var(--canvas-glow)}

/* ─── Edges SVG ─── */
.edge-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
.edge-line{fill:none;stroke-width:1.8;transition:opacity .3s}
.edge-line.dim{opacity:0.06!important}
.particle{transition:opacity .3s}
.particle.dim{opacity:0}
.dark .particle{filter:drop-shadow(0 0 4px var(--pc))}

/* ─── Hub Node ─── */
.hub{position:absolute;z-index:10;width:180px;height:72px;background:var(--card);border-radius:14px;
  border:2px solid var(--brand);box-shadow:var(--shadow);cursor:pointer;transition:.25s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:10px;padding:0 14px}
.hub:hover{transform:scale(1.04)}
.dark .hub{animation:glow 3.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 22px rgba(96,165,250,0.25),var(--shadow)}}
.hub-icon{width:36px;height:36px;border-radius:10px;background:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.hub-icon svg{width:22px;height:22px}
.hub-name{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-sub{font-size:10px;color:var(--text2)}

/* ─── Service Node ─── */
.snode{position:absolute;z-index:5;width:180px;height:72px;background:var(--card);border-radius:12px;
  border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;
  display:flex;align-items:center;gap:0;padding:0;overflow:visible;
  transition:all .25s cubic-bezier(.4,0,.2,1)}
.snode:hover{transform:scale(1.04) translateY(-2px);z-index:15}
.dark .snode:hover{box-shadow:var(--shadow),0 0 16px var(--ng,rgba(99,102,241,0.2))}
.snode.dim{opacity:0.3;transform:scale(0.97);filter:blur(0.4px);z-index:3}
.snode .bar{width:4px;min-width:4px;align-self:stretch;border-radius:12px 0 0 12px;flex-shrink:0}
.snode .ico{width:30px;height:30px;min-width:30px;border-radius:9px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px;margin:0 8px}
.snode .nfo{flex:1;min-width:0;padding-right:20px}
.snode .nm{font-size:12.5px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snode .ct{font-size:9.5px;color:var(--text2);margin-top:1px}
.snode .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%}
/* Handle dots (connection ports) */
.snode .port{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(96,165,250,0.5);transition:.15s}
.snode .port.t{top:-3px;left:50%;transform:translateX(-50%)}
.snode .port.b{bottom:-3px;left:50%;transform:translateX(-50%)}
.snode .port.l{left:-3px;top:50%;transform:translateY(-50%)}
.snode .port.r{right:-3px;top:50%;transform:translateY(-50%)}
.hub .port{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brand);opacity:.6}
.hub .port.t{top:-3px;left:50%;transform:translateX(-50%)}
.hub .port.b{bottom:-3px;left:50%;transform:translateX(-50%)}
.hub .port.l{left:-3px;top:50%;transform:translateY(-50%)}
.hub .port.r{right:-3px;top:50%;transform:translateY(-50%)}

/* ─── Zone (Dependency view) ─── */
.zone{position:absolute;border-radius:14px;border:1.5px solid;z-index:1;transition:.3s}
.zone-chip{position:absolute;top:-11px;left:14px;padding:2px 10px;border-radius:6px;font-size:10px;font-weight:600;color:#fff;display:flex;align-items:center;gap:4px;z-index:2}

/* ─── Connection banner ─── */
.conn-bar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:99px;
  background:var(--brand);color:#fff;font-size:12px;font-weight:500;box-shadow:0 4px 14px rgba(37,99,235,0.3);
  opacity:0;pointer-events:none;transition:.3s}
.conn-bar.show{opacity:1;pointer-events:auto}
.pd{position:relative;width:7px;height:7px;flex-shrink:0}
.pd::before{content:'';position:absolute;inset:0;border-radius:50%;background:#fff}
.pd::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:#fff;opacity:.4;animation:pp 1.4s infinite}
@keyframes pp{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:0;transform:scale(2.2)}}
.kbd{padding:1px 5px;border-radius:3px;font-size:9px;font-family:monospace;background:rgba(255,255,255,0.2)}

/* ─── View tabs ─── */
.view-tabs{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:flex;background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
.vtab{padding:6px 16px;font-size:12px;font-weight:500;cursor:pointer;transition:.2s;border:none;background:transparent;color:var(--text)}
.vtab:hover{background:var(--muted)}
.vtab.on{background:var(--brand);color:#fff}

/* ─── Legend ─── */
.legend{display:flex;gap:14px;justify-content:center;padding:12px 20px;font-size:11px;color:var(--text2);flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ─── Section ─── */
.sec{padding:20px 20px 8px;display:flex;align-items:center;gap:8px}
.sec h2{font-size:18px;font-weight:700}
.divider{height:1px;background:var(--border);margin:0 20px}

/* ─── Micro cards ─── */
.micros{display:flex;gap:14px;padding:12px 20px 24px;flex-wrap:wrap;justify-content:center}
.mc{flex:1;min-width:260px;max-width:380px;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:16px}
.mc h4{font-size:13px;font-weight:600;margin-bottom:10px}
.mc p{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.5}

@media (prefers-reduced-motion:reduce){
  .particle,.dark .hub{animation:none!important}
  .particle{display:none}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1><b>Service Map</b> V3</h1>
  <div class="btns">
    <button class="b" onclick="toggleDark()" id="themeBtn">&#9790; 다크</button>
    <button class="b" onclick="toggleFocus()" id="focusBtn">&#9673; 포커스</button>
    <button class="b" onclick="toggleConn()" id="connBtn">&#9889; 연결모드</button>
  </div>
</div>

<!-- ═══ Main Canvas ═══ -->
<div class="canvas-wrap">
  <div class="canvas" id="canvas">
    <!-- View tabs -->
    <div class="view-tabs">
      <button class="vtab on" id="tabRadial" onclick="switchView('radial')">Radial Map</button>
      <button class="vtab" id="tabDep" onclick="switchView('dependency')">Dependency</button>
    </div>
    <!-- Connection banner -->
    <div class="conn-bar" id="connBanner"><div class="pd"></div>대상 서비스를 클릭하세요 <span class="kbd">ESC</span></div>
    <!-- Edge SVG layer — drawn by JS -->
    <svg class="edge-layer" id="edgeSvg"></svg>
    <!-- Nodes are rendered by JS into #canvas -->
  </div>
</div>

<!-- Legend -->
<div class="legend">
  <div class="legend-item"><div style="width:14px;height:14px;border-radius:5px;border:2px solid var(--brand);display:flex;align-items:center;justify-content:center"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="3"><rect x="3" y="3" width="18" height="18" rx="3"/></svg></div> 프로젝트 허브</div>
  <div class="legend-item"><div class="legend-dot" style="background:#22c55e;box-shadow:0 0 5px rgba(34,197,94,.4)"></div> 연결됨</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;box-shadow:0 0 5px rgba(245,158,11,.4)"></div> 진행 중</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444;box-shadow:0 0 5px rgba(239,68,68,.4)"></div> 오류</div>
  <div class="legend-item"><div class="legend-dot" style="background:#94a3b8"></div> 미설정</div>
  <div class="legend-item"><svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--text2)" stroke-width="1.5"/><circle cx="15" cy="4" r="2.5" fill="var(--brand)"/></svg> 흐름 파티클</div>
</div>

<div class="divider"></div>

<!-- Micro demos -->
<div class="sec"><h2>마이크로 인터랙션</h2><span class="tag">Demo</span></div>
<div class="micros">
  <div class="mc">
    <h4>&#127919; 포커스 모드</h4>
    <p>포커스 버튼을 켜고 캔버스 노드를 클릭하면, 선택된 노드와 연결된 엣지만 하이라이트됩니다.</p>
    <div style="display:flex;gap:10px;align-items:center;justify-content:center">
      <div style="width:70px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;box-shadow:var(--shadow)">선택됨</div>
      <div style="width:70px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;opacity:.3;transform:scale(.97);filter:blur(.3px)">비선택</div>
    </div>
  </div>
  <div class="mc">
    <h4>&#9889; 연결 생성 모드</h4>
    <p>상단 연결모드 버튼을 누르면 연결 배너가 나타납니다.</p>
    <div style="display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;width:fit-content;margin:0 auto">
      <div class="pd"></div>대상 서비스를 클릭하세요 <span class="kbd">ESC</span>
    </div>
  </div>
  <div class="mc">
    <h4>&#10024; 호버 글로우</h4>
    <p>다크 모드에서 노드 호버 시 카테고리 색상 글로우가 표시됩니다.</p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <div style="width:40px;height:40px;border-radius:9px;background:var(--card);border:1px solid var(--border);box-shadow:0 0 14px rgba(99,102,241,.3);display:flex;align-items:center;justify-content:center;font-size:14px;border-left:3px solid #6366f1">&#128274;</div>
      <div style="width:40px;height:40px;border-radius:9px;background:var(--card);border:1px solid var(--border);box-shadow:0 0 14px rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;font-size:14px;border-left:3px solid #3b82f6">&#128451;</div>
      <div style="width:40px;height:40px;border-radius:9px;background:var(--card);border:1px solid var(--border);box-shadow:0 0 14px rgba(34,197,94,.3);display:flex;align-items:center;justify-content:center;font-size:14px;border-left:3px solid #22c55e">&#9729;</div>
      <div style="width:40px;height:40px;border-radius:9px;background:var(--card);border:1px solid var(--border);box-shadow:0 0 14px rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;font-size:14px;border-left:3px solid #ef4444">&#128179;</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// Service data
// ═══════════════════════════════════════════════
const SERVICES = [
  { id:'auth',   name:'Supabase Auth',     cat:'인증',       icon:'&#128274;', color:'#6366f1', status:'connected' },
  { id:'db',     name:'PostgreSQL',         cat:'데이터베이스', icon:'&#128451;', color:'#3b82f6', status:'connected' },
  { id:'cdn',    name:'Cloudflare CDN',     cat:'CDN',        icon:'&#127760;', color:'#14b8a6', status:'connected' },
  { id:'deploy', name:'Cloudflare Workers', cat:'배포',       icon:'&#9729;',   color:'#22c55e', status:'in_progress' },
  { id:'cicd',   name:'GitHub Actions',     cat:'CI/CD',      icon:'&#128230;', color:'#22c55e', status:'connected' },
  { id:'email',  name:'Resend',             cat:'이메일',     icon:'&#9993;',   color:'#f59e0b', status:'not_started' },
  { id:'pay',    name:'Stripe',             cat:'결제',       icon:'&#128179;', color:'#ef4444', status:'error' },
];

const STATUS_CLASS = {
  connected:'background:#22c55e;box-shadow:0 0 5px rgba(34,197,94,.5)',
  in_progress:'background:#f59e0b;box-shadow:0 0 5px rgba(245,158,11,.5)',
  error:'background:#ef4444;box-shadow:0 0 5px rgba(239,68,68,.5)',
  not_started:'background:#94a3b8',
};

const CX = 550, CY = 340, NW = 180, NH = 72, HW = 180, HH = 72;

// ─── Radial positions ───
function radialPositions() {
  const R = 235;
  const n = SERVICES.length;
  const pos = {};
  SERVICES.forEach((s, i) => {
    const angle = -90 + (360 / n) * i;
    const rad = angle * Math.PI / 180;
    pos[s.id] = {
      x: CX + R * Math.cos(rad) - NW / 2,
      y: CY + R * Math.sin(rad) - NH / 2,
    };
  });
  return pos;
}

// ─── Dependency (zone) positions ───
function depPositions() {
  const zones = {
    frontend: { ids:['auth','cdn'],         label:'FRONTEND', sub:'UI & Client', color:'#6366f1', bg:'rgba(99,102,241,0.05)', bc:'rgba(99,102,241,0.2)' },
    backend:  { ids:['db','email','pay'],   label:'BACKEND',  sub:'Server & API', color:'#8b5cf6', bg:'rgba(139,92,246,0.05)', bc:'rgba(139,92,246,0.2)' },
    devtools: { ids:['deploy','cicd'],      label:'DEVTOOLS', sub:'Build & Test', color:'#eab308', bg:'rgba(234,179,8,0.05)',  bc:'rgba(234,179,8,0.2)' },
  };
  const zoneGap = 28, zonePad = 22, headerH = 40, nodeGapX = 14, nodeGapY = 10, cols = 3;
  const zoneOrder = ['frontend','backend','devtools'];
  const pos = {};
  const zoneMeta = [];
  let xOff = 40;

  for (const zk of zoneOrder) {
    const z = zones[zk];
    const count = z.ids.length;
    const rows = Math.max(1, Math.ceil(count / cols));
    const c = Math.min(count || 1, cols);
    const zw = Math.max(c * NW + (c-1)*nodeGapX + 2*zonePad, 1*NW + 2*zonePad + 40);
    const zh = headerH + rows * NH + (rows-1)*nodeGapY + 2*zonePad;
    zoneMeta.push({ key:zk, x:xOff, y:80, w:zw, h:zh, ...z });
    z.ids.forEach((id, idx) => {
      const row = Math.floor(idx/cols), col = idx%cols;
      pos[id] = {
        x: xOff + zonePad + col*(NW+nodeGapX),
        y: 80 + headerH + zonePad + row*(NH+nodeGapY),
      };
    });
    xOff += zw + zoneGap;
  }
  // Equalize zone heights
  const maxH = Math.max(...zoneMeta.map(z=>z.h));
  zoneMeta.forEach(z => z.h = maxH);
  return { pos, zones: zoneMeta };
}

// ═══════════════════════════════════════════════
// Rendering
// ═══════════════════════════════════════════════
let currentView = 'radial';
let focusMode = false;
let focusedId = null;
let connMode = false;
let isDark = false;

const canvas = document.getElementById('canvas');
const edgeSvg = document.getElementById('edgeSvg');

function center(pos) { return { x: pos.x + NW/2, y: pos.y + NH/2 }; }
function hubCenter() { return { x: CX, y: CY }; }

function render() {
  // Clear old nodes (keep svg, tabs, banner)
  canvas.querySelectorAll('.snode,.hub,.zone').forEach(e => e.remove());
  edgeSvg.innerHTML = '';

  if (currentView === 'radial') renderRadial();
  else renderDependency();
}

function renderRadial() {
  const positions = radialPositions();
  const hc = hubCenter();

  // ─── Hub node ───
  const hub = el('div','hub',`
    <div class="port t"></div><div class="port b"></div><div class="port l"></div><div class="port r"></div>
    <div class="hub-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9l9-6 9 6"/><path d="M9 21V12h6v9"/></svg></div>
    <div><div class="hub-name">내 프로젝트</div><div class="hub-sub">Project Hub</div></div>
  `);
  hub.style.cssText = `left:${CX-HW/2}px;top:${CY-HH/2}px`;
  hub.onclick = () => onNodeClick('hub');
  canvas.appendChild(hub);

  // ─── Defs: gradients + markers ───
  let defs = '<defs>';
  SERVICES.forEach(s => {
    const p = positions[s.id];
    const nc = center(p);
    defs += `<linearGradient id="eg-${s.id}" gradientUnits="userSpaceOnUse" x1="${hc.x}" y1="${hc.y}" x2="${nc.x}" y2="${nc.y}">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0.15"/>
    </linearGradient>`;
    defs += `<marker id="am-${s.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="${s.color}" opacity="0.6"/></marker>`;
  });
  defs += '</defs>';
  edgeSvg.innerHTML = defs;

  // ─── Edges ───
  SERVICES.forEach(s => {
    const p = positions[s.id];
    const nc = center(p);
    // Bezier: from hub edge toward node, curving slightly
    const dx = nc.x - hc.x, dy = nc.y - hc.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const ux = dx/dist, uy = dy/dist;
    // Start at hub border (offset ~40px)
    const sx = hc.x + ux*42, sy = hc.y + uy*42;
    // End at node border (offset ~40px back)
    const ex = nc.x - ux*42, ey = nc.y - uy*42;
    // Control point: perpendicular offset for gentle curve
    const mx = (sx+ex)/2, my = (sy+ey)/2;
    const perpX = -uy * 25, perpY = ux * 25;
    const path = `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${(mx+perpX).toFixed(1)} ${(my+perpY).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;

    const pathEl = svgEl('path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('stroke', `url(#eg-${s.id})`);
    pathEl.setAttribute('marker-end', `url(#am-${s.id})`);
    pathEl.classList.add('edge-line');
    pathEl.dataset.sid = s.id;
    pathEl.id = `edge-${s.id}`;
    edgeSvg.appendChild(pathEl);

    // Flow particle
    if (s.status === 'connected' || s.status === 'in_progress') {
      const circle = svgEl('circle');
      circle.setAttribute('r','3');
      circle.setAttribute('fill', s.color);
      circle.classList.add('particle');
      circle.dataset.sid = s.id;
      circle.style.setProperty('--pc', s.color);
      const anim = svgEl('animateMotion');
      anim.setAttribute('dur', (2.2 + Math.random()*1.2).toFixed(1) + 's');
      anim.setAttribute('repeatCount','indefinite');
      anim.setAttribute('path', path);
      circle.appendChild(anim);
      edgeSvg.appendChild(circle);
    }
  });

  // ─── Service nodes ───
  SERVICES.forEach(s => {
    const p = positions[s.id];
    const node = el('div','snode',`
      <div class="port t"></div><div class="port b"></div><div class="port l"></div><div class="port r"></div>
      <div class="bar" style="background:${s.color}"></div>
      <div class="ico">${s.icon}</div>
      <div class="nfo"><div class="nm">${s.name}</div><div class="ct">${s.cat}</div></div>
      <div class="dot" style="${STATUS_CLASS[s.status]}"></div>
    `);
    node.style.cssText = `left:${p.x}px;top:${p.y}px;--ng:${s.color}33`;
    node.dataset.id = s.id;
    node.onclick = () => onNodeClick(s.id);
    canvas.appendChild(node);
  });

  applyFocus();
}

function renderDependency() {
  const { pos, zones } = depPositions();

  // ─── Zones ───
  zones.forEach(z => {
    const zone = el('div','zone','');
    zone.style.cssText = `left:${z.x}px;top:${z.y}px;width:${z.w}px;height:${z.h}px;border-color:${z.bc};background:${z.bg}`;
    const chip = el('div','zone-chip',`<span>${z.label}</span> <span style="opacity:.7;font-size:8px">${z.sub}</span>`);
    chip.style.background = z.color;
    zone.appendChild(chip);
    canvas.appendChild(zone);
  });

  // ─── Edges (SmoothStep-like between services) ───
  // A few example connections
  const connections = [
    { from:'auth', to:'db',     color:'#6366f1' },
    { from:'db',   to:'deploy', color:'#3b82f6' },
    { from:'deploy',to:'cicd',  color:'#22c55e' },
    { from:'db',   to:'pay',    color:'#ef4444' },
    { from:'email',to:'auth',   color:'#f59e0b' },
  ];

  let defs = '<defs>';
  connections.forEach((c,i) => {
    defs += `<marker id="dm-${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9z" fill="${c.color}" opacity="0.5"/></marker>`;
  });
  defs += '</defs>';
  edgeSvg.innerHTML = defs;

  connections.forEach((c, i) => {
    const from = center(pos[c.from]), to = center(pos[c.to]);
    const midY = (from.y + to.y) / 2;
    const path = `M${from.x} ${from.y} C${from.x} ${midY}, ${to.x} ${midY}, ${to.x} ${to.y}`;

    const pathEl = svgEl('path');
    pathEl.setAttribute('d', path);
    pathEl.setAttribute('stroke', c.color);
    pathEl.setAttribute('stroke-opacity', '0.4');
    pathEl.setAttribute('marker-end', `url(#dm-${i})`);
    pathEl.classList.add('edge-line');
    pathEl.dataset.sid = `${c.from}-${c.to}`;
    edgeSvg.appendChild(pathEl);

    const circle = svgEl('circle');
    circle.setAttribute('r','2.5');
    circle.setAttribute('fill', c.color);
    circle.classList.add('particle');
    circle.style.setProperty('--pc', c.color);
    const anim = svgEl('animateMotion');
    anim.setAttribute('dur', (2.5 + Math.random()).toFixed(1) + 's');
    anim.setAttribute('repeatCount','indefinite');
    anim.setAttribute('path', path);
    circle.appendChild(anim);
    edgeSvg.appendChild(circle);
  });

  // ─── Service nodes ───
  SERVICES.forEach(s => {
    if (!pos[s.id]) return;
    const p = pos[s.id];
    const node = el('div','snode',`
      <div class="port t"></div><div class="port b"></div><div class="port l"></div><div class="port r"></div>
      <div class="bar" style="background:${s.color}"></div>
      <div class="ico">${s.icon}</div>
      <div class="nfo"><div class="nm">${s.name}</div><div class="ct">${s.cat}</div></div>
      <div class="dot" style="${STATUS_CLASS[s.status]}"></div>
    `);
    node.style.cssText = `left:${p.x}px;top:${p.y}px;--ng:${s.color}33`;
    node.dataset.id = s.id;
    node.onclick = () => onNodeClick(s.id);
    canvas.appendChild(node);
  });

  applyFocus();
}

// ═══════════════════════════════════════════════
// Interactions
// ═══════════════════════════════════════════════
function onNodeClick(id) {
  if (!focusMode) return;
  if (focusedId === id) focusedId = null;
  else focusedId = id;
  applyFocus();
}

function applyFocus() {
  if (!focusMode || !focusedId) {
    canvas.querySelectorAll('.snode').forEach(n => n.classList.remove('dim'));
    canvas.querySelector('.hub')?.classList.remove('dim');
    edgeSvg.querySelectorAll('.edge-line').forEach(e => e.classList.remove('dim'));
    edgeSvg.querySelectorAll('.particle').forEach(p => p.classList.remove('dim'));
    return;
  }

  // In radial view: focused node + hub are bright, others dim
  if (currentView === 'radial') {
    canvas.querySelectorAll('.snode').forEach(n => {
      n.classList.toggle('dim', n.dataset.id !== focusedId && focusedId !== 'hub');
    });
    canvas.querySelector('.hub')?.classList.remove('dim');
    edgeSvg.querySelectorAll('.edge-line').forEach(e => {
      const sid = e.dataset.sid;
      e.classList.toggle('dim', sid !== focusedId && focusedId !== 'hub');
    });
    edgeSvg.querySelectorAll('.particle').forEach(p => {
      const sid = p.dataset.sid;
      p.classList.toggle('dim', sid !== focusedId && focusedId !== 'hub');
    });
  } else {
    // Dependency: highlight connected
    const connMap = { auth:['db','email'], db:['deploy','pay','auth'], deploy:['cicd','db'], cicd:['deploy'], email:['auth'], pay:['db'] };
    const neighbors = new Set([focusedId, ...(connMap[focusedId]||[])]);
    canvas.querySelectorAll('.snode').forEach(n => {
      n.classList.toggle('dim', !neighbors.has(n.dataset.id));
    });
    edgeSvg.querySelectorAll('.edge-line').forEach(e => {
      const parts = (e.dataset.sid||'').split('-');
      const relevant = parts.length === 2 ? (neighbors.has(parts[0]) && neighbors.has(parts[1])) : neighbors.has(parts[0]);
      e.classList.toggle('dim', !relevant);
    });
    edgeSvg.querySelectorAll('.particle').forEach(p => p.classList.toggle('dim', true));
  }
}

function switchView(view) {
  currentView = view;
  focusedId = null;
  document.getElementById('tabRadial').classList.toggle('on', view==='radial');
  document.getElementById('tabDep').classList.toggle('on', view==='dependency');
  render();
}

function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  document.getElementById('themeBtn').innerHTML = isDark ? '&#9788; 라이트' : '&#9790; 다크';
}
function toggleFocus() {
  focusMode = !focusMode;
  focusedId = null;
  document.getElementById('focusBtn').classList.toggle('on', focusMode);
  applyFocus();
}
function toggleConn() {
  connMode = !connMode;
  document.getElementById('connBtn').classList.toggle('on', connMode);
  document.getElementById('connBanner').classList.toggle('show', connMode);
}

// ─── Helpers ───
function el(tag, cls, html) {
  const e = document.createElement(tag);
  e.className = cls;
  e.innerHTML = html;
  return e;
}
function svgEl(tag) {
  return document.createElementNS('http://www.w3.org/2000/svg', tag);
}

// ─── Init ───
render();
</script>
</body>
</html>
