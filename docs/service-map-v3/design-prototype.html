<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Map V3 — Network Topology Design</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c1220;
    color: #f1f5f9;
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh;
  }
  .canvas { position: relative; width: 100%; height: 100vh; }
  .canvas canvas { position: absolute; inset: 0; z-index: 1; }

  /* Toolbar */
  .toolbar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 8px;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(16px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 999px; padding: 4px 8px;
  }
  .toolbar input {
    background: transparent; border: none; color: #f1f5f9; font-size: 13px;
    padding: 6px 12px 6px 32px; width: 200px; outline: none; font-family: inherit;
  }
  .toolbar input::placeholder { color: #475569; }
  .toolbar .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #475569; font-size: 14px; }
  .toolbar .divider { width: 1px; height: 20px; background: rgba(148,163,184,0.12); }
  .toolbar button {
    background: transparent; border: none; color: #94a3b8; cursor: pointer;
    padding: 6px 10px; border-radius: 999px; font-size: 12px; font-family: inherit; transition: all 0.2s;
  }
  .toolbar button:hover { color: #f1f5f9; background: rgba(255,255,255,0.05); }

  /* Focus Panel */
  .focus-panel {
    position: absolute; top: 16px; right: 16px; z-index: 50; width: 280px;
    background: rgba(17,24,39,0.92); backdrop-filter: blur(16px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 16px; padding: 20px;
    opacity: 0; transform: translateX(20px);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
  }
  .focus-panel.visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .focus-panel .fp-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .focus-panel .fp-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .focus-panel .fp-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .focus-panel .fp-cat { font-size: 11px; color: #94a3b8; }
  .focus-panel .fp-status { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 6px 10px; border-radius: 8px; margin-bottom: 12px; }
  .focus-panel .fp-status .dot { width: 7px; height: 7px; border-radius: 50%; }
  .focus-panel .fp-connections { border-top: 1px solid rgba(148,163,184,0.12); padding-top: 12px; }
  .focus-panel .fp-conn-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.15s;
  }
  .focus-panel .fp-conn-item:hover { background: rgba(255,255,255,0.04); }
  .focus-panel .fp-conn-item .conn-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .focus-panel .fp-conn-item .conn-type { font-size: 10px; color: #475569; margin-left: auto; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.04); }
  .focus-panel .fp-close {
    position: absolute; top: 12px; right: 12px; background: transparent; border: none;
    color: #475569; cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; transition: all 0.15s;
  }
  .focus-panel .fp-close:hover { color: #f1f5f9; background: rgba(255,255,255,0.05); }

  /* Legend */
  .legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 50;
    display: flex; gap: 16px; background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 10px; padding: 8px 14px; font-size: 10px; color: #94a3b8;
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .legend .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Stats */
  .stats {
    position: absolute; bottom: 16px; right: 16px; z-index: 50;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    border: 1px solid rgba(148,163,184,0.12); border-radius: 10px; padding: 8px 14px; font-size: 10px; color: #94a3b8;
    display: flex; gap: 14px;
  }
  .stats .stat-val { font-size: 14px; font-weight: 700; color: #f1f5f9; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <canvas id="bgCanvas"></canvas>
  <canvas id="mapCanvas"></canvas>

  <div class="toolbar">
    <span class="search-icon">&#128269;</span>
    <input type="text" placeholder="서비스 검색..." id="searchInput"/>
    <span class="divider"></span>
    <button id="btnReset">&#8634; 초기화</button>
    <button id="btnFit">&#9634; 전체보기</button>
  </div>

  <div class="focus-panel" id="focusPanel">
    <button class="fp-close" id="fpClose">&times;</button>
    <div class="fp-header">
      <div class="fp-icon" id="fpIcon"></div>
      <div><div class="fp-name" id="fpName"></div><div class="fp-cat" id="fpCat"></div></div>
    </div>
    <div class="fp-status" id="fpStatus"><span class="dot" id="fpStatusDot"></span><span id="fpStatusLabel"></span></div>
    <div class="fp-connections" id="fpConnectionsSection"></div>
  </div>

  <div class="legend">
    <div class="item"><span class="dot" style="background:#22c55e"></span> 연결됨</div>
    <div class="item"><span class="dot" style="background:#f59e0b"></span> 진행중</div>
    <div class="item"><span class="dot" style="background:#ef4444"></span> 오류</div>
    <div class="item"><span class="dot" style="background:#64748b"></span> 미시작</div>
    <div class="item" style="margin-left:8px;border-left:1px solid rgba(148,163,184,0.15);padding-left:8px">━ Hub</div>
    <div class="item">┅ S2S</div>
  </div>

  <div class="stats" id="statsPanel"></div>
</div>

<script>
// ══════════════════════════════════════════════════
// Data
// ══════════════════════════════════════════════════
const services = [
  { id: 'auth',      name: 'Supabase Auth',    cat: '인증',       icon: '\u{1F512}', status: 'connected',   color: '#6366f1', group: 'core',         metric: '99.9% up' },
  { id: 'db',        name: 'Supabase DB',      cat: '데이터베이스', icon: '\u{1F5C4}', status: 'connected',   color: '#818cf8', group: 'core',         metric: '35 tables' },
  { id: 'storage',   name: 'Storage',          cat: '파일 저장',   icon: '\u{1F4E6}', status: 'in_progress', color: '#06b6d4', group: 'core',         metric: '설정 중' },
  { id: 'stripe',    name: 'Stripe',           cat: '결제',       icon: '\u{1F4B3}', status: 'not_started', color: '#f87171', group: 'core',         metric: '미연결' },
  { id: 'cf',        name: 'Cloudflare',       cat: '엣지 배포',   icon: '\u2601',    status: 'connected',   color: '#f97316', group: 'runtime',      metric: '12ms avg' },
  { id: 'vercel',    name: 'Vercel',           cat: '프리뷰',     icon: '\u25B2',    status: 'connected',   color: '#c084fc', group: 'runtime',      metric: 'Active' },
  { id: 'github',    name: 'GitHub',           cat: 'CI/CD',     icon: '\u{1F419}', status: 'connected',   color: '#8b5cf6', group: 'runtime',      metric: '12 repos' },
  { id: 'ga',        name: 'Google Analytics',  cat: '분석',       icon: '\u{1F4CA}', status: 'connected',   color: '#fbbf24', group: 'growth',       metric: '2.1K/day' },
  { id: 'resend',    name: 'Resend',           cat: '이메일',     icon: '\u{1F4E7}', status: 'in_progress', color: '#fb923c', group: 'growth',       metric: '설정 중' },
  { id: 'openai',    name: 'OpenAI',           cat: 'AI 엔진',    icon: '\u{1F916}', status: 'connected',   color: '#a855f7', group: 'intelligence', metric: 'GPT-4o' },
  { id: 'anthropic', name: 'Anthropic',        cat: 'Claude API', icon: '\u{1F9E0}', status: 'connected',   color: '#ec4899', group: 'intelligence', metric: 'Opus' },
  { id: 'perplexity',name: 'Perplexity',       cat: 'AI 검색',    icon: '\u{1F50D}', status: 'not_started', color: '#f472b6', group: 'intelligence', metric: '미연결' },
];

const s2sConns = [
  { from: 'auth',    to: 'db',        type: 'api_call',    label: 'API 호출' },
  { from: 'cf',      to: 'vercel',    type: 'integrates',  label: '통합' },
  { from: 'github',  to: 'cf',        type: 'webhook',     label: '웹훅' },
  { from: 'openai',  to: 'anthropic', type: 'alternative', label: '대체' },
  { from: 'db',      to: 'storage',   type: 'uses',        label: '사용' },
  { from: 'auth',    to: 'stripe',    type: 'uses',        label: '사용' },
  { from: 'resend',  to: 'auth',      type: 'integrates',  label: '통합' },
  { from: 'ga',      to: 'cf',        type: 'uses',        label: '데이터 수집' },
];

const statusMeta = {
  connected:   { color: '#22c55e', label: '연결됨',  bg: 'rgba(34,197,94,0.1)' },
  in_progress: { color: '#f59e0b', label: '진행 중', bg: 'rgba(245,158,11,0.1)' },
  error:       { color: '#ef4444', label: '오류',    bg: 'rgba(239,68,68,0.1)' },
  not_started: { color: '#64748b', label: '미시작',  bg: 'rgba(100,116,139,0.08)' },
};

const groupMeta = {
  core:         { color: '#6366f1', label: 'Core' },
  runtime:      { color: '#22c55e', label: 'Runtime' },
  growth:       { color: '#f59e0b', label: 'Growth' },
  intelligence: { color: '#ec4899', label: 'Intelligence' },
};

// ══════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════
let focusedId = null;
let searchQuery = '';
let hoveredId = null;
let nodeHitAreas = [];
let dirty = true;
let lastW = 0, lastH = 0;

// ══════════════════════════════════════════════════
// Canvas setup — 2-layer: bgCanvas (static) + mapCanvas (dynamic)
// ══════════════════════════════════════════════════
const bgEl = document.getElementById('bgCanvas');
const bgCtx = bgEl.getContext('2d');
const canvasEl = document.getElementById('mapCanvas');
const ctx = canvasEl.getContext('2d');

function setupCanvases(w, h) {
  const r = window.devicePixelRatio || 1;
  for (const c of [bgEl, canvasEl]) {
    c.width = w * r;
    c.height = h * r;
    c.style.width = w + 'px';
    c.style.height = h + 'px';
  }
  bgCtx.setTransform(r, 0, 0, r, 0, 0);
  ctx.setTransform(r, 0, 0, r, 0, 0);
}

// ══════════════════════════════════════════════════
// Drawing helpers
// ══════════════════════════════════════════════════
function hexPath(c, cx, cy, r) {
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i - Math.PI / 6;
    const px = cx + r * Math.cos(a);
    const py = cy + r * Math.sin(a);
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// [P0-fix7] Bezier with direction-aware perpendicular offset
function drawBezier(x1, y1, x2, y2, color, width, opacity, dash, endOffset) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  // Direction: sign based on cross product with "up" vector for consistent curvature
  const cross = dx * 1 - dy * 0; // cross with (0, -1) simplified
  const dir = cross >= 0 ? 1 : -1;
  const nx = (-dy / len) * dir, ny = (dx / len) * dir;
  const off = len * 0.10;
  const cp1x = x1 + dx * 0.35 + nx * off;
  const cp1y = y1 + dy * 0.35 + ny * off;
  const cp2x = x1 + dx * 0.65 + nx * off * 0.3;
  const cp2y = y1 + dy * 0.65 + ny * off * 0.3;

  // [P0-fix4] Compute endpoint offset from target center
  let ex = x2, ey = y2;
  if (endOffset > 0) {
    ex = x2 - (dx / len) * endOffset;
    ey = y2 - (dy / len) * endOffset;
  }

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, ex, ey);
  ctx.stroke();
  ctx.restore();

  return { ex, ey, dx, dy, len };
}

function drawArrow(fromX, fromY, toX, toY, color, size, opacity) {
  const dx = toX - fromX, dy = toY - fromY;
  const a = Math.atan2(dy, dx);
  ctx.save();
  ctx.fillStyle = color;
  ctx.globalAlpha = opacity || 0.6;
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - size * Math.cos(a - 0.4), toY - size * Math.sin(a - 0.4));
  ctx.lineTo(toX - size * Math.cos(a + 0.4), toY - size * Math.sin(a + 0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function colorAlpha(color, alpha) {
  const r = parseInt(color.slice(1, 3), 16);
  const g = parseInt(color.slice(3, 5), 16);
  const b = parseInt(color.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ══════════════════════════════════════════════════
// [P0-fix8] Static background — drawn once, reused via drawImage
// ══════════════════════════════════════════════════
function drawBackground(w, h, cx, cy) {
  bgCtx.fillStyle = '#0c1220';
  bgCtx.fillRect(0, 0, w, h);

  // Dot grid — single path, single fill (optimized)
  bgCtx.save();
  bgCtx.fillStyle = 'rgba(148,163,184,0.06)';
  bgCtx.beginPath();
  for (let x = 12; x < w; x += 24) {
    for (let y = 12; y < h; y += 24) {
      bgCtx.rect(x - 0.5, y - 0.5, 1, 1);
    }
  }
  bgCtx.fill();
  bgCtx.restore();

  // Ambient glow
  const hubGrad = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, 250);
  hubGrad.addColorStop(0, 'rgba(59,130,246,0.07)');
  hubGrad.addColorStop(1, 'rgba(59,130,246,0)');
  bgCtx.fillStyle = hubGrad;
  bgCtx.fillRect(0, 0, w, h);

  // Guide rings
  bgCtx.save();
  bgCtx.strokeStyle = 'rgba(148,163,184,0.04)';
  bgCtx.lineWidth = 0.5;
  bgCtx.setLineDash([6, 4]);
  for (const r of [160, 280, 380]) {
    bgCtx.beginPath();
    bgCtx.arc(cx, cy, r, 0, Math.PI * 2);
    bgCtx.stroke();
  }
  bgCtx.restore();
}

// ══════════════════════════════════════════════════
// [P1-fix2] Layout — improved node spacing to prevent overlap
// ══════════════════════════════════════════════════
function computeLayout() {
  const w = window.innerWidth, h = window.innerHeight;
  const cx = w / 2, cy = h / 2;
  const minDim = Math.min(w, h);

  const groupOrder = ['core', 'runtime', 'growth', 'intelligence'];
  const groups = {};
  services.forEach(s => { if (!groups[s.group]) groups[s.group] = []; groups[s.group].push(s); });
  const sectorSpan = 360 / groupOrder.length;

  // Adaptive radii based on viewport
  const baseInner = Math.max(minDim * 0.24, 140);
  const baseOuter = Math.max(minDim * 0.40, 240);

  groupOrder.forEach((group, gi) => {
    const nodes = groups[group] || [];
    if (nodes.length === 0) return;
    const sectorStart = -90 + gi * sectorSpan;
    const padding = 14;
    const startAngle = sectorStart + padding;
    const endAngle = sectorStart + sectorSpan - padding;
    const range = endAngle - startAngle;

    nodes.forEach((svc, i) => {
      // For groups with 4+ nodes: 2-ring stagger (inner/outer alternating)
      // For groups with 2-3 nodes: spread evenly at consistent radius with slight stagger
      let angle, r;
      if (nodes.length >= 4) {
        const row = i % 2; // 0=inner, 1=outer
        const col = Math.floor(i / 2);
        const rowCount = Math.ceil(nodes.length / 2);
        angle = rowCount === 1 ? startAngle + range / 2 : startAngle + (range / (rowCount - 1)) * col;
        r = row === 0 ? baseInner : baseOuter;
        // Offset outer ring angle slightly to avoid vertical alignment
        if (row === 1) angle += range / (rowCount * 2.5);
      } else {
        angle = nodes.length === 1
          ? startAngle + range / 2
          : startAngle + (range / (nodes.length - 1)) * i;
        // Alternate between two radii for visual variety
        const midR = (baseInner + baseOuter) / 2;
        const spread = (baseOuter - baseInner) * 0.3;
        r = midR + (i % 2 === 0 ? -spread : spread);
      }

      const rad = (angle * Math.PI) / 180;
      svc._x = cx + r * Math.cos(rad);
      svc._y = cy + r * Math.sin(rad);
    });
  });

  return { cx, cy, w, h, minDim, baseOuter };
}

// ══════════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════════
function getS2SConnectedIds(id) {
  const ids = new Set();
  s2sConns.forEach(c => {
    if (c.from === id) ids.add(c.to);
    if (c.to === id) ids.add(c.from);
  });
  return ids;
}

// ══════════════════════════════════════════════════
// Main render
// ══════════════════════════════════════════════════
let animFrame = 0;

function render() {
  const w = window.innerWidth, h = window.innerHeight;

  // Rebuild bg only on resize
  if (w !== lastW || h !== lastH) {
    lastW = w; lastH = h;
    setupCanvases(w, h);
    const { cx, cy } = computeLayout();
    drawBackground(w, h, cx, cy);
  }

  const { cx, cy, minDim, baseOuter } = computeLayout();
  nodeHitAreas = [];

  const isFocusMode = !!focusedId;
  const s2sConnIds = focusedId ? getS2SConnectedIds(focusedId) : new Set();
  const filtered = searchQuery
    ? services.filter(s => s.name.toLowerCase().includes(searchQuery) || s.cat.toLowerCase().includes(searchQuery))
    : services;
  const filteredIds = new Set(filtered.map(s => s.id));

  // Clear dynamic layer
  ctx.clearRect(0, 0, w, h);

  // ── [P2-fix6] Group sector arcs + labels ──
  const groupOrder = ['core', 'runtime', 'growth', 'intelligence'];
  const sectorSpan = 360 / groupOrder.length;
  groupOrder.forEach((group, gi) => {
    const gm = groupMeta[group];
    if (!gm) return;
    const sectorStart = -90 + gi * sectorSpan;
    const s = (sectorStart + 2) * Math.PI / 180;
    const e = (sectorStart + sectorSpan - 2) * Math.PI / 180;
    const arcR = baseOuter + 30;

    // Sector wedge background
    ctx.save();
    ctx.globalAlpha = 0.025;
    ctx.fillStyle = gm.color;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, arcR, s, e);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Sector arc line
    ctx.save();
    ctx.strokeStyle = gm.color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.08;
    ctx.beginPath();
    ctx.arc(cx, cy, arcR, s, e);
    ctx.stroke();
    ctx.restore();

    // Sector label
    const midAngle = (sectorStart + sectorSpan / 2) * Math.PI / 180;
    const labelR = arcR + 18;
    const lx = cx + labelR * Math.cos(midAngle);
    const ly = cy + labelR * Math.sin(midAngle);
    ctx.save();
    ctx.font = '600 9px Pretendard Variable, sans-serif';
    ctx.fillStyle = gm.color;
    ctx.globalAlpha = 0.45;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.letterSpacing = '1px';
    ctx.fillText(gm.label.toUpperCase(), lx, ly);
    ctx.restore();
  });

  // ── Hub edges ──
  const hexR = 42;
  services.forEach(svc => {
    if (!filteredIds.has(svc.id)) return;
    const isRelated = !isFocusMode || focusedId === svc.id || s2sConnIds.has(svc.id);
    const edgeColor = svc.color;

    // Glow underlay (wider, blurred)
    if (isRelated) {
      drawBezier(cx, cy, svc._x, svc._y, edgeColor, 8, isFocusMode ? 0.06 : 0.03, null, hexR + 4);
    }

    // Main edge — [P0-fix4] ends at hex boundary
    const opacity = isFocusMode ? (isRelated ? 0.55 : 0.025) : 0.4;
    const width = isRelated && isFocusMode ? 2.2 : 1.6;
    const { ex, ey } = drawBezier(cx, cy, svc._x, svc._y, edgeColor, width, opacity, null, hexR + 4);

    // Arrow at hex boundary
    if (opacity > 0.08) {
      drawArrow(cx, cy, ex, ey, edgeColor, 7, Math.min(opacity * 1.2, 0.7));
    }

    // Status dot on non-connected edges
    if (isRelated && svc.status !== 'connected' && opacity > 0.1) {
      const st = statusMeta[svc.status];
      const mx = cx + (svc._x - cx) * 0.5;
      const my = cy + (svc._y - cy) * 0.5;
      ctx.save();
      ctx.fillStyle = st.color;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.arc(mx, my, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });

  // ── S2S edges ──
  s2sConns.forEach(conn => {
    const from = services.find(s => s.id === conn.from);
    const to = services.find(s => s.id === conn.to);
    if (!from || !to) return;
    if (!filteredIds.has(from.id) || !filteredIds.has(to.id)) return;

    const isRelated = !isFocusMode || focusedId === conn.from || focusedId === conn.to;
    const opacity = isFocusMode ? (isRelated ? 0.45 : 0.015) : 0.18;
    const edgeColor = isRelated ? '#94a3b8' : '#1e293b';

    const mx = (from._x + to._x) / 2;
    const my = (from._y + to._y) / 2;
    const dx = to._x - from._x, dy = to._y - from._y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const off = Math.min(len * 0.18, 40);
    const cpx = mx + (-dy / len) * off;
    const cpy = my + (dx / len) * off;

    // Endpoint offset from node centers
    const fromEx = from._x + (dx / len) * (hexR + 2);
    const fromEy = from._y + (dy / len) * (hexR + 2);
    const toEx = to._x - (dx / len) * (hexR + 2);
    const toEy = to._y - (dy / len) * (hexR + 2);

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = edgeColor;
    ctx.lineWidth = isRelated ? 1.4 : 0.8;
    ctx.setLineDash([5, 3]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fromEx, fromEy);
    ctx.quadraticCurveTo(cpx, cpy, toEx, toEy);
    ctx.stroke();
    ctx.restore();

    if (opacity > 0.08) {
      drawArrow(fromEx, fromEy, toEx, toEy, edgeColor, 5, opacity * 0.7);
    }

    // S2S label (focus mode only)
    if (isRelated && isFocusMode) {
      const labelText = conn.label || conn.type;
      ctx.save();
      ctx.font = '500 8px Pretendard Variable, sans-serif';
      const tw = ctx.measureText(labelText).width + 14;
      ctx.fillStyle = 'rgba(17,24,39,0.92)';
      ctx.strokeStyle = 'rgba(148,163,184,0.15)';
      ctx.lineWidth = 0.5;
      roundRect(ctx, cpx - tw / 2, cpy - 9, tw, 18, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#cbd5e1';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(labelText, cpx, cpy);
      ctx.restore();
    }
  });

  // ── Hub node ──
  const totalSvc = services.length;
  const connSvc = services.filter(s => s.status === 'connected').length;
  const hPct = connSvc / totalSvc;
  const ringR = 52;

  // Health ring bg
  ctx.save();
  ctx.strokeStyle = 'rgba(148,163,184,0.08)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Health ring fg (animated subtle rotation)
  ctx.save();
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.55;
  const ringOffset = animFrame * 0.003;
  ctx.beginPath();
  ctx.arc(cx, cy, ringR, -Math.PI / 2 + ringOffset, -Math.PI / 2 + ringOffset + Math.PI * 2 * hPct);
  ctx.stroke();
  ctx.restore();

  // Hub hex with gradient fill
  ctx.save();
  ctx.shadowColor = 'rgba(59,130,246,0.3)';
  ctx.shadowBlur = 22;
  const hubGrad = ctx.createRadialGradient(cx, cy - 5, 0, cx, cy + 10, 45);
  hubGrad.addColorStop(0, '#1a2744');
  hubGrad.addColorStop(1, '#111827');
  ctx.fillStyle = hubGrad;
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2.5;
  hexPath(ctx, cx, cy, 40);
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Hub inner accent line
  ctx.save();
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 0.5;
  ctx.globalAlpha = 0.15;
  hexPath(ctx, cx, cy, 32);
  ctx.stroke();
  ctx.restore();

  // Hub text
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.font = '700 12px Pretendard Variable, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('My Project', cx, cy - 4);
  ctx.fillStyle = '#94a3b8';
  ctx.font = '9px Pretendard Variable, sans-serif';
  ctx.fillText(`${connSvc}/${totalSvc} connected`, cx, cy + 12);
  ctx.restore();

  nodeHitAreas.push({ id: '__hub__', x: cx, y: cy, r: 52 });

  // ── Service nodes ──
  services.forEach(svc => {
    if (!filteredIds.has(svc.id)) return;
    const isFocused = focusedId === svc.id;
    const isS2SConn = s2sConnIds.has(svc.id);
    const isRelated = !isFocusMode || isFocused || isS2SConn;
    const st = statusMeta[svc.status] || statusMeta.not_started;
    const gm = groupMeta[svc.group];
    const isHovered = hoveredId === svc.id;

    // Fade non-related in focus mode
    const nodeAlpha = (isFocusMode && !isRelated) ? 0.06 : 1;
    ctx.save();
    if (nodeAlpha < 1) ctx.globalAlpha = nodeAlpha;

    // Focus outer pulse ring
    if (isFocused) {
      ctx.save();
      ctx.strokeStyle = svc.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(animFrame * 0.06);
      hexPath(ctx, svc._x, svc._y, 54);
      ctx.stroke();
      ctx.restore();
    }

    // Connected node ring (S2S)
    if (isS2SConn && isFocusMode && !isFocused) {
      ctx.save();
      ctx.strokeStyle = svc.color;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.2;
      hexPath(ctx, svc._x, svc._y, 48);
      ctx.stroke();
      ctx.restore();
    }

    // [P2-fix3] Main hex with gradient fill + enhanced hover
    ctx.save();
    if (isFocused) {
      ctx.shadowColor = colorAlpha(svc.color, 0.45);
      ctx.shadowBlur = 24;
    } else if (isHovered) {
      ctx.shadowColor = colorAlpha(svc.color, 0.35);
      ctx.shadowBlur = 16;
    }
    // Subtle radial gradient inside hex for depth
    const nodeGrad = ctx.createRadialGradient(svc._x, svc._y - 6, 0, svc._x, svc._y + 12, hexR + 4);
    nodeGrad.addColorStop(0, isHovered ? '#1e2d45' : '#182438');
    nodeGrad.addColorStop(1, '#111827');
    ctx.fillStyle = nodeGrad;
    ctx.strokeStyle = svc.color;
    ctx.lineWidth = isFocused ? 2.5 : (isHovered ? 2.2 : 1.5);
    hexPath(ctx, svc._x, svc._y, hexR);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    // [P2-fix3] Hover fill overlay for better state feedback
    if (isHovered && !isFocused) {
      ctx.save();
      ctx.fillStyle = colorAlpha(svc.color, 0.05);
      hexPath(ctx, svc._x, svc._y, hexR - 1);
      ctx.fill();
      ctx.restore();
    }

    // Status bar at top
    ctx.save();
    ctx.strokeStyle = st.color;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    if (svc.status === 'in_progress' || svc.status === 'error') {
      ctx.globalAlpha = 0.45 + 0.45 * Math.abs(Math.sin(animFrame * 0.045));
    } else {
      ctx.globalAlpha = 0.75;
    }
    ctx.beginPath();
    ctx.moveTo(svc._x - 22, svc._y - hexR + 6);
    ctx.lineTo(svc._x + 22, svc._y - hexR + 6);
    ctx.stroke();
    ctx.restore();

    // Icon bg
    ctx.save();
    ctx.fillStyle = colorAlpha(svc.color, 0.1);
    roundRect(ctx, svc._x - 14, svc._y - 20, 28, 28, 8);
    ctx.fill();
    ctx.restore();

    // Icon
    ctx.save();
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(svc.icon, svc._x, svc._y - 6);
    ctx.restore();

    // Name
    ctx.save();
    ctx.fillStyle = isHovered || isFocused ? '#fff' : '#e2e8f0';
    ctx.font = '600 10px Pretendard Variable, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const displayName = svc.name.length > 14 ? svc.name.slice(0, 12) + '..' : svc.name;
    ctx.fillText(displayName, svc._x, svc._y + 18);
    ctx.restore();

    // [P1-fix1-A] Category — improved contrast (#94a3b8 instead of #64748b)
    ctx.save();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '8px Pretendard Variable, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(svc.cat, svc._x, svc._y + 30);
    ctx.restore();

    // Status dot (top-right)
    ctx.save();
    ctx.fillStyle = '#0f1629';
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(svc._x + hexR - 10, svc._y - hexR + 14, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = st.color;
    if (svc.status === 'in_progress' || svc.status === 'error') {
      ctx.globalAlpha = 0.45 + 0.45 * Math.abs(Math.sin(animFrame * 0.045));
    }
    ctx.beginPath();
    ctx.arc(svc._x + hexR - 10, svc._y - hexR + 14, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // [P2-fix6] Metric badge — hover/focus only for readability, larger font
    const showBadge = isHovered || isFocused || !isFocusMode;
    if (showBadge) {
      ctx.save();
      ctx.font = '500 9px Pretendard Variable, sans-serif';
      const metricText = svc.metric;
      const badgeW = ctx.measureText(metricText).width + 16;
      const badgeX = svc._x - badgeW / 2;
      const badgeY = svc._y + hexR + 8;
      const badgeAlpha = (isHovered || isFocused) ? 1 : 0.7;
      ctx.globalAlpha = badgeAlpha;
      ctx.fillStyle = colorAlpha(st.color, 0.1);
      ctx.strokeStyle = colorAlpha(st.color, 0.2);
      ctx.lineWidth = 0.5;
      roundRect(ctx, badgeX, badgeY, badgeW, 18, 5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = st.color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(metricText, svc._x, badgeY + 9);
      ctx.restore();
    }

    // Group indicator line
    if (gm) {
      ctx.save();
      ctx.strokeStyle = gm.color;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.moveTo(svc._x - 14, svc._y + hexR - 3);
      ctx.lineTo(svc._x + 14, svc._y + hexR - 3);
      ctx.stroke();
      ctx.restore();
    }

    // Restore from faded
    ctx.restore();

    // Hit area
    nodeHitAreas.push({ id: svc.id, x: svc._x, y: svc._y, r: hexR + 8 });
  });

  animFrame++;
}

// ══════════════════════════════════════════════════
// [P0-fix8] Conditional animation loop — only animate when needed
// ══════════════════════════════════════════════════
function loop() {
  // Always render if there are pulsing elements (in_progress/error status exist)
  const hasPulse = services.some(s => s.status === 'in_progress' || s.status === 'error');
  if (dirty || hoveredId !== null || focusedId !== null || hasPulse) {
    render();
    dirty = false;
  }
  requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════════
// Focus interaction
// ══════════════════════════════════════════════════
function toggleFocus(id) {
  if (focusedId === id) resetFocus();
  else { focusedId = id; dirty = true; showFocusPanel(id); }
}

function resetFocus() {
  focusedId = null;
  dirty = true;
  document.getElementById('focusPanel').classList.remove('visible');
}

function showFocusPanel(id) {
  const svc = services.find(s => s.id === id);
  if (!svc) return;
  const st = statusMeta[svc.status];
  const gm = groupMeta[svc.group];
  const panel = document.getElementById('focusPanel');

  document.getElementById('fpIcon').textContent = svc.icon;
  document.getElementById('fpIcon').style.background = colorAlpha(svc.color, 0.12);
  document.getElementById('fpName').textContent = svc.name;
  document.getElementById('fpCat').textContent = `${svc.cat} \u00B7 ${gm?.label || svc.group}`;
  document.getElementById('fpStatusDot').style.background = st.color;
  document.getElementById('fpStatusLabel').textContent = st.label;
  document.getElementById('fpStatus').style.background = st.bg;

  const section = document.getElementById('fpConnectionsSection');
  section.innerHTML = '';

  const s2sIds = getS2SConnectedIds(id);
  if (s2sIds.size > 0) {
    const h4 = document.createElement('h4');
    h4.textContent = `서비스 간 연결 (${s2sIds.size})`;
    h4.style.cssText = 'font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#475569;margin-bottom:8px;font-weight:600';
    section.appendChild(h4);

    s2sIds.forEach(cid => {
      const cs = services.find(s => s.id === cid);
      if (!cs) return;
      const conn = s2sConns.find(c => (c.from === id && c.to === cid) || (c.to === id && c.from === cid));
      const cst = statusMeta[cs.status];
      const direction = conn && conn.from === id ? '\u2192' : '\u2190';
      const item = document.createElement('div');
      item.className = 'fp-conn-item';
      item.onclick = () => toggleFocus(cid);
      item.innerHTML = `
        <span class="conn-dot" style="background:${cst.color}"></span>
        <span>${cs.icon} ${cs.name}</span>
        <span class="conn-type">${direction} ${conn?.label || conn?.type || ''}</span>
      `;
      section.appendChild(item);
    });
  }

  const hubLabel = document.createElement('div');
  hubLabel.style.cssText = 'font-size:10px;color:#475569;margin:12px 0 6px;font-weight:600;letter-spacing:0.3px;border-top:1px solid rgba(148,163,184,0.12);padding-top:10px';
  hubLabel.textContent = 'Hub 연결';
  section.appendChild(hubLabel);

  const hubItem = document.createElement('div');
  hubItem.className = 'fp-conn-item';
  hubItem.onclick = () => resetFocus();
  hubItem.innerHTML = `<span class="conn-dot" style="background:#3b82f6"></span><span>\u{1F3E0} My Project</span><span class="conn-type">hub</span>`;
  section.appendChild(hubItem);

  const total = s2sIds.size + 1;
  const countLabel = document.createElement('div');
  countLabel.style.cssText = 'font-size:10px;color:#475569;margin-top:10px;text-align:center;padding-top:8px;border-top:1px solid rgba(148,163,184,0.08)';
  countLabel.textContent = `총 ${total}개 연결`;
  section.appendChild(countLabel);

  panel.classList.add('visible');
}

// ══════════════════════════════════════════════════
// Stats
// ══════════════════════════════════════════════════
function updateStats() {
  const panel = document.getElementById('statsPanel');
  const total = services.length;
  const connected = services.filter(s => s.status === 'connected').length;
  const inProgress = services.filter(s => s.status === 'in_progress').length;
  const totalEdges = services.length + s2sConns.length;
  panel.innerHTML = `
    <div><div class="stat-val">${total}</div>서비스</div>
    <div><div class="stat-val" style="color:#22c55e">${connected}</div>연결됨</div>
    <div><div class="stat-val" style="color:#f59e0b">${inProgress}</div>진행중</div>
    <div><div class="stat-val">${totalEdges}</div>연결</div>
  `;
}

// ══════════════════════════════════════════════════
// Event handlers
// ══════════════════════════════════════════════════
function getHitNode(mx, my) {
  for (let i = nodeHitAreas.length - 1; i >= 0; i--) {
    const n = nodeHitAreas[i];
    const dx = mx - n.x, dy = my - n.y;
    if (dx * dx + dy * dy <= n.r * n.r) return n.id;
  }
  return null;
}

canvasEl.addEventListener('click', (e) => {
  const rect = canvasEl.getBoundingClientRect();
  const hit = getHitNode(e.clientX - rect.left, e.clientY - rect.top);
  if (hit === '__hub__') resetFocus();
  else if (hit) toggleFocus(hit);
  else if (focusedId) resetFocus();
});

canvasEl.addEventListener('mousemove', (e) => {
  const rect = canvasEl.getBoundingClientRect();
  const hit = getHitNode(e.clientX - rect.left, e.clientY - rect.top);
  const newHover = hit && hit !== '__hub__' ? hit : null;
  if (newHover !== hoveredId) {
    hoveredId = newHover;
    dirty = true;
  }
  canvasEl.style.cursor = hit ? 'pointer' : 'default';
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase();
  dirty = true;
});

document.getElementById('btnReset').addEventListener('click', resetFocus);
document.getElementById('btnFit').addEventListener('click', resetFocus);
document.getElementById('fpClose').addEventListener('click', resetFocus);
document.getElementById('focusPanel').addEventListener('click', (e) => e.stopPropagation());

window.addEventListener('resize', () => { lastW = 0; dirty = true; });

// ══════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════
updateStats();
loop();
</script>
</body>
</html>
