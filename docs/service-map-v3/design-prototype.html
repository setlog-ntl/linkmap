<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Map V3 — Network Topology Design</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<style>
  :root {
    --bg: #0c1220;
    --surface: #111827;
    --surface-2: #1a2236;
    --border: rgba(148,163,184,0.12);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-dim: #475569;
    --primary: #3b82f6;
    --connected: #22c55e;
    --in-progress: #f59e0b;
    --error: #ef4444;
    --not-started: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  .canvas { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  .canvas::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(59,130,246,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .canvas svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* Toolbar */
  .toolbar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 8px;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px;
  }
  .toolbar input {
    background: transparent; border: none; color: var(--text); font-size: 13px;
    padding: 6px 12px 6px 32px; width: 200px; outline: none; font-family: inherit;
  }
  .toolbar input::placeholder { color: var(--text-dim); }
  .toolbar .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 14px; }
  .toolbar .divider { width: 1px; height: 20px; background: var(--border); }
  .toolbar button {
    background: transparent; border: none; color: var(--text-muted); cursor: pointer;
    padding: 6px 10px; border-radius: 999px; font-size: 12px; font-family: inherit; transition: all 0.2s;
  }
  .toolbar button:hover { color: var(--text); background: rgba(255,255,255,0.05); }

  /* Focus Panel */
  .focus-panel {
    position: absolute; top: 16px; right: 16px; z-index: 50; width: 280px;
    background: rgba(17,24,39,0.92); backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    opacity: 0; transform: translateX(20px);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
  }
  .focus-panel.visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .focus-panel .fp-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .focus-panel .fp-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .focus-panel .fp-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .focus-panel .fp-cat { font-size: 11px; color: var(--text-muted); }
  .focus-panel .fp-status { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 6px 10px; border-radius: 8px; margin-bottom: 12px; }
  .focus-panel .fp-status .dot { width: 7px; height: 7px; border-radius: 50%; }
  .focus-panel .fp-connections { border-top: 1px solid var(--border); padding-top: 12px; }
  .focus-panel .fp-connections h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }
  .focus-panel .fp-conn-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 8px; font-size: 12px; cursor: pointer; transition: background 0.15s;
  }
  .focus-panel .fp-conn-item:hover { background: rgba(255,255,255,0.04); }
  .focus-panel .fp-conn-item .conn-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .focus-panel .fp-conn-item .conn-type { font-size: 10px; color: var(--text-dim); margin-left: auto; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.04); }
  .focus-panel .fp-close {
    position: absolute; top: 12px; right: 12px; background: transparent; border: none;
    color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 6px; transition: all 0.15s;
  }
  .focus-panel .fp-close:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .focus-panel .fp-section-label { font-size: 10px; color: var(--text-dim); margin: 10px 0 6px; font-weight: 600; letter-spacing: 0.3px; }

  /* Legend */
  .legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 50;
    display: flex; gap: 16px; background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 10px; color: var(--text-muted);
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .legend .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Stats */
  .stats {
    position: absolute; bottom: 16px; right: 16px; z-index: 50;
    background: rgba(17,24,39,0.85); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 10px; color: var(--text-muted);
    display: flex; gap: 14px;
  }
  .stats .stat-val { font-size: 14px; font-weight: 700; color: var(--text); }

  /* Animations */
  @keyframes hex-pulse { 0%, 100% { stroke-opacity: 0.3; } 50% { stroke-opacity: 0.9; } }
  @keyframes status-pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes node-enter { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes edge-flow { to { stroke-dashoffset: -12; } }

  .hex-node {
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: node-enter 0.4s ease-out both;
  }
  .hex-node:hover .hex-shape { stroke-width: 2.5; }
  .hex-node:hover .hex-label { fill: #fff; }
  .hex-node.faded { opacity: 0.08; filter: blur(0.8px) grayscale(0.5); pointer-events: none; }
  .hex-node.focused .hex-shape { stroke-width: 3; }
  .edge-line { transition: all 0.3s ease; }

  @media (prefers-reduced-motion: reduce) {
    .hex-node, .edge-line { transition: none; animation: none; }
  }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="12" cy="12" r="0.5" fill="rgba(148,163,184,0.08)"/>
      </pattern>
      <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
    <circle id="hubAmbient" r="200" fill="url(#hubGlow)"/>
    <g id="guideRings"></g>
    <g id="edgesLayer"></g>
    <g id="nodesLayer"></g>
  </svg>

  <div class="toolbar">
    <span class="search-icon">&#128269;</span>
    <input type="text" placeholder="서비스 검색..." id="searchInput"/>
    <span class="divider"></span>
    <button onclick="resetFocus()">&#8634; 초기화</button>
    <button onclick="fitAll()">&#9634; 전체보기</button>
  </div>

  <div class="focus-panel" id="focusPanel">
    <button class="fp-close" onclick="resetFocus()">&times;</button>
    <div class="fp-header">
      <div class="fp-icon" id="fpIcon"></div>
      <div><div class="fp-name" id="fpName"></div><div class="fp-cat" id="fpCat"></div></div>
    </div>
    <div class="fp-status" id="fpStatus"><span class="dot" id="fpStatusDot"></span><span id="fpStatusLabel"></span></div>
    <div class="fp-connections" id="fpConnectionsSection"></div>
  </div>

  <div class="legend">
    <div class="item"><span class="dot" style="background:#22c55e"></span> 연결됨</div>
    <div class="item"><span class="dot" style="background:#f59e0b"></span> 진행중</div>
    <div class="item"><span class="dot" style="background:#ef4444"></span> 오류</div>
    <div class="item"><span class="dot" style="background:#64748b"></span> 미시작</div>
    <div class="item" style="margin-left:4px"><svg width="24" height="8"><line x1="0" y1="4" x2="10" y2="4" stroke="#94a3b8" stroke-width="1.5"/></svg> Hub</div>
    <div class="item"><svg width="24" height="8"><line x1="0" y1="4" x2="24" y2="4" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/></svg> S2S</div>
  </div>

  <div class="stats" id="statsPanel"></div>
</div>

<script>
// ══════════════════════════════════════════════════
// Data
// ══════════════════════════════════════════════════
const services = [
  { id: 'auth',      name: 'Supabase Auth',    cat: '인증',       icon: '🔒', status: 'connected',   color: '#6366f1', group: 'core' },
  { id: 'db',        name: 'Supabase DB',      cat: '데이터베이스', icon: '🗄️', status: 'connected',   color: '#3b82f6', group: 'core' },
  { id: 'storage',   name: 'Storage',          cat: '파일 저장',   icon: '📦', status: 'in_progress', color: '#06b6d4', group: 'core' },
  { id: 'stripe',    name: 'Stripe',           cat: '결제',       icon: '💳', status: 'not_started', color: '#ef4444', group: 'core' },
  { id: 'cf',        name: 'Cloudflare',       cat: '엣지 배포',   icon: '☁️', status: 'connected',   color: '#f97316', group: 'runtime' },
  { id: 'vercel',    name: 'Vercel',           cat: '프리뷰',     icon: '▲',  status: 'connected',   color: '#a3a3a3', group: 'runtime' },
  { id: 'github',    name: 'GitHub',           cat: 'CI/CD',     icon: '🐙', status: 'connected',   color: '#8b5cf6', group: 'runtime' },
  { id: 'ga',        name: 'Google Analytics',  cat: '분석',       icon: '📊', status: 'connected',   color: '#f59e0b', group: 'growth' },
  { id: 'resend',    name: 'Resend',           cat: '이메일',     icon: '📧', status: 'in_progress', color: '#f59e0b', group: 'growth' },
  { id: 'openai',    name: 'OpenAI',           cat: 'AI 엔진',    icon: '🤖', status: 'connected',   color: '#a855f7', group: 'intelligence' },
  { id: 'anthropic', name: 'Anthropic',        cat: 'Claude API', icon: '🧠', status: 'connected',   color: '#ec4899', group: 'intelligence' },
  { id: 'perplexity',name: 'Perplexity',       cat: 'AI 검색',    icon: '🔍', status: 'not_started', color: '#ec4899', group: 'intelligence' },
];

const s2sConns = [
  { from: 'auth',    to: 'db',        type: 'api_call',    label: 'API 호출' },
  { from: 'cf',      to: 'vercel',    type: 'integrates',  label: '통합' },
  { from: 'github',  to: 'cf',        type: 'webhook',     label: '웹훅' },
  { from: 'openai',  to: 'anthropic', type: 'alternative', label: '대체' },
  { from: 'db',      to: 'storage',   type: 'uses',        label: '사용' },
  { from: 'auth',    to: 'stripe',    type: 'uses',        label: '사용' },
  { from: 'resend',  to: 'auth',      type: 'integrates',  label: '통합' },
  { from: 'ga',      to: 'cf',        type: 'uses',        label: '데이터 수집' },
];

const statusMeta = {
  connected:   { color: '#22c55e', label: '연결됨',  bg: 'rgba(34,197,94,0.1)',   badge: 'Active' },
  in_progress: { color: '#f59e0b', label: '진행 중', bg: 'rgba(245,158,11,0.1)',  badge: '설정 중' },
  error:       { color: '#ef4444', label: '오류',    bg: 'rgba(239,68,68,0.1)',   badge: 'Error' },
  not_started: { color: '#64748b', label: '미시작',  bg: 'rgba(100,116,139,0.08)', badge: '대기' },
};

const groupMeta = {
  core:         { color: '#6366f1', label: 'Core' },
  runtime:      { color: '#22c55e', label: 'Runtime' },
  growth:       { color: '#f59e0b', label: 'Growth' },
  intelligence: { color: '#ec4899', label: 'Intelligence' },
  infra:        { color: '#8b5cf6', label: 'Infra' },
};

// ══════════════════════════════════════════════════
// State & Layout
// ══════════════════════════════════════════════════
let cx, cy, focusedId = null;

function hexPoints(r) {
  let pts = '';
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i - Math.PI / 6;
    pts += `${(r * Math.cos(a)).toFixed(2)},${(r * Math.sin(a)).toFixed(2)} `;
  }
  return pts.trim();
}

function computeLayout() {
  const w = window.innerWidth, h = window.innerHeight;
  cx = w / 2; cy = h / 2;
  document.getElementById('mapSvg').setAttribute('viewBox', `0 0 ${w} ${h}`);

  // Position hub ambient
  const hubAmb = document.getElementById('hubAmbient');
  hubAmb.setAttribute('cx', cx); hubAmb.setAttribute('cy', cy);

  // Guide rings
  const guideRings = document.getElementById('guideRings');
  guideRings.innerHTML = '';
  [160, 280, 380].forEach(r => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', 'rgba(148,163,184,0.05)');
    c.setAttribute('stroke-width', '0.5'); c.setAttribute('stroke-dasharray', '6 4');
    guideRings.appendChild(c);
  });

  // Radial layout per group
  const groups = {};
  services.forEach(s => { if (!groups[s.group]) groups[s.group] = []; groups[s.group].push(s); });
  const groupOrder = ['core', 'runtime', 'growth', 'intelligence', 'infra'];
  const sectorSpan = 360 / groupOrder.length;
  const minDim = Math.min(w, h);

  groupOrder.forEach((group, gi) => {
    const nodes = groups[group] || [];
    if (nodes.length === 0) return;
    const startAngle = -90 + gi * sectorSpan + 10;
    const endAngle = -90 + (gi + 1) * sectorSpan - 10;
    const range = endAngle - startAngle;
    const innerR = minDim * 0.24;
    const outerR = minDim * 0.38;

    nodes.forEach((svc, i) => {
      const angle = nodes.length === 1
        ? startAngle + range / 2
        : startAngle + (range / (nodes.length - 1)) * i;
      const r = nodes.length <= 3 ? innerR : (i % 2 === 0 ? innerR : outerR);
      const rad = (angle * Math.PI) / 180;
      svc._x = cx + r * Math.cos(rad);
      svc._y = cy + r * Math.sin(rad);
    });
  });

  updateStats();
}

// ══════════════════════════════════════════════════
// Connections helper: get ALL connected IDs for a given node
// (both S2S and recognizing that every node connects to Hub)
// ══════════════════════════════════════════════════
function getS2SConnectedIds(id) {
  const ids = new Set();
  s2sConns.forEach(c => {
    if (c.from === id) ids.add(c.to);
    if (c.to === id) ids.add(c.from);
  });
  return ids;
}

// ══════════════════════════════════════════════════
// SVG helpers
// ══════════════════════════════════════════════════
function createSVG(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'textContent') el.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v);
  }
  return el;
}

// Smooth bezier path from hub to node
function hubBezier(svc) {
  const dx = svc._x - cx, dy = svc._y - cy;
  const len = Math.sqrt(dx * dx + dy * dy);
  // Perpendicular offset for natural curve
  const nx = -dy / len * 0.15 * len;
  const ny = dx / len * 0.15 * len;
  const cp1x = cx + dx * 0.35 + nx * 0.3;
  const cp1y = cy + dy * 0.35 + ny * 0.3;
  const cp2x = cx + dx * 0.65 - nx * 0.1;
  const cp2y = cy + dy * 0.65 - ny * 0.1;
  return `M ${cx} ${cy} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${svc._x} ${svc._y}`;
}

// ══════════════════════════════════════════════════
// Render
// ══════════════════════════════════════════════════
function render() {
  const edgesLayer = document.getElementById('edgesLayer');
  const nodesLayer = document.getElementById('nodesLayer');
  edgesLayer.innerHTML = '';
  nodesLayer.innerHTML = '';

  const s2sConnIds = focusedId ? getS2SConnectedIds(focusedId) : new Set();
  const isFocusMode = !!focusedId;

  // Create arrow markers dynamically (so we can have per-color markers)
  const usedColors = new Set();
  services.forEach(s => usedColors.add(s.color));
  usedColors.add('#94a3b8');

  const defs = document.querySelector('#mapSvg defs');
  // Clean old dynamic markers
  defs.querySelectorAll('.dyn-marker').forEach(m => m.remove());
  usedColors.forEach(color => {
    const markerId = 'arrow-' + color.replace('#', '');
    const marker = createSVG('marker', {
      id: markerId, viewBox: '0 0 10 10', refX: '9', refY: '5',
      markerWidth: '5', markerHeight: '5', orient: 'auto-start-reverse', class: 'dyn-marker',
    });
    marker.appendChild(createSVG('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: color, opacity: '0.6' }));
    defs.appendChild(marker);
  });

  // ── Hub edges (every service connects to hub) ──
  services.forEach(svc => {
    const isRelated = !isFocusMode || focusedId === svc.id || s2sConnIds.has(svc.id);
    const edgeColor = svc.color;
    const st = statusMeta[svc.status];
    const path = hubBezier(svc);
    const markerId = 'arrow-' + edgeColor.replace('#', '');

    // Glow underlay (wider, blurred)
    if (isRelated) {
      edgesLayer.appendChild(createSVG('path', {
        d: path, fill: 'none', stroke: edgeColor, 'stroke-width': '6',
        'stroke-linecap': 'round', opacity: isFocusMode ? '0.08' : '0.04',
        style: { filter: 'blur(4px)' },
      }));
    }

    // Main edge
    const opacity = isFocusMode ? (isRelated ? 0.65 : 0.03) : 0.5;
    const el = createSVG('path', {
      d: path, fill: 'none', stroke: edgeColor,
      'stroke-width': isRelated && isFocusMode ? '2.2' : '1.6',
      'stroke-linecap': 'round', opacity: String(opacity),
      'marker-end': `url(#${markerId})`,
    });
    el.classList.add('edge-line');
    edgesLayer.appendChild(el);

    // Status indicator (small colored dot along edge midpoint)
    if (isRelated && svc.status !== 'connected') {
      const mid = 0.5;
      const mx = cx + (svc._x - cx) * mid;
      const my = cy + (svc._y - cy) * mid;
      edgesLayer.appendChild(createSVG('circle', {
        cx: mx, cy: my, r: '3', fill: st.color, opacity: '0.7',
      }));
    }

    // Flow particle for connected services
    if (svc.status === 'connected' && isRelated) {
      const particle = createSVG('circle', { r: '2.5', fill: edgeColor });
      particle.style.filter = `drop-shadow(0 0 4px ${edgeColor})`;
      const anim = createSVG('animateMotion', { dur: '3.5s', repeatCount: 'indefinite', path: path });
      particle.appendChild(anim);
      edgesLayer.appendChild(particle);
    }
  });

  // ── S2S edges (service-to-service) ──
  s2sConns.forEach(conn => {
    const from = services.find(s => s.id === conn.from);
    const to = services.find(s => s.id === conn.to);
    if (!from || !to) return;

    const isRelated = !isFocusMode || focusedId === conn.from || focusedId === conn.to;
    const edgeColor = isRelated ? '#94a3b8' : '#1e293b';
    const opacity = isFocusMode ? (isRelated ? 0.55 : 0.02) : 0.25;

    // Bezier for S2S (slight curve to avoid overlap with hub edges)
    const mx = (from._x + to._x) / 2;
    const my = (from._y + to._y) / 2;
    const dx = to._x - from._x, dy = to._y - from._y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const off = Math.min(len * 0.15, 30); // perpendicular offset
    const cpx = mx + (-dy / len) * off;
    const cpy = my + (dx / len) * off;
    const path = `M ${from._x} ${from._y} Q ${cpx} ${cpy} ${to._x} ${to._y}`;

    const el = createSVG('path', {
      d: path, fill: 'none', stroke: edgeColor,
      'stroke-width': isRelated ? '1.4' : '0.8',
      'stroke-dasharray': '5 3', opacity: String(opacity),
      'stroke-linecap': 'round',
      'marker-end': `url(#arrow-${edgeColor.replace('#', '')})`,
    });
    el.classList.add('edge-line');
    edgesLayer.appendChild(el);

    // Label at midpoint (only when related and focused)
    if (isRelated && isFocusMode) {
      const labelG = createSVG('g', { transform: `translate(${cpx}, ${cpy})` });
      labelG.appendChild(createSVG('rect', {
        x: '-22', y: '-8', width: '44', height: '16', rx: '4',
        fill: 'rgba(17,24,39,0.9)', stroke: 'rgba(148,163,184,0.15)', 'stroke-width': '0.5',
      }));
      labelG.appendChild(createSVG('text', {
        'text-anchor': 'middle', y: '4', fill: '#94a3b8', 'font-size': '7.5',
        textContent: conn.label || conn.type,
      }));
      edgesLayer.appendChild(labelG);
    }
  });

  // ── Hub node ──
  const hubG = createSVG('g', { transform: `translate(${cx}, ${cy})` });
  hubG.style.cursor = 'pointer';
  hubG.onclick = () => resetFocus();

  const totalSvc = services.length;
  const connSvc = services.filter(s => s.status === 'connected').length;
  const hPct = connSvc / totalSvc;
  const ringR = 52, ringC = 2 * Math.PI * ringR;

  // Health ring bg
  hubG.appendChild(createSVG('circle', {
    r: ringR, fill: 'none', stroke: 'rgba(148,163,184,0.08)', 'stroke-width': '3',
  }));
  // Health ring fg
  hubG.appendChild(createSVG('circle', {
    r: ringR, fill: 'none', stroke: '#22c55e', 'stroke-width': '3',
    'stroke-dasharray': `${hPct * ringC} ${(1 - hPct) * ringC}`,
    'stroke-linecap': 'round', transform: 'rotate(-90)', opacity: '0.6',
  }));

  // Hub hex
  const hubHex = createSVG('polygon', {
    points: hexPoints(38), fill: '#111827', stroke: '#3b82f6', 'stroke-width': '2.5',
  });
  hubHex.style.filter = 'drop-shadow(0 0 16px rgba(59,130,246,0.3))';
  hubG.appendChild(hubHex);

  hubG.appendChild(createSVG('text', {
    'text-anchor': 'middle', y: '-4', fill: '#fff', 'font-size': '11', 'font-weight': '700',
    textContent: 'My Project',
  }));
  hubG.appendChild(createSVG('text', {
    'text-anchor': 'middle', y: '12', fill: '#94a3b8', 'font-size': '9',
    textContent: `${connSvc}/${totalSvc} connected`,
  }));
  nodesLayer.appendChild(hubG);

  // ── Service nodes ──
  services.forEach((svc, idx) => {
    const isFocused = focusedId === svc.id;
    const isS2SConn = s2sConnIds.has(svc.id);
    const isRelated = !isFocusMode || isFocused || isS2SConn;
    const st = statusMeta[svc.status] || statusMeta.not_started;
    const hexR = 42;

    const g = createSVG('g', { transform: `translate(${svc._x}, ${svc._y})` });
    g.classList.add('hex-node');
    g.style.animationDelay = `${idx * 40}ms`;

    if (isFocusMode && !isRelated) g.classList.add('faded');
    if (isFocused) g.classList.add('focused');
    g.onclick = (e) => { e.stopPropagation(); toggleFocus(svc.id); };

    // Focus outer glow ring
    if (isFocused) {
      const oh = createSVG('polygon', {
        points: hexPoints(50), fill: 'none', stroke: svc.color,
        'stroke-width': '1.5', opacity: '0.3',
      });
      oh.style.animation = 'hex-pulse 1.5s ease-in-out infinite';
      g.appendChild(oh);
    }

    // Connected highlight ring (subtle)
    if (isS2SConn && isFocusMode && !isFocused) {
      g.appendChild(createSVG('polygon', {
        points: hexPoints(46), fill: 'none', stroke: svc.color,
        'stroke-width': '1', opacity: '0.2',
      }));
    }

    // Main hex
    const hex = createSVG('polygon', {
      points: hexPoints(hexR), fill: '#111827', stroke: svc.color,
      'stroke-width': isFocused ? '2.5' : '1.5',
    });
    hex.classList.add('hex-shape');
    hex.style.filter = `drop-shadow(0 0 ${isFocused ? 18 : 6}px ${svc.color}${isFocused ? '55' : '20'})`;
    g.appendChild(hex);

    // Status bar (top arc of hex)
    g.appendChild(createSVG('line', {
      x1: '-22', y1: `${-hexR + 6}`, x2: '22', y2: `${-hexR + 6}`,
      stroke: st.color, 'stroke-width': '2.5', 'stroke-linecap': 'round',
      opacity: (svc.status === 'in_progress' || svc.status === 'error') ? undefined : '0.8',
      style: (svc.status === 'in_progress' || svc.status === 'error')
        ? { animation: 'status-pulse-anim 2s ease-in-out infinite' } : {},
    }));

    // Icon bg + icon
    g.appendChild(createSVG('rect', {
      x: '-14', y: '-20', width: '28', height: '28', rx: '8', fill: `${svc.color}18`,
    }));
    g.appendChild(createSVG('text', {
      'text-anchor': 'middle', y: '2', 'font-size': '16', textContent: svc.icon,
    }));

    // Label
    const label = createSVG('text', {
      'text-anchor': 'middle', y: '20', fill: '#e2e8f0',
      'font-size': '10', 'font-weight': '600', textContent: svc.name.length > 15 ? svc.name.slice(0, 13) + '..' : svc.name,
    });
    label.classList.add('hex-label');
    g.appendChild(label);

    // Category
    g.appendChild(createSVG('text', {
      'text-anchor': 'middle', y: '31', fill: '#64748b', 'font-size': '8', textContent: svc.cat,
    }));

    // Status dot (top-right corner)
    const dotG = createSVG('g', { transform: `translate(${hexR - 10}, ${-hexR + 14})` });
    dotG.appendChild(createSVG('circle', {
      r: '6', fill: '#111827', stroke: 'rgba(148,163,184,0.15)', 'stroke-width': '1',
    }));
    const statusDot = createSVG('circle', { r: '3', fill: st.color });
    if (svc.status === 'in_progress' || svc.status === 'error') {
      statusDot.style.animation = 'status-pulse-anim 2s ease-in-out infinite';
    }
    dotG.appendChild(statusDot);
    g.appendChild(dotG);

    // Metric badge (ALL statuses, not just connected)
    const badgeG = createSVG('g', { transform: `translate(0, ${hexR + 10})` });
    const badgeW = st.badge.length * 5.5 + 16;
    badgeG.appendChild(createSVG('rect', {
      x: `${-badgeW / 2}`, y: '-8', width: `${badgeW}`, height: '16', rx: '4',
      fill: `${st.color}12`, stroke: `${st.color}25`, 'stroke-width': '0.5',
    }));
    badgeG.appendChild(createSVG('text', {
      'text-anchor': 'middle', y: '3.5', fill: st.color, 'font-size': '7.5', 'font-weight': '500',
      textContent: st.badge,
    }));
    g.appendChild(badgeG);

    // Group indicator (small colored line at bottom)
    const gm = groupMeta[svc.group];
    if (gm) {
      g.appendChild(createSVG('line', {
        x1: '-12', y1: `${hexR - 3}`, x2: '12', y2: `${hexR - 3}`,
        stroke: gm.color, 'stroke-width': '1.5', 'stroke-linecap': 'round', opacity: '0.4',
      }));
    }

    nodesLayer.appendChild(g);
  });
}

// ══════════════════════════════════════════════════
// Focus interaction
// ══════════════════════════════════════════════════
function toggleFocus(id) {
  if (focusedId === id) resetFocus();
  else { focusedId = id; render(); showFocusPanel(id); }
}

function resetFocus() {
  focusedId = null;
  render();
  document.getElementById('focusPanel').classList.remove('visible');
}

function showFocusPanel(id) {
  const svc = services.find(s => s.id === id);
  if (!svc) return;
  const st = statusMeta[svc.status];
  const gm = groupMeta[svc.group];
  const panel = document.getElementById('focusPanel');

  document.getElementById('fpIcon').textContent = svc.icon;
  document.getElementById('fpIcon').style.background = `${svc.color}20`;
  document.getElementById('fpName').textContent = svc.name;
  document.getElementById('fpCat').textContent = `${svc.cat} · ${gm?.label || svc.group}`;
  document.getElementById('fpStatusDot').style.background = st.color;
  document.getElementById('fpStatusLabel').textContent = st.label;
  document.getElementById('fpStatus').style.background = st.bg;

  // Build connections section
  const section = document.getElementById('fpConnectionsSection');
  section.innerHTML = '';

  // S2S connections
  const s2sIds = getS2SConnectedIds(id);
  if (s2sIds.size > 0) {
    const h4 = document.createElement('h4');
    h4.textContent = `서비스 간 연결 (${s2sIds.size})`;
    h4.style.cssText = 'font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#475569;margin-bottom:8px;font-weight:600';
    section.appendChild(h4);

    s2sIds.forEach(cid => {
      const cs = services.find(s => s.id === cid);
      if (!cs) return;
      const conn = s2sConns.find(c => (c.from === id && c.to === cid) || (c.to === id && c.from === cid));
      const cst = statusMeta[cs.status];
      const direction = conn && conn.from === id ? '→' : '←';
      const item = document.createElement('div');
      item.className = 'fp-conn-item';
      item.onclick = () => toggleFocus(cid);
      item.innerHTML = `
        <span class="conn-dot" style="background:${cst.color}"></span>
        <span>${cs.icon} ${cs.name}</span>
        <span class="conn-type">${direction} ${conn?.label || conn?.type || ''}</span>
      `;
      section.appendChild(item);
    });
  }

  // Hub connection (always present)
  const hubLabel = document.createElement('div');
  hubLabel.style.cssText = 'font-size:10px;color:#475569;margin:12px 0 6px;font-weight:600;letter-spacing:0.3px;border-top:1px solid rgba(148,163,184,0.12);padding-top:10px';
  hubLabel.textContent = 'Hub 연결';
  section.appendChild(hubLabel);

  const hubItem = document.createElement('div');
  hubItem.className = 'fp-conn-item';
  hubItem.onclick = () => resetFocus();
  hubItem.innerHTML = `<span class="conn-dot" style="background:#3b82f6"></span><span>🏠 My Project</span><span class="conn-type">hub</span>`;
  section.appendChild(hubItem);

  // Total connection count
  const total = s2sIds.size + 1; // +1 for hub
  const countLabel = document.createElement('div');
  countLabel.style.cssText = 'font-size:10px;color:#475569;margin-top:10px;text-align:center;padding-top:8px;border-top:1px solid rgba(148,163,184,0.08)';
  countLabel.textContent = `총 ${total}개 연결`;
  section.appendChild(countLabel);

  panel.classList.add('visible');
}

// ══════════════════════════════════════════════════
// Stats panel
// ══════════════════════════════════════════════════
function updateStats() {
  const panel = document.getElementById('statsPanel');
  const total = services.length;
  const connected = services.filter(s => s.status === 'connected').length;
  const inProgress = services.filter(s => s.status === 'in_progress').length;
  const totalEdges = services.length + s2sConns.length; // hub edges + s2s edges
  panel.innerHTML = `
    <div><div class="stat-val">${total}</div>서비스</div>
    <div><div class="stat-val" style="color:#22c55e">${connected}</div>연결됨</div>
    <div><div class="stat-val" style="color:#f59e0b">${inProgress}</div>진행중</div>
    <div><div class="stat-val">${totalEdges}</div>연결</div>
  `;
}

// ══════════════════════════════════════════════════
// Init
// ══════════════════════════════════════════════════
function fitAll() { resetFocus(); }
function init() { computeLayout(); render(); }

window.addEventListener('resize', () => { computeLayout(); render(); });
window.addEventListener('DOMContentLoaded', init);

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  if (!q) { render(); return; }
  document.querySelectorAll('.hex-node').forEach((node, i) => {
    const svc = services[i]; if (!svc) return;
    const match = svc.name.toLowerCase().includes(q) || svc.cat.toLowerCase().includes(q);
    node.style.opacity = match ? '' : '0.08';
    node.style.pointerEvents = match ? '' : 'none';
  });
});

document.getElementById('canvas').addEventListener('click', (e) => {
  if (!e.target.closest('.hex-node') && !e.target.closest('.focus-panel') && !e.target.closest('.toolbar'))
    resetFocus();
});
</script>
</body>
