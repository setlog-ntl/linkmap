<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Linkmap Service Map — Variant 6: Prism Flow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    width: 1200px; height: 700px;
    overflow: hidden;
    font-family: -apple-system, 'Pretendard Variable', sans-serif;
    color: #e0e6f0;
  }
  svg { display: block; }

  /* Tooltip */
  .tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(12, 16, 30, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    backdrop-filter: blur(12px);
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 100;
    max-width: 200px;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .tooltip .tt-status { font-size: 11px; opacity: 0.7; }
</style>
</head>
<body>
<div class="tooltip" id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-status"></div>
</div>

<svg id="canvas" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <!-- Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>

    <!-- Hub glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(180,240,255,0.5)"/>
      <stop offset="50%" stop-color="rgba(100,200,255,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Health ring gradient -->
    <linearGradient id="healthRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#76ff8a"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Glass overlay -->
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background vignette -->
  <rect width="1200" height="700" fill="#0a0e1a"/>
  <rect width="1200" height="700" fill="url(#vignette)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.5" fill="#fff"/>
    </pattern>
    <rect width="1200" height="700" fill="url(#dots)"/>
  </g>

  <!-- Edges layer -->
  <g id="edges"></g>
  <!-- Particles layer -->
  <g id="particles"></g>
  <!-- Nodes layer -->
  <g id="nodes"></g>
</svg>

<script>
const CX = 600, CY = 350, RADIUS = 220;

const services = [
  { id: 'supabase',   name: 'Supabase',    type: 'DB',      status: 'connected',   group: 'Core' },
  { id: 'vercel',     name: 'Vercel',       type: 'Deploy',  status: 'connected',   group: 'Runtime' },
  { id: 'stripe',     name: 'Stripe',       type: 'Payment', status: 'connected',   group: 'Growth' },
  { id: 'resend',     name: 'Resend',       type: 'Email',   status: 'in-progress', group: 'Growth' },
  { id: 'clerk',      name: 'Clerk',        type: 'Auth',    status: 'connected',   group: 'Core' },
  { id: 'openai',     name: 'OpenAI',       type: 'AI',      status: 'error',       group: 'Intel' },
  { id: 'sentry',     name: 'Sentry',       type: 'Monitor', status: 'connected',   group: 'Infra' },
  { id: 'cloudflare', name: 'CloudFlare',   type: 'CDN',     status: 'not-started', group: 'Infra' },
];

const statusColors = {
  'connected':   '#22c55e',
  'in-progress': '#eab308',
  'error':       '#f97316',
  'not-started': '#6b7280',
};

const statusLabels = {
  'connected':   '연결됨',
  'in-progress': '진행 중',
  'error':       '오류',
  'not-started': '미연결',
};

// Compute positions
services.forEach((s, i) => {
  const angle = (i / services.length) * Math.PI * 2 - Math.PI / 2;
  s.x = CX + Math.cos(angle) * RADIUS;
  s.y = CY + Math.sin(angle) * RADIUS;
  s.angle = angle;
  s.angleDeg = ((angle * 180 / Math.PI) + 360) % 360;
});

// Prismatic hue from angle (0-360)
function prismHue(angleDeg) {
  return angleDeg; // direct mapping: angle = hue
}

function hsl(h, s, l) {
  return `hsl(${h}, ${s}%, ${l}%)`;
}

// ── Build SVG ──
const edgesG = document.getElementById('edges');
const particlesG = document.getElementById('particles');
const nodesG = document.getElementById('nodes');
const tooltip = document.getElementById('tooltip');

// ── Draw edges ──
services.forEach((s, i) => {
  const hue = prismHue(s.angleDeg);
  const edgeId = `edge-${i}`;

  // Gradient for this edge
  const grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
  grad.id = `eg-${i}`;
  grad.setAttribute('x1', CX); grad.setAttribute('y1', CY);
  grad.setAttribute('x2', s.x); grad.setAttribute('y2', s.y);
  grad.setAttribute('gradientUnits', 'userSpaceOnUse');
  grad.innerHTML = `
    <stop offset="0%" stop-color="${hsl(hue, 80, 70)}" stop-opacity="0.2"/>
    <stop offset="50%" stop-color="${hsl(hue, 90, 65)}" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="${hsl(hue, 80, 60)}" stop-opacity="0.5"/>
  `;
  document.querySelector('defs').appendChild(grad);

  // Outer colored beam
  const outer = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  outer.setAttribute('x1', CX); outer.setAttribute('y1', CY);
  outer.setAttribute('x2', s.x); outer.setAttribute('y2', s.y);
  outer.setAttribute('stroke', `url(#eg-${i})`);
  outer.setAttribute('stroke-width', s.status === 'not-started' ? '1' : '2.5');
  outer.setAttribute('opacity', s.status === 'not-started' ? '0.2' : '0.6');
  outer.id = `edge-outer-${i}`;
  edgesG.appendChild(outer);

  // Inner white core beam
  if (s.status !== 'not-started') {
    const inner = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    inner.setAttribute('x1', CX); inner.setAttribute('y1', CY);
    inner.setAttribute('x2', s.x); inner.setAttribute('y2', s.y);
    inner.setAttribute('stroke', 'rgba(255,255,255,0.5)');
    inner.setAttribute('stroke-width', '0.5');
    edgesG.appendChild(inner);
  }
});

// ── Draw hub (diamond) ──
const hubSize = 38;
const hubG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
hubG.setAttribute('class', 'hub');

// Outer glow
const hubGlowC = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
hubGlowC.setAttribute('cx', CX); hubGlowC.setAttribute('cy', CY);
hubGlowC.setAttribute('r', 55);
hubGlowC.setAttribute('fill', 'url(#hubGlow)');
hubG.appendChild(hubGlowC);

// Health ring
const healthCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
healthCircle.setAttribute('cx', CX); healthCircle.setAttribute('cy', CY);
healthCircle.setAttribute('r', 44);
healthCircle.setAttribute('fill', 'none');
healthCircle.setAttribute('stroke', 'url(#healthRing)');
healthCircle.setAttribute('stroke-width', '2');
healthCircle.setAttribute('opacity', '0.5');
healthCircle.setAttribute('stroke-dasharray', '6 3');
hubG.appendChild(healthCircle);

// Health arc (5/8 = 62.5%)
const healthArc = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
healthArc.setAttribute('cx', CX); healthArc.setAttribute('cy', CY);
healthArc.setAttribute('r', 44);
healthArc.setAttribute('fill', 'none');
healthArc.setAttribute('stroke', '#00e5ff');
healthArc.setAttribute('stroke-width', '2.5');
healthArc.setAttribute('stroke-dasharray', `${0.625 * 2 * Math.PI * 44} ${2 * Math.PI * 44}`);
healthArc.setAttribute('stroke-linecap', 'round');
healthArc.setAttribute('transform', `rotate(-90 ${CX} ${CY})`);
healthArc.setAttribute('filter', 'url(#glowSoft)');
hubG.appendChild(healthArc);

// Diamond shape
const diamond = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
const dp = `${CX},${CY-hubSize} ${CX+hubSize},${CY} ${CX},${CY+hubSize} ${CX-hubSize},${CY}`;
diamond.setAttribute('points', dp);
diamond.setAttribute('fill', 'rgba(15,20,35,0.85)');
diamond.setAttribute('stroke', 'rgba(180,240,255,0.5)');
diamond.setAttribute('stroke-width', '1.5');
hubG.appendChild(diamond);

// Inner glow diamond
const diamondInner = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
const dpI = `${CX},${CY-hubSize+8} ${CX+hubSize-8},${CY} ${CX},${CY+hubSize-8} ${CX-hubSize+8},${CY}`;
diamondInner.setAttribute('points', dpI);
diamondInner.setAttribute('fill', 'none');
diamondInner.setAttribute('stroke', 'rgba(180,240,255,0.15)');
diamondInner.setAttribute('stroke-width', '1');
hubG.appendChild(diamondInner);

// Hub label
const hubText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
hubText.setAttribute('x', CX); hubText.setAttribute('y', CY - 2);
hubText.setAttribute('text-anchor', 'middle');
hubText.setAttribute('fill', '#e0f4ff');
hubText.setAttribute('font-size', '12');
hubText.setAttribute('font-weight', '600');
hubText.textContent = 'My Project';
hubG.appendChild(hubText);

const hubSub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
hubSub.setAttribute('x', CX); hubSub.setAttribute('y', CY + 13);
hubSub.setAttribute('text-anchor', 'middle');
hubSub.setAttribute('fill', 'rgba(180,240,255,0.5)');
hubSub.setAttribute('font-size', '9');
hubSub.textContent = '5/8 Connected';
hubG.appendChild(hubSub);

nodesG.appendChild(hubG);

// ── Draw service nodes ──
const nodeWidth = 120, nodeHeight = 56, nodeRadius = 10;

services.forEach((s, i) => {
  const hue = prismHue(s.angleDeg);
  const nx = s.x - nodeWidth / 2;
  const ny = s.y - nodeHeight / 2;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'service-node');
  g.setAttribute('data-index', i);
  g.style.cursor = 'pointer';

  // Card background
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', nx); rect.setAttribute('y', ny);
  rect.setAttribute('width', nodeWidth); rect.setAttribute('height', nodeHeight);
  rect.setAttribute('rx', nodeRadius);
  rect.setAttribute('fill', 'rgba(14,18,32,0.88)');
  rect.setAttribute('stroke', `hsla(${hue},60%,50%,0.15)`);
  rect.setAttribute('stroke-width', '1');
  g.appendChild(rect);

  // Prismatic top highlight bar
  const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bar.setAttribute('x', nx + 1); bar.setAttribute('y', ny + 1);
  bar.setAttribute('width', nodeWidth - 2); bar.setAttribute('height', '3');
  bar.setAttribute('rx', `${nodeRadius - 1}`);
  bar.setAttribute('fill', hsl(hue, 80, 60));
  bar.setAttribute('opacity', s.status === 'not-started' ? '0.15' : '0.7');
  g.appendChild(bar);

  // Glass overlay (top half)
  const glass = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  glass.setAttribute('x', nx); glass.setAttribute('y', ny);
  glass.setAttribute('width', nodeWidth); glass.setAttribute('height', nodeHeight / 2);
  glass.setAttribute('rx', nodeRadius);
  glass.setAttribute('fill', 'url(#glassTop)');
  glass.setAttribute('opacity', '0.5');
  g.appendChild(glass);

  // Status dot
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', nx + 14); dot.setAttribute('cy', ny + 24);
  dot.setAttribute('r', '4');
  dot.setAttribute('fill', statusColors[s.status]);
  if (s.status === 'connected') dot.setAttribute('filter', 'url(#glowSoft)');
  g.appendChild(dot);

  // Name
  const name = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  name.setAttribute('x', nx + 24); name.setAttribute('y', ny + 27);
  name.setAttribute('fill', '#e0e6f0');
  name.setAttribute('font-size', '12');
  name.setAttribute('font-weight', '600');
  name.textContent = s.name;
  g.appendChild(name);

  // Type
  const type = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  type.setAttribute('x', nx + 24); type.setAttribute('y', ny + 42);
  type.setAttribute('fill', 'rgba(200,210,230,0.5)');
  type.setAttribute('font-size', '10');
  type.textContent = s.type;
  g.appendChild(type);

  // Group badge
  const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  badge.setAttribute('x', nx + nodeWidth - 10); badge.setAttribute('y', ny + 42);
  badge.setAttribute('text-anchor', 'end');
  badge.setAttribute('fill', `hsla(${hue},60%,65%,0.5)`);
  badge.setAttribute('font-size', '8');
  badge.textContent = s.group;
  g.appendChild(badge);

  // Hover effects
  g.addEventListener('mouseenter', (e) => {
    rect.setAttribute('stroke', `hsla(${hue},70%,60%,0.5)`);
    rect.setAttribute('fill', 'rgba(18,24,45,0.95)');
    bar.setAttribute('opacity', '1');
    document.getElementById(`edge-outer-${i}`).setAttribute('opacity', '1');
    document.getElementById(`edge-outer-${i}`).setAttribute('stroke-width', '3.5');

    const tt = document.getElementById('tooltip');
    tt.querySelector('.tt-name').textContent = `${s.name} — ${s.type}`;
    tt.querySelector('.tt-status').textContent = `${statusLabels[s.status]} · ${s.group}`;
    tt.classList.add('show');
  });

  g.addEventListener('mousemove', (e) => {
    const tt = document.getElementById('tooltip');
    tt.style.left = (e.clientX + 14) + 'px';
    tt.style.top = (e.clientY - 10) + 'px';
  });

  g.addEventListener('mouseleave', () => {
    rect.setAttribute('stroke', `hsla(${hue},60%,50%,0.15)`);
    rect.setAttribute('fill', 'rgba(14,18,32,0.88)');
    bar.setAttribute('opacity', s.status === 'not-started' ? '0.15' : '0.7');
    document.getElementById(`edge-outer-${i}`).setAttribute('opacity', s.status === 'not-started' ? '0.2' : '0.6');
    document.getElementById(`edge-outer-${i}`).setAttribute('stroke-width', s.status === 'not-started' ? '1' : '2.5');
    document.getElementById('tooltip').classList.remove('show');
  });

  nodesG.appendChild(g);
});

// ── Animated particles ──
class Particle {
  constructor(serviceIndex) {
    this.si = serviceIndex;
    this.s = services[serviceIndex];
    this.hue = prismHue(this.s.angleDeg);
    this.progress = Math.random();
    this.speed = 0.003 + Math.random() * 0.004;
    this.outbound = Math.random() > 0.5;

    // White dot
    this.el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    this.el.setAttribute('r', '2');
    this.el.setAttribute('fill', '#fff');
    this.el.setAttribute('filter', 'url(#glowSoft)');
    particlesG.appendChild(this.el);

    // Colored trail
    this.trail = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    this.trail.setAttribute('r', '5');
    this.trail.setAttribute('fill', hsl(this.hue, 80, 60));
    this.trail.setAttribute('opacity', '0.2');
    particlesG.insertBefore(this.trail, this.el);
  }

  update() {
    this.progress += this.speed;
    if (this.progress > 1) {
      this.progress = 0;
      this.outbound = !this.outbound;
    }

    const t = this.outbound ? this.progress : 1 - this.progress;
    const x = CX + (this.s.x - CX) * t;
    const y = CY + (this.s.y - CY) * t;

    this.el.setAttribute('cx', x);
    this.el.setAttribute('cy', y);
    this.trail.setAttribute('cx', x);
    this.trail.setAttribute('cy', y);

    // Fade near endpoints
    const fade = Math.min(t * 5, (1 - t) * 5, 1);
    this.el.setAttribute('opacity', fade * 0.9);
    this.trail.setAttribute('opacity', fade * 0.15);
  }
}

const allParticles = [];
services.forEach((s, i) => {
  if (s.status === 'not-started') return;
  const count = s.status === 'connected' ? 3 : s.status === 'in-progress' ? 2 : 1;
  for (let j = 0; j < count; j++) {
    allParticles.push(new Particle(i));
  }
});

// ── Health ring rotation ──
let ringAngle = 0;

function animate() {
  allParticles.forEach(p => p.update());
  ringAngle += 0.15;
  healthCircle.setAttribute('transform', `rotate(${ringAngle} ${CX} ${CY})`);
  requestAnimationFrame(animate);
}
animate();

// ── Legend ──
const legendG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const legendItems = [
  { label: '연결됨', color: statusColors['connected'] },
  { label: '진행 중', color: statusColors['in-progress'] },
  { label: '오류', color: statusColors['error'] },
  { label: '미연결', color: statusColors['not-started'] },
];
legendItems.forEach((item, i) => {
  const lx = 30, ly = 630 + i * 16;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', lx); c.setAttribute('cy', ly);
  c.setAttribute('r', '3'); c.setAttribute('fill', item.color);
  legendG.appendChild(c);
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', lx + 10); t.setAttribute('y', ly + 3.5);
  t.setAttribute('fill', 'rgba(200,210,230,0.5)'); t.setAttribute('font-size', '9');
  t.textContent = item.label;
  legendG.appendChild(t);
});
document.getElementById('canvas').appendChild(legendG);

// Title
const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
title.setAttribute('x', 30); title.setAttribute('y', 32);
title.setAttribute('fill', 'rgba(200,220,240,0.4)');
title.setAttribute('font-size', '11');
title.setAttribute('font-weight', '500');
title.textContent = 'Variant 6 — Prism Flow';
document.getElementById('canvas').appendChild(title);
</script>
</body>
</html>
