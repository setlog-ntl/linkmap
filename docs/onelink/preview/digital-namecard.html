<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Namecard — Premium Preview</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --accent:#3b82f6;
    --accent-end:#60a5fa;
    --card-bg:#ffffff;
    --card-text:#1a1a1a;
    --card-sub:#555;
    --card-border:rgba(0,0,0,.06);
    --page-bg:#f0f2f5;
    --page-text:#1a1a1a;
    --card-radius:16px;
    --card-shadow:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
    --flip-duration:.7s;
  }

  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,sans-serif;
    background:var(--page-bg);
    color:var(--page-text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    transition:background .4s,color .4s;
  }

  h1{
    font-size:1.25rem;
    font-weight:700;
    margin-bottom:8px;
    letter-spacing:-.02em;
  }

  /* ---------- Preset Tabs ---------- */
  .preset-bar{
    display:flex;
    gap:8px;
    margin-bottom:24px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .preset-btn{
    font-family:inherit;
    font-size:.8125rem;
    font-weight:600;
    padding:8px 18px;
    border:2px solid var(--card-border);
    border-radius:999px;
    background:var(--card-bg);
    color:var(--card-text);
    cursor:pointer;
    transition:all .25s;
  }
  .preset-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .preset-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* ---------- Scene (perspective wrapper) ---------- */
  .scene{
    perspective:1200px;
    width:100%;
    max-width:400px;
    cursor:pointer;
  }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    width:100%;
    transform-style:preserve-3d;
    transition:transform var(--flip-duration) cubic-bezier(.4,.2,.2,1);
    border-radius:var(--card-radius);
  }
  .card.flipped{
    transform:rotateY(180deg);
  }

  .card-face{
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:var(--card-radius);
    background:var(--card-bg);
    box-shadow:var(--card-shadow);
    overflow:hidden;
    transition:background .4s,color .4s;
  }
  .card-front{
    position:relative;
  }
  .card-back{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    transform:rotateY(180deg);
  }

  /* ---------- Shimmer Bar ---------- */
  .shimmer-bar{
    height:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-end),var(--accent));
    background-size:200% 100%;
    animation:shimmer 2.5s ease-in-out infinite;
    border-radius:var(--card-radius) var(--card-radius) 0 0;
  }
  @keyframes shimmer{
    0%{background-position:100% 0}
    50%{background-position:0 0}
    100%{background-position:100% 0}
  }

  /* ---------- Subtle paper texture ---------- */
  .card-face::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:var(--card-radius);
    pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    opacity:.5;
  }

  /* ---------- Front content ---------- */
  .front-body{
    padding:32px 28px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:4px;
  }
  .avatar{
    width:80px;height:80px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-end));
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-size:1.75rem;
    font-weight:700;
    margin-bottom:12px;
    box-shadow:0 4px 16px rgba(0,0,0,.1);
    transition:background .4s;
  }
  .name{
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--card-text);
  }
  .name-en{
    font-size:.8125rem;
    color:var(--card-sub);
    margin-bottom:4px;
  }
  .title{
    font-size:.9375rem;
    color:var(--accent);
    font-weight:600;
  }
  .company{
    font-size:.8125rem;
    color:var(--card-sub);
    margin-top:2px;
  }

  /* ---------- Back content ---------- */
  .back-body{
    padding:28px 24px 24px;
    display:flex;
    flex-direction:column;
    gap:12px;
    font-size:.85rem;
    color:var(--card-text);
    height:100%;
    overflow-y:auto;
  }
  .back-body .section-title{
    font-size:.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin-bottom:2px;
  }
  .info-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    line-height:1.5;
  }
  .info-icon{
    flex-shrink:0;
    width:18px;
    height:18px;
    color:var(--accent);
    margin-top:2px;
  }
  .info-text{
    word-break:break-all;
    color:var(--card-text);
  }
  .info-text a{
    color:var(--accent);
    text-decoration:none;
  }
  .info-text a:hover{
    text-decoration:underline;
  }

  /* QR placeholder */
  .qr-placeholder{
    width:80px;height:80px;
    border:2px dashed var(--accent);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:.625rem;
    color:var(--accent);
    text-align:center;
    align-self:center;
    margin-top:4px;
    padding:4px;
    line-height:1.3;
  }

  /* Social links */
  .social-row{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-top:4px;
  }
  .social-chip{
    font-size:.75rem;
    font-weight:600;
    padding:5px 14px;
    border-radius:999px;
    border:1.5px solid var(--accent);
    color:var(--accent);
    background:transparent;
    cursor:default;
    transition:all .25s;
  }

  /* ---------- Namecard hover tilt ---------- */
  .scene:hover .card:not(.flipped){
    transform:translateY(-4px) rotateX(3deg);
  }
  .scene:hover .card.flipped{
    transform:rotateY(180deg) translateY(-4px) rotateX(3deg);
  }

  /* ---------- Save Button ---------- */
  .save-btn{
    margin-top:20px;
    font-family:inherit;
    font-size:.875rem;
    font-weight:700;
    padding:12px 32px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#fff;
    cursor:not-allowed;
    opacity:.55;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background .3s,opacity .3s;
  }
  .save-btn svg{width:16px;height:16px;}

  /* ---------- Hint ---------- */
  .hint{
    margin-top:12px;
    font-size:.75rem;
    color:var(--card-sub);
    animation:pulse-hint 2s ease-in-out infinite;
  }
  @keyframes pulse-hint{
    0%,100%{opacity:.6}
    50%{opacity:1}
  }

  /* ---------- Reduced motion ---------- */
  @media(prefers-reduced-motion:reduce){
    .card{
      transition:none !important;
    }
    .card-front,.card-back{
      backface-visibility:visible !important;
      -webkit-backface-visibility:visible !important;
      transform:none !important;
      transition:opacity .3s;
    }
    .card.flipped .card-front{opacity:0;position:absolute;pointer-events:none;}
    .card.flipped .card-back{opacity:1;position:relative;}
    .card:not(.flipped) .card-front{opacity:1;position:relative;}
    .card:not(.flipped) .card-back{opacity:0;position:absolute;pointer-events:none;}
    .shimmer-bar{animation:none !important;}
    @keyframes pulse-hint{0%,100%{opacity:.8}}
  }

  /* ---------- Responsive ---------- */
  @media(max-width:460px){
    .front-body{padding:24px 20px 20px;}
    .back-body{padding:20px 16px 16px;}
    .name{font-size:1.25rem;}
    .preset-btn{font-size:.75rem;padding:6px 14px;}
  }

  /* ---------- Dark preset overrides (via class on body) ---------- */
  body.dark-mode{
    --page-bg:#111;
    --page-text:#e0e0e0;
    --card-bg:#1a1a1a;
    --card-text:#f0f0f0;
    --card-sub:#999;
    --card-border:rgba(255,255,255,.1);
    --card-shadow:0 8px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  }
  body.dark-mode .preset-btn{
    background:#222;
    color:#ccc;
    border-color:rgba(255,255,255,.12);
  }
  body.dark-mode .preset-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  body.dark-mode .preset-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
</style>
</head>
<body>

<h1>Digital Namecard Preview</h1>

<!-- Preset Tabs -->
<div class="preset-bar">
  <button class="preset-btn active" data-preset="default">Default</button>
  <button class="preset-btn" data-preset="corporate">Corporate</button>
  <button class="preset-btn" data-preset="creative">Creative</button>
  <button class="preset-btn" data-preset="minimal-dark">Minimal Dark</button>
</div>

<!-- Card Scene -->
<div class="scene" id="scene" role="button" aria-label="카드를 클릭하여 뒤집기" tabindex="0">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="card-face card-front">
      <div class="shimmer-bar"></div>
      <div class="front-body">
        <div class="avatar">홍</div>
        <div class="name">홍길동</div>
        <div class="name-en">Gildong Hong</div>
        <div class="title">프리랜서 개발자</div>
        <div class="company">테크랩스 (TechLabs)</div>
      </div>
    </div>

    <!-- BACK -->
    <div class="card-face card-back">
      <div class="shimmer-bar"></div>
      <div class="back-body">
        <div class="section-title">Contact</div>

        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span class="info-text"><a href="mailto:hello@example.com">hello@example.com</a></span>
        </div>

        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span class="info-text">010-1234-5678</span>
        </div>

        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="info-text">서울특별시 강남구 테헤란로 123</span>
        </div>

        <div class="info-row">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="info-text"><a href="https://example.com" target="_blank">example.com</a></span>
        </div>

        <div class="section-title" style="margin-top:4px">Social</div>
        <div class="social-row">
          <span class="social-chip">LinkedIn</span>
          <span class="social-chip">GitHub</span>
          <span class="social-chip">Twitter</span>
        </div>

        <div class="qr-placeholder">QR Code<br>(demo)</div>
      </div>
    </div>

  </div>
</div>

<!-- Hint -->
<p class="hint" id="hint">카드를 클릭하여 뒤집기</p>

<!-- Save Button -->
<button class="save-btn" disabled title="데모용 — 실제 서비스에서 활성화됩니다">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
  연락처 저장
</button>

<script>
(function(){
  var card = document.getElementById('card');
  var scene = document.getElementById('scene');
  var hint = document.getElementById('hint');
  var presetBtns = document.querySelectorAll('.preset-btn');

  // Flip
  function toggle(){
    card.classList.toggle('flipped');
    hint.textContent = card.classList.contains('flipped')
      ? '카드를 클릭하여 앞면 보기'
      : '카드를 클릭하여 뒤집기';
  }
  scene.addEventListener('click', toggle);
  scene.addEventListener('keydown', function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
  });

  // Presets
  var presets = {
    'default':       { accent:'#3b82f6', accentEnd:'#60a5fa', dark:false },
    'corporate':     { accent:'#1e3a5f', accentEnd:'#2d5a8e', dark:false },
    'creative':      { accent:'#8b5cf6', accentEnd:'#a78bfa', dark:false },
    'minimal-dark':  { accent:'#888',    accentEnd:'#aaa',    dark:true  }
  };

  function applyPreset(name){
    var p = presets[name];
    if(!p) return;
    document.documentElement.style.setProperty('--accent', p.accent);
    document.documentElement.style.setProperty('--accent-end', p.accentEnd);
    if(p.dark) document.body.classList.add('dark-mode');
    else document.body.classList.remove('dark-mode');

    presetBtns.forEach(function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-preset')===name);
    });
  }

  presetBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      applyPreset(btn.getAttribute('data-preset'));
    });
  });

  // Match back height to front
  function syncHeight(){
    var front = card.querySelector('.card-front');
    var back = card.querySelector('.card-back');
    back.style.minHeight = front.offsetHeight + 'px';
  }
  syncHeight();
  window.addEventListener('resize', syncHeight);
})();
</script>
</body>
</html>
